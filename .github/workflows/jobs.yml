name: Refresh jobs
on:
  schedule:
    - cron: "17 10 * * *"   # every day around 5 AM Central
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: refresh-jobs
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull jobs from public boards
        run: node fetch-jobs.mjs
      - name: Save
        run: |
          git config user.name "junction-bot"
          git config user.email "junction-bot@users.noreply.github.com"
          git add jobs
          git diff --cached --quiet || git commit -m "Daily jobs refresh"
          git push
