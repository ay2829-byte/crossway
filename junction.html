<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Junction by Crossway</title>
<meta name="description" content="Junction by Crossway: hiring with no applications. Companies see their 10 best matches. Members build one profile and get invited.">
<meta property="og:title" content="Junction by Crossway">
<meta property="og:description" content="Where the right paths cross. No resumes, no applications, just your best matches.">
<meta property="og:image" content="logo.png">
<link rel="icon" href="logo.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Junction by Crossway. Layout: premium consumer. Pill role bar, a big headline, then a grid of large match cards. Detail opens as a full sheet. Candidate side is a host style profile: sticky identity card on the left, airy sections on the right */
:root{
  --bg:#FFFFFF;--surface:#F7F7F7;--ink:#222222;--ink2:#484848;--muted:#717171;--faint:#B0B0B0;--line:#EBEBEB;
  --btn:#222222;--btn-ink:#FFFFFF;--accent:#3B5BDB;--good:#0B8A6F;--good-soft:#E7F6F1;--wait:#B26B00;--wait-soft:#FFF4E0;
  --b:#3B5BDB;--o:#F2643D;--t:#12A38A;
  --f:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sh:0 6px 20px rgba(0,0,0,.08);--sh2:0 2px 6px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111214;--surface:#1B1C20;--ink:#F2F2F3;--ink2:#CFCFD4;--muted:#9A9BA3;--faint:#5C5D66;--line:#2A2B31;
  --btn:#F2F2F3;--btn-ink:#111214;--accent:#7B93F2;--good:#3CC9A8;--good-soft:#13302A;--wait:#F0AE4A;--wait-soft:#33281A;
  --sh:0 8px 28px rgba(0,0,0,.45);--sh2:0 2px 8px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111214;--surface:#1B1C20;--ink:#F2F2F3;--ink2:#CFCFD4;--muted:#9A9BA3;--faint:#5C5D66;--line:#2A2B31;
  --btn:#F2F2F3;--btn-ink:#111214;--accent:#7B93F2;--good:#3CC9A8;--good-soft:#13302A;--wait:#F0AE4A;--wait-soft:#33281A;
  --sh:0 8px 28px rgba(0,0,0,.45);--sh2:0 2px 8px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:8px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{max-width:1280px;margin:0 auto;padding-block:14px;padding-inline:24px;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:19px;letter-spacing:-.035em}
.bars{display:inline-flex;flex-direction:column;gap:3px}
.bars i{display:block;height:4.5px;border-radius:3px}
.prod{display:flex;gap:4px}
.prod a,.prod span{padding:8px 14px;border-radius:99px;font-weight:500;font-size:14px;text-decoration:none;color:var(--muted)}
.prod a:hover{color:var(--ink);background:var(--surface)}
.prod span{color:var(--ink)}
.sp{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:99px;padding:4px;box-shadow:var(--sh2)}
.seg button{padding:7px 16px;border-radius:99px;font-weight:500;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--btn);color:var(--btn-ink)}

/* buttons + bits */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 22px;font-weight:600;font-size:14px;white-space:nowrap;transition:transform .1s,background .15s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn.dark{background:var(--btn);color:var(--btn-ink)}
.btn.dark:hover{opacity:.88}
.btn.brand{background:linear-gradient(90deg,var(--b),#5B6FE6);color:#fff}
.btn.brand:hover{opacity:.92}
.btn.line{border:1px solid var(--ink);color:var(--ink)}
.btn.line:hover{background:var(--surface)}
.btn.ghost{color:var(--ink);text-decoration:underline;text-underline-offset:3px;padding:12px 10px}
.btn:disabled{opacity:.35;cursor:default;transform:none}
.ulink{font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.ulink:hover{color:var(--muted)}
.xbtn{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;color:var(--ink)}
.xbtn:hover{background:var(--surface)}
.pillx{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.s-invited{background:var(--wait-soft);color:var(--wait)}
.s-accepted,.s-interviewing,.s-offer,.s-hired{background:var(--good-soft);color:var(--good)}
.s-declined{background:var(--surface);color:var(--muted)}
.tagl{display:inline-flex;align-items:center;padding:7px 14px;border-radius:99px;border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--ink2);white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tagl.hit{border-color:var(--ink);color:var(--ink)}
.tagl.pick{cursor:pointer;transition:border-color .15s,background .15s}
.tagl.pick:hover{border-color:var(--ink)}
.tagl.on{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.tagl.on2{background:var(--good-soft);color:var(--good);border-color:transparent}
.ava{border-radius:50%;display:grid;place-items:center;font-weight:600;color:#2A2440;letter-spacing:-.02em;flex:none}
.sw{display:inline-flex;align-items:center;gap:12px;cursor:pointer;user-select:none;font-size:14px}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw .tr{width:44px;height:26px;border-radius:99px;background:var(--faint);position:relative;transition:.2s;flex:none}
.sw .tr::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.sw input:checked+.tr{background:var(--ink)}
.sw input:checked+.tr::after{left:21px}
.sw input:focus-visible+.tr{outline:2px solid var(--ink);outline-offset:3px}

/* recruiter */
.page{max-width:1280px;margin:0 auto;padding-block:20px 80px;padding-inline:24px}
.rolebar{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 18px;scrollbar-width:none}
.rolebar::-webkit-scrollbar{display:none}
.rp{flex:none;text-align:left;padding:10px 18px;border-radius:16px;border:1px solid var(--line);display:flex;flex-direction:column;transition:border-color .15s,box-shadow .15s}
.rp:hover{border-color:var(--faint)}
.rp b{font-weight:600;font-size:14px}
.rp span{font-size:12.5px;color:var(--muted)}
.rp.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.rp.add{border-style:dashed;justify-content:center;flex-direction:row;align-items:center;gap:8px;font-weight:600}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;padding:22px 0 8px}
.hero h1{font-size:38px;font-weight:600;letter-spacing:-.035em;line-height:1.12;text-wrap:balance;max-width:20ch}
.hero .sub{margin-top:10px;color:var(--muted);font-size:15px;display:flex;flex-wrap:wrap;gap:4px 0}
.hero .sub span+span::before{content:"·";margin:0 10px}
.mini{display:flex;border-radius:99px;background:var(--surface);padding:4px}
.mini button{padding:8px 18px;border-radius:99px;font-weight:500;font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center}
.mini button.on{background:var(--bg);color:var(--ink);box-shadow:var(--sh2)}
.mini .n{font-size:12px;color:var(--muted)}
.needs{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-size:13.5px;color:var(--ink2)}
.needs b{font-weight:600;color:var(--ink)}
.blind{display:flex;align-items:center;gap:10px;margin:22px 0 4px;padding:14px 18px;border-radius:16px;background:var(--surface);font-size:13.5px;color:var(--ink2)}
.blind svg{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:36px 24px;margin-top:28px}
.mc{text-align:left;display:flex;flex-direction:column;gap:12px;cursor:pointer}
.mc .cv{position:relative;aspect-ratio:5/4;max-width:100%;border-radius:20px;display:grid;place-items:center;overflow:hidden;transition:transform .25s ease,box-shadow .25s}
.mc:hover .cv{transform:translateY(-3px);box-shadow:var(--sh)}
.mc .cv .ini{font-size:64px;font-weight:600;letter-spacing:-.05em;color:rgba(30,25,60,.82)}
.mc .cv .score{position:absolute;top:14px;left:14px;background:#fff;color:#222;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.12);font-variant-numeric:tabular-nums}
.mc .cv .score small{font-weight:500;color:#717171;margin-left:3px}
.mc .cv .rk{position:absolute;top:14px;right:16px;font-size:13px;font-weight:600;color:rgba(30,25,60,.55)}
.mc .cv .pillx{position:absolute;bottom:14px;left:14px}
.mc .cv .s-invited{background:#FFF4E0;color:#9A5C00}
.mc .cv .s-accepted,.mc .cv .s-interviewing,.mc .cv .s-offer,.mc .cv .s-hired{background:#E7F6F1;color:#08745D}
.mc .t1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.mc .t1 b{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc .t1 span{font-size:13px;color:var(--good);font-weight:600;white-space:nowrap}
.mc .t1 span.meh{color:var(--wait)}
.mc p{color:var(--muted);font-size:14px;line-height:1.45}
.mc .t3{font-size:14px;color:var(--ink2)}
.mc.new .cv{animation:glow 1.2s ease}
@keyframes glow{0%{box-shadow:0 0 0 6px var(--good-soft)}100%{box-shadow:none}}
.pipe{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:20px;overflow-x:auto;padding:28px 2px 8px}
.pc{display:flex;flex-direction:column;gap:12px}
.pch{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:15px;padding-bottom:4px}
.pch span{color:var(--muted);font-weight:500;font-size:13px}
.kc{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:18px;background:var(--bg);box-shadow:var(--sh);cursor:pointer;text-align:left}
.kc .kt{display:flex;gap:12px;align-items:center}
.kc b{font-weight:600;font-size:14px;display:block}
.kc .m{font-size:12.5px;color:var(--muted)}
.kc .ulink{font-size:13px;align-self:flex-start}
.kempty{border:1.5px dashed var(--line);border-radius:18px;padding:22px;text-align:center;color:var(--faint);font-size:13px}
.sync{display:flex;align-items:center;gap:12px;margin-top:28px;color:var(--muted);font-size:13.5px}
.empty{grid-column:1/-1;padding:60px 20px;text-align:center;color:var(--muted)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:50;padding:24px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.sheet{background:var(--bg);border-radius:24px;width:min(860px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:rise .3s ease;overflow:hidden}
.sheet.sm{width:min(560px,100%)}
.shh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.shh h2{font-size:16px;font-weight:600}
.shb{overflow:auto;padding:28px 32px;display:flex;flex-direction:column;gap:28px}
.shf{padding:16px 24px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;justify-content:flex-end}
.shf .note{margin-right:auto;color:var(--muted);font-size:13px}
.dtop{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.dtop h2{font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1.15}
.dtop p{color:var(--muted);font-size:15px;margin-top:4px}
.dcols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px}
.dsec{display:flex;flex-direction:column;gap:14px}
.dsec+.dsec{padding-top:28px;border-top:1px solid var(--line)}
.dsec h3{font-size:19px;font-weight:600;letter-spacing:-.02em}
.scorecard{position:sticky;top:0;border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--sh);align-self:start}
.scorecard .big{font-size:44px;font-weight:600;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.scorecard .big small{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:6px}
.bk{display:flex;flex-direction:column;gap:10px}
.bk div{display:grid;grid-template-columns:96px 1fr 40px;gap:12px;align-items:center;font-size:13px;color:var(--ink2)}
.bk div span:last-child{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:4px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px}
.whys{list-style:none;padding:0;display:flex;flex-direction:column;gap:14px}
.whys li{display:flex;gap:14px;align-items:flex-start;font-size:15px;color:var(--ink2)}
.whys li svg{margin-top:2px;color:var(--ink)}
.whys li.meh svg{color:var(--wait)}
.facts{display:flex;flex-direction:column;gap:16px}
.fact{display:flex;gap:16px;align-items:flex-start}
.fact svg{width:24px;height:24px;margin-top:2px}
.fact b{display:block;font-weight:600;font-size:15px}
.fact span{color:var(--muted);font-size:14px}
.xp{display:flex;flex-direction:column;gap:18px}
.xpi{display:flex;gap:16px;align-items:center}
.logo{width:48px;height:48px;border-radius:12px;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--ink2);flex:none}
.xpi b{display:block;font-weight:600;font-size:15px}
.xpi span{color:var(--muted);font-size:14px}
.f{display:flex;flex-direction:column;gap:8px;min-width:0}
.f.full{grid-column:1/-1}
.f label,.lbl{font-size:14px;font-weight:600}
.hint{font-size:13px;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--faint);background:var(--bg);border-radius:12px;padding:13px 14px;min-width:0;width:100%;font-size:15px;transition:border-color .15s,box-shadow .15s}
.f textarea{resize:vertical;min-height:110px;line-height:1.6}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.time{border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;transition:border-color .15s}
.time:hover{border-color:var(--ink)}
.time b{font-weight:600;font-size:14px}
.time span{color:var(--muted);font-size:13px}
.time.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.xrow{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.xrow .grow{flex:1;min-width:0}

/* candidate */
.cpage{max-width:1120px;margin:0 auto;padding-block:40px 80px;padding-inline:24px}
.hello h1{font-size:38px;font-weight:600;letter-spacing:-.035em;line-height:1.12}
.hello p{color:var(--muted);font-size:16px;margin-top:8px}
.invite{margin-top:28px;border-radius:28px;padding:32px;background:linear-gradient(135deg,#EEF1FF 0%,#F4EEFF 45%,#E8F7F2 100%);color:#222;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;position:relative;overflow:hidden}
.invite::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:#F2643D;opacity:.10;filter:blur(20px)}
.invite .from{display:flex;gap:14px;align-items:center}
.invite .logo{background:#fff;color:#222;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.invite h2{font-size:26px;font-weight:600;letter-spacing:-.03em;line-height:1.2;margin-top:18px;text-wrap:balance}
.invite .meta{color:#5A5A66;font-size:14px;margin-top:6px}
.invite blockquote{margin:18px 0 0;font-size:15px;line-height:1.6;color:#3A3A44}
.invite .times .time{background:rgba(255,255,255,.7);border-color:rgba(0,0,0,.08);color:#222}
.invite .times .time span{color:#6A6A74}
.invite .times .time.on{background:#fff;border-color:#222;box-shadow:0 0 0 1px #222}
.invite .times{grid-template-columns:1fr}
.invite .acts{display:flex;gap:12px;margin-top:16px;align-items:center}
.invite .acts .dark{background:#222;color:#fff}
.invite .acts .ghost{color:#222}
.invite .lbl{color:#222}
.invite.done{grid-template-columns:1fr;padding:24px 28px}
.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:64px;margin-top:44px;align-items:start}
.idcard{position:sticky;top:96px;border-radius:24px;box-shadow:var(--sh);padding:28px;display:flex;flex-direction:column;gap:20px;border:1px solid var(--line)}
.idtop{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.idtop h2{font-size:26px;font-weight:600;letter-spacing:-.03em;margin-top:10px}
.idtop p{color:var(--muted);font-size:14px}
.idstats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.idstats div{padding:14px 4px;text-align:center}
.idstats div+div{border-left:1px solid var(--line)}
.idstats b{display:block;font-size:20px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.idstats span{font-size:12px;color:var(--muted)}
.strength{display:flex;flex-direction:column;gap:8px;font-size:13px}
.strength .row1{display:flex;justify-content:space-between}
.strength .bar{height:6px}
.strength .bar i{background:linear-gradient(90deg,var(--b),var(--t))}
.idacts{display:flex;flex-direction:column;gap:10px}
.pv{border-radius:16px;padding:14px 16px;background:var(--wait-soft);color:var(--wait);font-size:13.5px;font-weight:500}
.sections{display:flex;flex-direction:column}
.sect{padding:36px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:18px}
.sect:first-child{padding-top:0}
.sect:last-child{border-bottom:0}
.secth{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.secth h2{font-size:24px;font-weight:600;letter-spacing:-.03em}
.about{font-size:16px;line-height:1.7;color:var(--ink2);max-width:62ch}
.lfgrid{display:grid;grid-template-columns:1fr 1fr;gap:22px 28px}
.sample{display:flex;gap:16px;align-items:center;padding:18px;border-radius:18px;border:1px solid var(--line)}
.sample .logo{background:var(--good-soft);color:var(--good)}
.sample b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stand{display:flex;flex-direction:column}
.sti{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0}
.sti+.sti{border-top:1px solid var(--line)}
.sti b{display:block;font-weight:600;font-size:15px}
.sti span.m{color:var(--muted);font-size:13.5px}

#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--btn);color:var(--btn-ink);padding:12px 20px;border-radius:14px;font-size:14px;font-weight:500;opacity:0;transition:.25s;z-index:60;max-width:calc(100% - 32px);pointer-events:none;box-shadow:0 12px 30px rgba(0,0,0,.25)}
#toast.on{opacity:1;transform:translateX(-50%)}

@media (max-width:960px){
  .layout{grid-template-columns:minmax(0,1fr);gap:36px}
  .idcard{position:static}
  .dcols{grid-template-columns:1fr;gap:28px}
  .invite{grid-template-columns:1fr;gap:20px;padding:24px}
}
@media (max-width:640px){
  .topin{gap:12px;padding-inline:16px}.page,.cpage{padding-inline:16px}
  .prod{display:none}

.flame svg{position:relative;z-index:1}
.flame.lit::before{content:"";position:absolute;inset:8px;border-radius:50%;background:radial-gradient(circle,rgba(255,150,70,.7),rgba(255,150,70,0) 70%);filter:blur(6px);animation:glow 2.4s ease-in-out infinite}
.flame.lit .fo{transform-box:fill-box;transform-origin:50% 100%;animation:fo 2.4s ease-in-out infinite}
.flame.lit .fi{transform-box:fill-box;transform-origin:50% 100%;animation:fi .9s ease-in-out infinite alternate}
.flame.lit.done{background:#FFE6D6}
@keyframes fo{0%,100%{transform:scale(1,1)}35%{transform:scale(.98,1.05)}70%{transform:scale(1.01,.98)}}
@keyframes fi{from{transform:scale(.9,.86);opacity:.8}to{transform:scale(1.04,1.1);opacity:1}}
@keyframes glow{0%,100%{opacity:.55;transform:scale(.95)}50%{opacity:1;transform:scale(1.12)}}

  const must=j.must.length?mh.length/j.must.length:1,nice=j.nice.length?nh.length/j.nice.length:1;

e name of the McDonald brothers' 1948 assembly line kitchen?", "options": ["Lean Kitchen", "Six Sigma", "Just in Time", "The Speedee Service System"], "answer": 3, "explain": "They cut the menu to a few items and ran the kitchen like a factory line, so food came out in seconds.", "source": "McDonald's, 1948"}, {"id": 3010, "prompt": "In 2000 Blockbuster reportedly passed on buying Netflix for how much?", "options": ["$5 billion", "$5 million", "$50 million", "$500 million"], "answer": 2, "explain": "Reed Hastings offered to sell Netflix for about $50 million. Blockbuster declined and filed for bankruptcy in 2010.", "source": "Netflix, 2000"}, {"id": 3011, "prompt": "A Kodak engineer built the first digital camera in which year?", "options": ["1975", "1995", "1965", "1985"], "answer": 0, "explain": "Steve Sasson's prototype took 23 seconds to record an image. Kodak held back on digital to protect its film business.", "source": "Kodak, 1975"}, {"id": 3012, "prompt": "Six Sigma quality methods were developed at which company?", "options": ["General Electric", "Ford", "Toyota", "Motorola"], "answer": 3, "explain": "Engineer Bill Smith introduced it at Motorola in 1986. GE made it famous in the 1990s.", "source": "Motorola, 1986"}, {"id": 3013, "prompt": "In 1973 FedEx founder Fred Smith reportedly kept the company afloat by doing what?", "options": ["Winning about $27,000 at blackjack in Las Vegas", "Taking out a credit card loan", "Selling his house", "Getting a government contract"], "answer": 0, "explain": "With fuel money running out, Smith flew to Las Vegas and won enough to make payroll for another week.", "source": "FedEx, 1973"}, {"id": 3014, "prompt": "When Lehman Brothers filed for bankruptcy in 2008, about how large were its assets?", "options": ["$64 billion", "$6.4 trillion", "$6 billion", "$639 billion"], "answer": 3, "explain": "It is still the largest bankruptcy filing in US history.", "source": "Lehman Brothers, 2008"}, {"id": 3015, "prompt": "WeWork pulled its IPO in 2019. About how high had its private valuation been?", "options": ["$470 billion", "$470 million", "$47 billion", "$4.7 billion"], "answer": 2, "explain": "Investors balked once its losses and governance issues were public, and the valuation collapsed.", "source": "WeWork, 2019"}, {"id": 3016, "prompt": "Using the rule of 72, about how many years does it take money to double at 8% a year?", "options": ["72 years", "6 years", "9 years", "12 years"], "answer": 2, "explain": "Divide 72 by the growth rate: 72 divided by 8 is 9.", "source": "Rule of 72"}, {"id": 3017, "prompt": "In which year did Netflix stop its DVD by mail service?", "options": ["2013", "2023", "2020", "2017"], "answer": 1, "explain": "Netflix shipped its last red envelopes in September 2023, about 25 years after it started.", "source": "Netflix, 2023"}, {"id": 3018, "prompt": "Walmart pioneered moving goods straight from inbound trucks to outbound trucks with almost no storage. What is that called?", "options": ["Drop shipping", "Kanban", "Just in case", "Cross docking"], "answer": 3, "explain": "Cross docking cuts warehouse time and inventory costs, a big part of Walmart's low prices.", "source": "Walmart"}, {"id": 3019, "prompt": "What is Jeff Bezos's \"two pizza\" rule?", "options": ["Teams should be small enough to feed with two pizzas", "Never hold more than two meetings a day", "Ship two features per sprint", "Always test two versions of every page"], "answer": 0, "explain": "Small teams communicate faster and own their work end to end.", "source": "Amazon"}, {"id": 3020, "prompt": "The 80/20 rule is named after which economist?", "options": ["Adam Smith", "John Maynard Keynes", "Milton Friedman", "Vilfredo Pareto"], "answer": 3, "explain": "Pareto noticed about 80% of Italy's land was owned by about 20% of the people. The pattern shows up everywhere.", "source": "Pareto principle"}, {"id": 3021, "prompt": "What kind of business was Berkshire Hathaway before Warren Buffett turned it into a holding company?", "options": ["A bank", "A textile maker", "A railroad", "An insurance company"], "answer": 1, "explain": "Buffett later called buying a struggling textile mill one of his biggest mistakes, then used it to buy better businesses.", "source": "Berkshire Hathaway"}, {"id": 3022, "prompt": "After Enron collapsed in 2001, which accounting firm went down with it?", "options": ["Deloitte", "Ernst & Young", "KPMG", "Arthur Andersen"], "answer": 3, "explain": "Arthur Andersen was convicted of obstruction for shredding Enron documents and lost its clients. The Supreme Court later overturned the conviction, but by then the firm was gone.", "source": "Enron, 2001 to 2002"}, {"id": 3023, "prompt": "In March 2021 the Ever Given container ship blocked the Suez Canal for about how long?", "options": ["6 months", "6 days", "6 weeks", "6 hours"], "answer": 1, "explain": "Hundreds of ships waited, and the blockage held up an estimated $9 billion of trade a day.", "source": "Suez Canal, 2021"}, {"id": 3024, "prompt": "Elizabeth Holmes, founder of Theranos, was found guilty of fraud in which year?", "options": ["2016", "2019", "2022", "2024"], "answer": 2, "explain": "A jury convicted her in January 2022 on four counts of defrauding investors.", "source": "Theranos trial, 2022"}, {"id": 3025, "prompt": "The Boeing 737 MAX was grounded worldwide in which year after two crashes?", "options": ["2021", "2017", "2015", "2019"], "answer": 3, "explain": "Regulators grounded it in March 2019. It returned to service in the US in late 2020 after software and training changes.", "source": "Boeing, 2019"}], "data": [{"id": 4001, "prompt": "In World War II, Abraham Wald told the military to add armor where returning planes had NO bullet holes. Why?", "options": ["Planes hit in those spots never made it back", "Pilots asked for it", "Bullets bounce off the wings", "Those areas were lighter"], "answer": 0, "explain": "This is survivorship bias. The data only came from planes that survived, so the missing holes showed where hits were fatal.", "source": "Abraham Wald, 1943"}, {"id": 4002, "prompt": "UC Berkeley's 1973 admissions looked biased against women overall, but not within most departments. What is this called?", "options": ["The base rate fallacy", "Regression to the mean", "Selection bias", "Simpson's paradox"], "answer": 3, "explain": "Women applied more often to very competitive departments. Adding the departments together reversed the pattern.", "source": "UC Berkeley, 1973"}, {"id": 4003, "prompt": "What does Anscombe's quartet show?", "options": ["Datasets with nearly identical summary stats can look completely different when plotted", "Averages beat medians", "Correlation proves causation", "Four data points are enough for a trend"], "answer": 0, "explain": "Francis Anscombe made four datasets with the same means, variances and correlation to show why you should always plot your data.", "source": "Francis Anscombe, 1973"}, {"id": 4004, "prompt": "To win the $1 million Netflix Prize, how much did a team have to improve on Netflix's own recommendation algorithm?", "options": ["10%", "25%", "1%", "50%"], "answer": 0, "explain": "BellKor's Pragmatic Chaos crossed 10% in 2009. Netflix never fully used the winning model because it was too complex to run.", "source": "Netflix Prize, 2009"}, {"id": 4005, "prompt": "Moneyball's Oakland A's found an undervalued stat that predicted winning. Which one?", "options": ["Runs batted in", "Stolen bases", "Batting average", "On base percentage"], "answer": 3, "explain": "Getting on base, including by walking, mattered more than the market valued it, so the A's bought it cheaply.", "source": "Oakland A's, 2002"}, {"id": 4006, "prompt": "Which retailer was reported in 2012 to predict pregnancies from shopping data?", "options": ["Walmart", "Costco", "Amazon", "Target"], "answer": 3, "explain": "Target's model spotted patterns like unscented lotion and supplements. It became a classic case on data and privacy.", "source": "The New York Times, 2012"}, {"id": 4007, "prompt": "What famously went wrong with Google Flu Trends in the 2012 to 2013 flu season?", "options": ["It leaked patient data", "It badly overestimated flu cases", "It missed the flu season entirely", "It only worked in Europe"], "answer": 1, "explain": "It predicted about double the doctor visits the CDC actually saw. Search behavior shifted and the model overfit.", "source": "Nature, 2013"}, {"id": 4008, "prompt": "In a right skewed distribution like household income, how do the mean and median usually compare?", "options": ["The mean is higher than the median", "The median is higher than the mean", "They're equal", "There's no pattern"], "answer": 0, "explain": "A few very high values pull the mean up, which is why median income is usually the fairer number.", "source": "Statistics basics"}, {"id": 4009, "prompt": "In SQL, which clause filters groups after GROUP BY?", "options": ["HAVING", "LIMIT", "WHERE", "ORDER BY"], "answer": 0, "explain": "WHERE filters rows before grouping. HAVING filters the grouped results, like HAVING COUNT(*) > 5.", "source": "SQL"}, {"id": 4010, "prompt": "What does a LEFT JOIN return?", "options": ["All rows from the right table", "Only rows that match in both tables", "All rows from the left table, plus matches from the right", "Every possible pair of rows"], "answer": 2, "explain": "Rows with no match on the right still show up, with NULLs in the right side columns.", "source": "SQL"}, {"id": 4011, "prompt": "What does a p value of 0.03 mean?", "options": ["If there were no real effect, results this extreme would show up about 3% of the time", "There's a 3% chance the hypothesis is true", "97% of users preferred the change", "The effect is 3% large"], "answer": 0, "explain": "A p value measures how surprising the data is under \"no effect.\" It does not tell you the probability that you're right.", "source": "Statistics basics"}, {"id": 4012, "prompt": "Ice cream sales and drownings rise together. What's the best explanation?", "options": ["It's a data error", "Hot weather drives both", "Ice cream causes drowning", "Drowning boosts ice cream sales"], "answer": 1, "explain": "A confounding variable, summer heat, moves both. It's the classic reminder that correlation isn't causation.", "source": "Statistics basics"}, {"id": 4013, "prompt": "In an A/B test, what happens if you keep checking and stop as soon as it looks significant?", "options": ["You get many more false positives", "Nothing changes", "You get more accurate results", "You need fewer users"], "answer": 0, "explain": "Peeking gives random noise many chances to look like a win. Fix the sample size in advance or use sequential testing.", "source": "Experimentation"}, {"id": 4014, "prompt": "Under Benford's law, how often does the leading digit 1 show up in many real world datasets?", "options": ["About 50% of the time", "About 30% of the time", "About 5% of the time", "About 11% of the time"], "answer": 1, "explain": "Smaller leading digits are more common. Auditors use this to flag made up numbers.", "source": "Benford's law"}, {"id": 4015, "prompt": "What did Florence Nightingale's 1858 rose chart show?", "options": ["Death rates were falling", "Battle wounds were the top cause of death", "Hospitals were overstaffed", "Most soldiers died from preventable disease, not battle wounds"], "answer": 3, "explain": "Her chart helped convince the British government to invest in sanitation.", "source": "Florence Nightingale, 1858"}, {"id": 4016, "prompt": "In 1854 John Snow mapped cholera deaths in London. What did the map point to?", "options": ["A contaminated water pump on Broad Street", "A hospital", "Bad air from the river", "A local market"], "answer": 0, "explain": "Deaths clustered around one pump. Once its handle was removed, cases dropped, an early win for data driven public health.", "source": "John Snow, 1854"}, {"id": 4017, "prompt": "The Literary Digest polled over 2 million people and predicted Landon would beat FDR in 1936. Why was it so wrong?", "options": ["The math was wrong", "Too few people were polled", "Voters lied", "The sample skewed wealthy, drawn from car and phone owners"], "answer": 3, "explain": "A huge but biased sample beat a small fair one at nothing. FDR won in a landslide.", "source": "Literary Digest, 1936"}, {"id": 4018, "prompt": "What does a cohort retention chart show?", "options": ["What share of users who joined in the same period keep coming back over time", "Users by country", "Revenue by product", "Total users each month"], "answer": 0, "explain": "Grouping users by signup period shows whether newer cohorts retain better than older ones.", "source": "Product analytics"}, {"id": 4019, "prompt": "Goodhart's law says what?", "options": ["Data grows twice as fast each year", "When a measure becomes a target, it stops being a good measure", "Every metric has an equal opposite", "More data always beats better models"], "answer": 1, "explain": "Once people are rewarded on a number, they find ways to move the number without moving the goal.", "source": "Charles Goodhart, 1975"}, {"id": 4020, "prompt": "Before the Challenger launch in 1986, engineers looked at O ring problems from past flights. What mistake did that analysis make?", "options": ["It used too much data", "It ignored the weather forecast", "It left out flights with no O ring problems, hiding the cold temperature pattern", "It only used simulations"], "answer": 2, "explain": "With all flights included, the link between cold and O ring failure is clear. Edward Tufte later made this a classic case.", "source": "Rogers Commission, 1986"}, {"id": 4021, "prompt": "In 2020 England missed about 16,000 COVID cases in its reporting. What caused it?", "options": ["A hacked server", "A typo in a formula", "A power outage", "An old Excel file format ran out of rows"], "answer": 3, "explain": "Results were stored in the older .xls format, which caps at 65,536 rows, so extra rows were silently dropped.", "source": "Public Health England, 2020"}, {"id": 4022, "prompt": "The influential 2010 Reinhart and Rogoff paper on debt and growth had what error?", "options": ["A spreadsheet formula left out several countries", "It used the wrong decade", "It mixed up two currencies", "It used fake data"], "answer": 0, "explain": "A graduate student found the Excel range skipped rows. Fixing it weakened the paper's headline finding.", "source": "Herndon, Ash and Pollin, 2013"}, {"id": 4023, "prompt": "In SQL, how is COUNT(column) different from COUNT(*)?", "options": ["COUNT(column) is always faster", "COUNT(column) skips NULL values", "COUNT(*) skips duplicates", "There's no difference"], "answer": 1, "explain": "COUNT(*) counts rows, while COUNT(column) counts only rows where that column has a value.", "source": "SQL"}, {"id": 4024, "prompt": "In a normal distribution, about what share of values fall within one standard deviation of the mean?", "options": ["99.7%", "68%", "95%", "50%"], "answer": 1, "explain": "About 68% within one, 95% within two, and 99.7% within three standard deviations.", "source": "Statistics basics"}, {"id": 4025, "prompt": "Which SQL window function numbers rows within each group, like ranking orders per customer?", "options": ["COUNT()", "GROUP BY", "ROW_NUMBER()", "DISTINCT"], "answer": 2, "explain": "ROW_NUMBER() OVER (PARTITION BY customer ORDER BY date) gives each customer's orders 1, 2, 3 and so on.", "source": "SQL"}], "engineering": [{"id": 5001, "prompt": "In 2012 Knight Capital lost about $440 million in 45 minutes. What caused it?", "options": ["A rogue trader", "A power outage", "A cyberattack", "A bad software deployment that revived old code"], "answer": 3, "explain": "One of eight servers didn't get the new code and ran an old, dead feature that fired off millions of trades.", "source": "Knight Capital, 2012"}, {"id": 5002, "prompt": "Why was NASA's Mars Climate Orbiter lost in 1999?", "options": ["A solar storm", "A collision with a moon", "One team used imperial units and another used metric", "A dead battery"], "answer": 2, "explain": "Thruster data was in pound force seconds but the software expected newton seconds. The probe flew too low into the atmosphere.", "source": "NASA, 1999"}, {"id": 5003, "prompt": "Why did the first Ariane 5 rocket blow up in 1996?", "options": ["A 64 bit number was squeezed into a 16 bit integer and overflowed", "A fuel leak", "Bad weather", "A wiring fault"], "answer": 0, "explain": "Code reused from Ariane 4 couldn't handle Ariane 5's faster flight, and the overflow crashed the guidance system.", "source": "ESA, 1996"}, {"id": 5004, "prompt": "The 2014 Heartbleed bug was found in which widely used library?", "options": ["OpenSSL", "Log4j", "Apache Struts", "Bash"], "answer": 0, "explain": "A missing bounds check let attackers read server memory, which could expose passwords and private keys.", "source": "Heartbleed, 2014"}, {"id": 5005, "prompt": "In 2016, removing the tiny npm package \"left-pad\" broke builds around the world. About how long was it?", "options": ["110 lines", "11,000 lines", "11 lines", "1,100 lines"], "answer": 2, "explain": "Thousands of projects depended on it indirectly. npm changed its rules on unpublishing packages afterward.", "source": "npm, 2016"}, {"id": 5006, "prompt": "What triggered the big AWS S3 outage in February 2017?", "options": ["A hurricane", "A typo in a command that took down more servers than intended", "A DDoS attack", "An expired certificate"], "answer": 1, "explain": "An engineer debugging billing meant to remove a few servers, and one mistyped input removed far more.", "source": "AWS, 2017"}, {"id": 5007, "prompt": "In July 2024 a faulty CrowdStrike update crashed about how many Windows devices?", "options": ["85 million", "85,000", "850 million", "8.5 million"], "answer": 3, "explain": "Microsoft estimated 8.5 million machines, grounding flights and taking hospitals and banks offline.", "source": "Microsoft, 2024"}, {"id": 5008, "prompt": "What is the time complexity of binary search on a sorted array?", "options": ["O(n log n)", "O(n)", "O(log n)", "O(1)"], "answer": 2, "explain": "Each step halves what's left, so a million items take about 20 steps.", "source": "Algorithms"}, {"id": 5009, "prompt": "What is the average time to look up a key in a hash map?", "options": ["O(n)", "O(n\u00b2)", "O(log n)", "O(1)"], "answer": 3, "explain": "Hashing jumps straight to the bucket. Many collisions can make it slower in the worst case.", "source": "Data structures"}, {"id": 5010, "prompt": "Who created Git in 2005?", "options": ["Guido van Rossum", "Linus Torvalds", "Tim Berners Lee", "Bjarne Stroustrup"], "answer": 1, "explain": "Torvalds built Git in a few weeks after the Linux kernel lost free access to BitKeeper.", "source": "Git, 2005"}, {"id": 5011, "prompt": "Microsoft bought GitHub in 2018 for how much?", "options": ["$2.5 billion", "$750 million", "$7.5 billion", "$75 billion"], "answer": 2, "explain": "Microsoft paid $7.5 billion in stock. Many developers worried, but GitHub kept running independently.", "source": "Microsoft, 2018"}, {"id": 5012, "prompt": "What caused the Year 2000 (Y2K) problem?", "options": ["Clocks couldn't count past midnight", "Computers ran out of memory", "Software stored years as two digits", "Leap years broke calendars"], "answer": 2, "explain": "To save memory, years like 1999 were stored as 99, so 2000 could read as 1900. Fixes cost hundreds of billions worldwide.", "source": "Y2K"}, {"id": 5013, "prompt": "What is the Year 2038 problem?", "options": ["Leap seconds stop working", "32 bit Unix time overflows in January 2038", "IPv4 addresses run out", "GPS dates reset"], "answer": 1, "explain": "Signed 32 bit counters of seconds since 1970 max out on January 19, 2038. Systems are moving to 64 bit time.", "source": "Unix time"}, {"id": 5014, "prompt": "According to the CAP theorem, when the network splits, a distributed system must choose between what?", "options": ["Consistency and availability", "Speed and cost", "Memory and storage", "Security and privacy"], "answer": 0, "explain": "During a partition you either reject some requests to stay consistent, or answer them and risk stale data.", "source": "Eric Brewer, 2000"}, {"id": 5015, "prompt": "Which HTTP status code means you've sent too many requests?", "options": ["429", "301", "500", "404"], "answer": 0, "explain": "429 Too Many Requests tells clients to back off, often with a Retry After header.", "source": "HTTP"}, {"id": 5016, "prompt": "What is the worst case time complexity of quicksort?", "options": ["O(n)", "O(n log n)", "O(log n)", "O(n\u00b2)"], "answer": 3, "explain": "Bad pivots, like always picking the first item of a sorted list, make it quadratic. Random pivots avoid this in practice.", "source": "Algorithms"}, {"id": 5017, "prompt": "Facebook, Instagram and WhatsApp went down for about six hours in October 2021. What caused it?", "options": ["A bad network configuration change that withdrew its BGP routes", "A ransomware attack", "A data center fire", "An expired domain"], "answer": 0, "explain": "Facebook's servers disappeared from the internet, and even the badge readers that engineers needed to get in stopped working.", "source": "Meta, 2021"}, {"id": 5018, "prompt": "Who created the Python programming language?", "options": ["Dennis Ritchie", "James Gosling", "Brendan Eich", "Guido van Rossum"], "answer": 3, "explain": "Van Rossum started Python as a holiday project in late 1989 and named it after Monty Python.", "source": "Python"}, {"id": 5019, "prompt": "JavaScript was first written in about how long, in 1995?", "options": ["2 years", "10 months", "10 days", "10 weeks"], "answer": 2, "explain": "Brendan Eich built the first version at Netscape in about 10 days. Some quirks from that rush are still around.", "source": "Netscape, 1995"}, {"id": 5020, "prompt": "What is the standard way to prevent SQL injection?", "options": ["Hiding error messages", "Parameterized queries", "Encrypting the database", "Longer passwords"], "answer": 1, "explain": "Placeholders keep user input as data, so it can never run as part of the SQL command.", "source": "OWASP"}, {"id": 5021, "prompt": "Which HTTP method is meant to be idempotent, so repeating it has the same effect as doing it once?", "options": ["PUT", "CONNECT", "POST", "PATCH"], "answer": 0, "explain": "PUT replaces a resource, so sending it twice leaves the same result. POST can create duplicates.", "source": "HTTP"}, {"id": 5022, "prompt": "Phil Karlton said there are only two hard things in computer science. Cache invalidation and what?", "options": ["Naming things", "Recursion", "Regular expressions", "Sorting"], "answer": 0, "explain": "It's a long running joke because both really are hard to get right.", "source": "Phil Karlton"}, {"id": 5023, "prompt": "How are containers like Docker different from virtual machines?", "options": ["Containers share the host's operating system kernel", "Containers each run a full operating system", "Containers can't use the network", "Containers only run on Linux laptops"], "answer": 0, "explain": "Sharing the kernel makes containers start in seconds and use far less memory than full virtual machines.", "source": "Containers"}, {"id": 5024, "prompt": "What caused the deadly Therac 25 radiation overdoses in the 1980s?", "options": ["A software race condition", "Operator training", "A power surge", "A broken sensor"], "answer": 0, "explain": "When operators typed fast, the software could fire high power beams without the safety shield in place.", "source": "Therac 25, 1985 to 1987"}, {"id": 5025, "prompt": "Linus Torvalds first released the Linux kernel in which year?", "options": ["1981", "1991", "2001", "1998"], "answer": 1, "explain": "He posted it as \"just a hobby, won't be big and professional.\" It now runs most of the world's servers.", "source": "Linux, 1991"}]};

/* ================= Experience + education editing ================= */
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const nowYM=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};
const fmtYM=s=>{if(!s||!/^\d{4}-\d{2}$/.test(s))return"";const[y,m]=s.split("-");return MON[+m-1]+" "+y};
const ymNum=s=>{const[y,m]=s.split("-");return +y*12+(+m-1)};
const expMonths=e=>{if(!e.start)return null;const a=ymNum(e.start),b=ymNum(e.current||!e.end?nowYM():e.end);return Math.max(1,b-a+1)};
const durTxt=m=>{const y=Math.floor(m/12),r=m%12;return [y?y+" "+(y===1?"yr":"yrs"):"",r?r+" "+(r===1?"mo":"mos"):""].filter(Boolean).join(" ")||"1 mo"};
function calcYears(exp){const iv=(exp||[]).filter(e=>e.start).map(e=>[ymNum(e.start),ymNum(e.current||!e.end?nowYM():e.end)]).sort((a,b)=>a[0]-b[0]);
  if(!iv.length)return null;let tot=0,[s,e]=iv[0];for(const[a,b]of iv.slice(1)){if(a<=e+1)e=Math.max(e,b);else{tot+=e-s+1;[s,e]=[a,b]}}tot+=e-s+1;return Math.floor(tot/12)}
function expWhen(e){const m=expMonths(e);if(m==null)return e.y?yrs(e.y):"";return `${fmtYM(e.start)} to ${e.current||!e.end?"Present":fmtYM(e.end)} · ${durTxt(m)}`}
function expItem(e){const b=(e.bullets||[]).filter(Boolean);
  return `<div class="xpi xpe">${logoBox(e.co,e.dom?FAV(e.dom):"")}<div style="min-width:0"><b>${esc(e.t)}</b><span>${esc(e.co)}${expWhen(e)?" · "+esc(expWhen(e)):""}</span>${b.length?`<ul class="xb">${b.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}</div></div>`}
const mv=(arr,i,j)=>{if(j<0||j>=arr.length)return;const[x]=arr.splice(i,1);arr.splice(j,0,x)};
const rowCtl=(kind,i,n)=>`<div class="rctl"><button class="xbtn" data-act="${kind}up" data-i="${i}" aria-label="Move up" ${i===0?"disabled":""}>${svg('<path d="M6 15l6-6 6 6"/>')}</button><button class="xbtn" data-act="${kind}down" data-i="${i}" aria-label="Move down" ${i===n-1?"disabled":""}>${svg('<path d="M6 9l6 6 6-6"/>')}</button><button class="ulink" data-act="${kind}edit" data-i="${i}">Edit</button><button class="xbtn" data-act="${kind}del" data-i="${i}" aria-label="Remove">${I.x}</button></div>`;

function readExp(strict){const t=$("#xT").value.trim(),co=$("#xC").value.trim(),st=$("#xS").value,cur=$("#xNow").checked,en=cur?"":$("#xE").value;
  const bullets=$("#xB").value.split("\n").map(x=>x.replace(/^[\s•*\-]+/,"").trim()).filter(Boolean).slice(0,4).map(x=>x.slice(0,200));

    for(const u of srcs){try{const r=await fetch(u);if(!r.ok)continue;const d=await r.json();if(!Array.isArray(d)||!d.length)continue;
      const rows=Array.isArray(d[0])?d:d.map(x=>[x.name,(x.domains||[])[0]||"",x.alpha_two_code||""]);const seen=new Set();
      UNIS=rows.filter(([n])=>n&&!seen.has(n.toLowerCase())&&seen.add(n.toLowerCase())).map(([n,dom,cc])=>({n,dom,cc,l:n.toLowerCase(),a:acr(n)}));UNIMAP=new Map(UNIS.map(u=>[u.l,u]));return UNIS}catch(_){}}

function searchUnis(q){q=q.toLowerCase().trim();if(q.length<2||!UNIS)return[];const out=[];

function prepImage(file,size,mode){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas");c.width=c.height=size;const x=c.getContext("2d");

    else{const k=Math.min(size/img.width,size/img.height),w=img.width*k,h=img.height*k;x.drawImage(img,(size-w)/2,(size-h)/2,w,h)}
    URL.revokeObjectURL(img.src);c.toBlob(b=>b?res(b):rej(new Error("bad image")),mode==="cover"?"image/jpeg":"image/png",.88)};img.onerror=()=>rej(new Error("bad image"));img.src=URL.createObjectURL(file)})}

function whoAva(w,s){return w.company?`<span class="lw" style="width:${s}px;height:${s}px">${logoBox(w.name,w.photo||coLogoUrl(w.name))}</span>`:personAva(w,s)}
function orbitLine(b){if(!b)return"";return `<div class="orbl"><span class="o1">${ORB}<b>${kfmt(b.orbit)}</b> in orbit</span><i></i><span class="o2"><b>${kfmt(b.crossings)}</b> ${+b.crossings===1?"crossing":"crossings"}</span></div>`}
function commentsInner(id){const L=S.cm[id];if(!L)return `<div class="cml"><span class="hint">Loading comments…</span></div>`;
  return `<div class="cml">${L.map(c=>`<div class="cmi"><button class="cmav" ${c.company?"":`data-act="person" data-u="${c.author_id}"`} aria-label="${whoName(c)}">${whoAva(c,32)}</button><div class="cmb2"><div class="cmh"><b>${whoName(c)}</b><small>${agoS(c.at)}</small>${c.can_delete?`<button class="ulink" data-act="cmdel" data-id="${c.id}" data-p="${id}">Delete</button>`:""}</div><p>${esc(c.body)}</p></div></div>`).join("")||`<span class="hint">No comments yet. Start the conversation.</span>`}
    <div class="cmin">${S.role==="seeker"?myAva(32):`<span class="lw" style="width:32px;height:32px">${logoBox((S.co&&S.co.name)||"",(S.co&&S.co.logo_url)||"")}</span>`}<textarea rows="1" maxlength="1000" data-cmin="${id}" placeholder="Add a comment"></textarea><button class="btn dark sm2" data-act="cmsend" data-id="${id}">Post</button></div></div>`}
function paintComments(id){document.querySelectorAll(`[data-cm="${id}"]`).forEach(el=>el.innerHTML=S.cmOpen[id]?commentsInner(id):"");
  const n=(S.cm[id]||[]).length;document.querySelectorAll(`[data-act=cmts][data-id="${id}"] .cn`).forEach(x=>x.textContent=n||"");
  [S.feed,S.chAns,S.top,S.personPosts].forEach(arr=>(arr||[]).forEach(p=>{if(p.id===id&&S.cm[id])p.comments=S.cm[id].length}))}
async function toggleComments(id,force){S.cmOpen[id]=force||!S.cmOpen[id];paintComments(id);
  if(S.cmOpen[id]){try{S.cm[id]=await API.comments(id)}catch(err){toast(friendly(err));S.cm[id]=S.cm[id]||[]}paintComments(id);const t=document.querySelector(`[data-cmin="${id}"]`);t&&t.focus()}}
async function sendComment(id){const t=document.querySelector(`[data-cmin="${id}"]`);if(!t)return;const b=t.value.trim();if(!b)return;t.value="";
  try{const c=await API.comment(id,b);(S.cm[id]=S.cm[id]||[]).push(c);paintComments(id);const t2=document.querySelector(`[data-cmin="${id}"]`);t2&&t2.focus()}catch(err){t.value=b;toast(friendly(err))}}
function paintOrbit(uid,on){document.querySelectorAll(`[data-act=orbit][data-u="${uid}"]`).forEach(b=>{const sm=b.classList.contains("sm");b.outerHTML=orbBtn(uid,on,sm)});
  [S.feed,S.chAns,S.top,S.personPosts].forEach(arr=>(arr||[]).forEach(p=>{if(p.author_id===uid)p.orbiting=on}))}

/* the editor pieces: chips you can remove, plus a box with suggestions you can type into */
function chipBox(field,items,listId,ph){return `<div class="chipbox"><div class="chips3">${items.map((v,i)=>`<span class="ch3">${esc(v)}<button type="button" data-act="chrm" data-f="${field}" data-i="${i}" aria-label="Remove ${esc(v)}">${I.x}</button></span>`).join("")}</div>
  <input id="in_${field}" list="${listId}" autocomplete="off" placeholder="${ph}" data-chip="${field}"><datalist id="${listId}">${(field==="titles"?Object.values(ROLE_TITLES).flat():PLACES).map(x=>`<option value="${esc(x)}">`).join("")}</datalist></div>`}
function syncRoles(){D.titles=D.titles||[];const tr=[];D.titles.forEach(t=>{const k=trackOfTitle(t);if(!tr.includes(k))tr.push(k)});D.roles=tr}
function addChip(field,v){v=String(v||"").trim().replace(/\s+/g," ");if(!v)return;const arr=field==="titles"?(D.titles=D.titles||[]):D.locs;
  if(arr.some(x=>x.toLowerCase()===v.toLowerCase()))return;if(arr.length>=8){toast("That's plenty. Remove one to add another.");return}
  const canon=(field==="titles"?Object.values(ROLE_TITLES).flat():PLACES).find(x=>x.toLowerCase()===v.toLowerCase());arr.push(canon||v);if(field==="titles")syncRoles();redrawChips(field)}
function redrawChips(field){const box=$(`#in_${field}`);if(!box)return;const w=box.closest(".chipbox");const items=field==="titles"?D.titles:D.locs;
  w.querySelector(".chips3").innerHTML=items.map((v,i)=>`<span class="ch3">${esc(v)}<button type="button" data-act="chrm" data-f="${field}" data-i="${i}" aria-label="Remove ${esc(v)}">${I.x}</button></span>`).join("");

  if(e.key==="Backspace"&&!t.value){const f=t.dataset.chip,arr=f==="titles"?D.titles:D.locs;if(arr&&arr.length){arr.pop();if(f==="titles")syncRoles();redrawChips(f)}}},true);

  if(e.inputType==="insertReplacementText"||(!e.inputType&&all.some(x=>x===t.value))){addChip(t.dataset.chip,t.value);t.value=""}});

/* ================= Showcase links, projects, files on posts, starter prompts, profile posts ================= */
const LINK_KINDS=[["github","GitHub",/(^|\.)github\.com$/],["figma","Figma",/(^|\.)figma\.com$/],["behance","Behance",/(^|\.)behance\.net$/],["dribbble","Dribbble",/(^|\.)dribbble\.com$/],
  ["linkedin","LinkedIn",/(^|\.)linkedin\.com$/],["medium","Medium",/(^|\.)medium\.com$/],["substack","Substack",/(^|\.)substack\.com$/],["kaggle","Kaggle",/(^|\.)kaggle\.com$/],
  ["notion","Notion",/(^|\.)notion\.(so|site)$/],["youtube","YouTube",/(^|\.)(youtube\.com|youtu\.be)$/],["x","X",/(^|\.)(x\.com|twitter\.com)$/],["tableau","Tableau",/(^|\.)tableau\.com$/],
  ["devpost","Devpost",/(^|\.)devpost\.com$/],["gitlab","GitLab",/(^|\.)gitlab\.com$/],["huggingface","Hugging Face",/(^|\.)huggingface\.co$/]];
const fixUrl=u=>{u=String(u||"").trim();if(!u)return"";if(!/^https?:\/\//i.test(u))u="https://"+u;try{const x=new URL(u);return /^https?:$/.test(x.protocol)&&x.hostname.includes(".")?x.href:""}catch(_){return""}};
const linkKind=u=>{const h=hostOf(u);const k=LINK_KINDS.find(x=>x[2].test(h));return k?{k:k[0],label:k[1]}:{k:"site",label:h||"Website"}};
const shortUrl=u=>{const f=fixUrl(u);if(!f)return u;const x=new URL(f);return (x.hostname.replace(/^www\./,"")+x.pathname).replace(/\/$/,"")};
const human=s=>{s=decodeURIComponent(String(s||"")).replace(/[-_+]+/g," ").replace(/\s+/g," ").trim();return s?s.charAt(0).toUpperCase()+s.slice(1):""};
const fmtSize=b=>b>=1048576?(b/1048576).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB";
const isImg=t=>/^image\//.test(t||"");
const SVGI={ext:svg('<path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>'),
  clip:svg('<path d="M20 11.5l-8.2 8.2a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/>'),
  img:svg('<rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M20 16l-5-5-8 8.5"/>'),
  doc:svg('<path d="M14 3.5H7A1.5 1.5 0 0 0 5.5 5v14A1.5 1.5 0 0 0 7 20.5h10a1.5 1.5 0 0 0 1.5-1.5V8z"/><path d="M14 3.5V8h4.5"/>'),
  back:svg('<path d="M15 6l-6 6 6 6"/>'),dl:svg('<path d="M12 4v11"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M5 19.5h14"/>')};
const linkIcon=u=>{const h=hostOf(u);return `<span class="lkico"><i>${esc((h||"?").charAt(0).toUpperCase())}</i>${h?`<img src="${FAV(h)}" alt="" loading="lazy" onerror="this.remove()">`:""}</span>`};

/* ---------- import a project from a link ---------- */
async function importLink(raw){const u=fixUrl(raw);if(!u)throw new Error("That doesn't look like a link. Try github.com/you/project");
  const x=new URL(u),h=x.hostname.replace(/^www\./,""),seg=x.pathname.split("/").filter(Boolean),out={u,t:"",d:""};
  if(/github\.com$/.test(h)&&seg.length>=2){out.t=human(seg[1]);
    try{const ctl=new AbortController();setTimeout(()=>ctl.abort(),5000);const r=await fetch(`https://api.github.com/repos/${seg[0]}/${seg[1]}`,{signal:ctl.signal});
      if(r.ok){const j=await r.json();out.t=human(j.name)||out.t;out.d=[j.description||"",j.language?`Built with ${j.language}.`:"",j.stargazers_count?`${j.stargazers_count} stars on GitHub.`:""].filter(Boolean).join(" ")}}catch(_){}}
  else if(/figma\.com$/.test(h)&&seg.length>=3)out.t=human(seg[2]);
  else if(/behance\.net$/.test(h)&&seg[0]==="gallery"&&seg[2])out.t=human(seg[2]);
  else if(/dribbble\.com$/.test(h)&&seg[0]==="shots"&&seg[1])out.t=human(seg[1].replace(/^\d+-?/,""));
  else if(/notion\.(so|site)$/.test(h)&&seg.length)out.t=human(seg[seg.length-1].replace(/-?[0-9a-f]{32}$/i,""));

const FILE_TYPES="image/png,image/jpeg,image/webp,image/gif,application/pdf,.pptx,.docx,.xlsx,.csv";
const MIME={pdf:"application/pdf",pptx:"application/vnd.openxmlformats-officedocument.presentationml.presentation",docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",csv:"text/csv"};
function shrinkImage(f){return new Promise(res=>{if(f.type==="image/gif"||f.size<900e3){res(f);return}const img=new Image();img.onload=()=>{const k=Math.min(1,1800/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);c.toBlob(b=>res(b&&b.size<f.size?b:f),"image/jpeg",.86)};img.onerror=()=>res(f);img.src=URL.createObjectURL(f)})}
function pickFiles(accept){return new Promise(res=>{const i=document.createElement("input");i.type="file";i.multiple=true;i.accept=accept;i.onchange=()=>res([...i.files]);i.click()})}
async function addFiles(slot,accept){S.att=S.att||{};const L=S.att[slot]=S.att[slot]||[];const fs=await pickFiles(accept);if(!fs.length)return;
  for(const f0 of fs){if(L.length>=6){toast("Up to 6 files per post.");break}
    const ext=(f0.name.split(".").pop()||"").toLowerCase(),type=f0.type||MIME[ext]||"";
    if(!/^image\/(png|jpeg|webp|gif)$/.test(type)&&!Object.values(MIME).includes(type)){toast(`${f0.name}: use images, PDF, PowerPoint, Word, Excel or CSV.`);continue}
    const blob=isImg(type)?await shrinkImage(f0):f0;if(blob.size>10*1048576){toast(`${f0.name} is over 10 MB.`);continue}
    const item={name:f0.name.slice(0,120),type:isImg(type)&&blob!==f0?"image/jpeg":type,size:blob.size,url:"",busy:true,prev:isImg(type)?URL.createObjectURL(blob):""};L.push(item);paintAtt(slot);
    try{item.url=await API.uploadFile(blob,isImg(type)&&blob!==f0?f0.name.replace(/\.\w+$/,"")+".jpg":f0.name,item.type);item.busy=false}catch(err){L.splice(L.indexOf(item),1);toast(friendly(err))}paintAtt(slot)}}

    if(g){g.list.push(n);g.ids.push(n.id);if(!n.read)g.read=false}else out.push({key,kind:n.kind,at:n.at,read:n.read,list:[n],ids:[n.id],data:n.data})});

function threadRow(t){const w=t.who||{};

function tAva(w,s){return w.company?`<span class="lw" style="width:${s}px;height:${s}px">${coLogo(w.label||"C")}</span>`:personAva({code:w.code,track:w.track,photo:w.photo,name:/^Candidate #/.test(w.label||"")?"":w.label},s)}
function renderMsgs(scrollEnd){

  const html=`<div class="shh"><button class="xbtn" data-act="mclose" aria-label="Close">${I.x}</button><h2>Messages</h2><span style="width:36px"></span></div><div class="msheet ${t?"has":""}">${list}${conv}</div>`;

async function sendMsg(retry){const mi=$("#msgIn");if(!mi&&!retry)return;const body=retry?retry.body:mi.value.trim();if(!body)return;const tid=(mi&&mi.dataset.t)||S.msg.thread;if(!tid){toast("Pick a conversation first");return}S.msg.thread=tid;if(mi)mi.value="";
  const tmp=retry||{id:"tmp"+Date.now(),body,mine:true,at:new Date().toISOString()};tmp.pending=true;tmp.failed="";if(!retry)S.msg.list=(S.msg.list||[]).concat(tmp);renderMsgs(true);
  try{const m=await API.send(tid,body);if(!m||!m.id)throw new Error("The server didn't confirm the message. Run the latest Junction SQL in Supabase.");
    S.msg.list=S.msg.list.map(x=>x===tmp?m:x);renderMsgs(true);S.msg.threads=await API.threads().catch(()=>S.msg.threads);renderMsgs(true)}
  catch(err){tmp.pending=false;tmp.failed=friendly(err);renderMsgs(true);toast(tmp.failed)}}

document.addEventListener("click",async e=>{

  if(a==="bell"){S.bell=!S.bell;S.menu=false;renderTop();if(S.bell){S.streakSeen=true;const ids=((S.inbox&&S.inbox.items)||[]).filter(n=>!n.read).map(n=>n.id);if(ids.length){API.inboxRead(ids).catch(()=>{});S.inbox.unread=0}}else refreshInbox();return}
  if(a==="ballread"){((S.inbox&&S.inbox.items)||[]).forEach(n=>n.read=true);API.inboxRead(null).catch(()=>{});renderTop();return}
  if(a==="bgo"){const g=S._groups[+el.dataset.i];g.list.forEach(n=>n.read=true);await goNotif(g);return}

  if(a==="mretry"){const m=(S.msg.list||[]).find(x=>x.id===el.dataset.id);if(m)await sendMsg(m);return}
  if(a==="mblock"){const on=el.dataset.on==="1";try{await API.block(el.dataset.u,on);toast(on?"Blocked. They can't message you anymore.":"Unblocked.");await refreshMsgs(true)}catch(err){toast(friendly(err))}return}
  if(a==="msgto"){await startMsg(el.dataset.u,null);return}
  if(a==="msginv"){e.stopPropagation();await startMsg(null,el.dataset.inv);return}
  if(a==="mclose"&&S.msg.open){S.msg.open=false;S.msg.thread=null;refreshInbox()}
});
document.addEventListener("keydown",e=>{if(e.target&&e.target.id==="msgIn"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMsg()}
  if(e.key==="Escape"&&S.bell){S.bell=false;renderTop()}});

boot();
</script>
</body>
