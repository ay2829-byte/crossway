<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crossway</title>
<meta name="description" content="Crossway is a free, simple project tracker. Groups, statuses, priorities, due dates, a calendar and a Kanban board.">
<meta property="og:title" content="Crossway">
<meta property="og:description" content="A free, simple project tracker for your work and life.">
<meta property="og:image" content="logo.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"%3E%3Crect width="32" height="32" rx="9" fill="%230073EA"/%3E%3Cpath d="M8 23.5C14 23.5 18 8.5 24 8.5" fill="none" stroke="%23fff" stroke-width="3.4" stroke-linecap="round"/%3E%3Cpath d="M8 8.5C14 8.5 18 23.5 24 23.5" fill="none" stroke="%23fff" stroke-opacity=".5" stroke-width="3.4" stroke-linecap="round"/%3E%3Ccircle cx="24" cy="8.5" r="3.1" fill="%2300C875"/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap">
<style>
:root{
  --app:#F3F4F7; --bg:#FFFFFF; --soft:#F4F5F8; --hover:#F1F2F6; --sel:#EEF1FD;
  --ink:#1D1F2C; --ink2:#3A3D4D; --muted:#6C7082; --faint:#9A9EAE;
  --line:#E3E5EB; --line2:#EDEEF2;
  --accent:#3B5BDB; --accent-ink:#FFFFFF; --accent-soft:#E8ECFC;
  --danger:#D63A4F; --ok:#0F9F6E; --warn:#D98A0B;
  --pill-empty:#EEF0F4; --pill-ink:#8A8FA0; --pill-on:#0060C7; --panel:var(--bg);
  --wordmark:#16152B;
  --shadow-sm:0 1px 2px rgba(18,20,40,.05);
  --shadow:0 12px 32px rgba(18,20,40,.14),0 2px 6px rgba(18,20,40,.06);
  --font:"Poppins",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --row:38px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --app:#0E1019; --bg:#161925; --soft:#1C2030; --hover:#20253A; --sel:#232B4F;
    --ink:#E7E9F1; --ink2:#C9CCD8; --muted:#9296A9; --faint:#6D7186;
    --line:#2A2F43; --line2:#232839;
    --accent:#7089F2; --accent-ink:#0B1030; --accent-soft:#232B4F;
    --danger:#F0697C; --ok:#35C98F; --warn:#F2B03E;
    --pill-empty:#23283A; --pill-ink:#8C91A6; --pill-on:#2F7FF0; --wordmark:#F2F3F8;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 16px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --app:#0E1019; --bg:#161925; --soft:#1C2030; --hover:#20253A; --sel:#232B4F;
  --ink:#E7E9F1; --ink2:#C9CCD8; --muted:#9296A9; --faint:#6D7186;
  --line:#2A2F43; --line2:#232839;
  --accent:#7089F2; --accent-ink:#0B1030; --accent-soft:#232B4F;
  --danger:#F0697C; --ok:#35C98F; --warn:#F2B03E;
  --pill-empty:#23283A; --pill-ink:#8C91A6; --pill-on:#2F7FF0; --wordmark:#F2F3F8;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 16px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--app);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;font-feature-settings:"ss01"}
body.compact{--row:32px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}
svg{display:block}
.num{font-variant-numeric:tabular-nums}

/* layout */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{padding:18px 12px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.main{padding-block:8px;padding-inline:0 8px;min-width:0}
.card{background:var(--bg);border:1px solid var(--line2);border-radius:14px;min-height:calc(100vh - 16px);padding-block:20px 100px;padding-inline:30px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow-sm);min-width:0}

/* sidebar */
.brandrow{display:flex;align-items:center;justify-content:space-between;padding-inline:8px}
.brand{display:flex;align-items:center;gap:9px}
.logo{height:20px;width:auto;flex:none}
.wordmark{font-family:"Bricolage Grotesque",var(--font);font-weight:800;font-size:23px;line-height:1;letter-spacing:-.03em;color:var(--wordmark)}
.menu-btn{display:none}
.snav{display:flex;flex-direction:column;gap:1px}
.shead{display:flex;align-items:center;justify-content:space-between;padding:0 6px 4px 10px;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.pitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:8px;color:var(--ink2);font-weight:500}
.pitem:hover{background:rgba(110,115,140,.10)}
.pitem.on{background:var(--bg);color:var(--ink);box-shadow:var(--shadow-sm),0 0 0 1px var(--line2)}
.pitem .ic{width:18px;height:18px;color:var(--muted);flex:none;display:grid;place-items:center}
.pitem .ic svg{width:17px;height:17px}
.pitem .sq{width:10px;height:10px;border-radius:3px}
.pitem .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.pitem .n{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.pitem .n.hot{color:var(--danger);font-weight:600}
.addp{display:flex;gap:6px;padding:4px 4px 0}
.addp input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px}
.sfoot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-inline:6px}
.sfoot .row{display:flex;align-items:center;gap:6px}
.chipnote{font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;line-height:1.4}
.chipnote b{color:var(--ink);font-weight:600}
.ghostbtn{border:1px solid transparent;background:none;border-radius:8px;padding:6px 10px;display:inline-flex;align-items:center;gap:7px;color:var(--ink2);font-weight:500;font-size:13px}
.ghostbtn:hover{background:rgba(110,115,140,.10)}
.ghostbtn svg{width:16px;height:16px;color:var(--muted)}
.iconbtn{border:0;background:none;color:var(--muted);width:30px;height:30px;border-radius:7px;display:grid;place-items:center;padding:0}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
.iconbtn svg{width:17px;height:17px}
.iconbtn.on{background:var(--accent-soft);color:var(--accent)}

/* header */
.crumbs{font-size:12.5px;color:var(--faint);display:flex;gap:6px;align-items:center;margin-bottom:-8px}
.top{display:flex;align-items:center;gap:4px;min-width:0}
.top h1{margin:0;font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.2;display:flex;align-items:center;min-width:0}
#ptitle{font:inherit;letter-spacing:inherit;color:inherit;border:1px solid transparent;background:none;border-radius:8px;padding:1px 6px;margin-left:-7px;field-sizing:content;min-width:4ch;max-width:100%}
#ptitle:hover{background:var(--hover)}
#ptitle:focus{outline:none;border-color:var(--accent);background:var(--bg)}
#pdesc{border:1px solid transparent;background:none;border-radius:6px;padding:2px 6px;margin:-8px 0 0 -7px;color:var(--muted);width:min(640px,100%);font-size:14px}
#pdesc:hover{background:var(--hover)}
#pdesc:focus{outline:none;border-color:var(--accent);background:var(--bg);color:var(--ink)}
#pdesc::placeholder{color:var(--faint)}
.tabrow{display:flex;align-items:flex-end;gap:12px;border-bottom:1px solid var(--line2)}
.tabs{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto}
.tabs button{display:inline-flex;align-items:center;gap:7px;border:0;background:none;padding:8px 11px 10px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;border-radius:6px 6px 0 0}
.tabs button:hover{color:var(--ink);background:var(--hover)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs svg{width:16px;height:16px}
.avstack{display:flex;align-items:center;padding-bottom:8px}
.avstack .av{width:26px;height:26px;border:2px solid var(--bg);margin-left:-7px;font-size:10px}
.avstack .more{font-size:12px;color:var(--muted);margin-left:6px}

/* overview */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,1.5fr);border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:var(--line2);gap:1px}
.stat{background:var(--bg);padding:12px 16px;display:flex;flex-direction:column;gap:3px;min-width:0}
.stat .lb{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap}
.stat .lb i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.stat b{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.stat .sub{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.warn b{color:var(--danger)}
.stat.progt .row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.segbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--soft);gap:2px;margin-top:6px}
.segbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:11.5px;color:var(--muted);margin-top:5px}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.legend span::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--c)}

/* toolbar */
.tools{display:flex;gap:2px;flex-wrap:wrap;align-items:center}
.newbtn{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:7px 14px 7px 11px;font-weight:600;margin-right:10px;box-shadow:0 1px 2px rgba(59,91,219,.3)}
.newbtn:hover{filter:brightness(1.07)}
.newbtn svg{width:15px;height:15px}
.newbtn kbd{font:500 11px var(--font);opacity:.7;border:1px solid rgba(255,255,255,.35);border-radius:4px;padding:0 5px;margin-left:4px}
.tb{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 10px;border-radius:8px;color:var(--ink2);cursor:pointer;border:1px solid transparent;white-space:nowrap;font-weight:500}
.tb:hover{background:var(--hover)}
.tb svg{width:16px;height:16px;color:var(--muted);flex:none}
.tb.on{background:var(--accent-soft);color:var(--accent)}
.tb.on svg{color:var(--accent)}
.tsearch input{border:0;background:none;padding:0;width:70px;outline:none;transition:width .2s;font-weight:400}
.tsearch input:focus,.tsearch input:not(:placeholder-shown){width:180px}
.tsearch:focus-within{border-color:var(--accent);background:var(--bg)}
.tsel select{appearance:none;-webkit-appearance:none;border:0;background:none;padding:0;cursor:pointer;color:inherit;font-weight:500;max-width:150px}
.tchk input{width:15px;height:15px;margin:0;accent-color:var(--accent)}
.tools .sp{flex:1}

/* groups + table */
.groups{display:flex;flex-direction:column;gap:30px;min-width:0}
.group{--g:#579BFC;min-width:0}
.ghead{display:flex;align-items:center;gap:4px;margin-bottom:8px;min-height:30px}
.chev{border:0;background:none;color:var(--g);width:26px;height:26px;border-radius:6px;display:grid;place-items:center;padding:0}
.chev:hover{background:var(--hover)}
.chev svg{width:17px;height:17px;transition:transform .15s}
.group.collapsed .chev svg{transform:rotate(-90deg)}
.gname{font:600 16.5px/1.2 var(--font);letter-spacing:-.01em;color:var(--g);border:1px solid transparent;background:none;border-radius:6px;padding:2px 6px;field-sizing:content;min-width:4ch;max-width:100%}
.gname:hover{background:var(--hover)}
.gname:focus{outline:none;border-color:var(--accent);color:var(--ink);background:var(--bg)}
.gcount{font-size:12.5px;color:var(--faint);margin-left:4px;white-space:nowrap}
.ghead .iconbtn{opacity:0;transition:opacity .12s}
.ghead:hover .iconbtn,.ghead .iconbtn:focus-visible{opacity:1}
.collapsed .tscroll{display:none}
.tscroll{overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;padding-bottom:2px}
table.gt{border-collapse:separate;border-spacing:0;table-layout:fixed}
.gt th,.gt td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);height:var(--row);padding:0;background:var(--bg)}
.gt th{border-top:1px solid var(--line);font-weight:500;color:var(--muted);font-size:13px;text-align:center;white-space:nowrap;cursor:pointer;user-select:none;position:relative;height:36px}
.gt th:hover{background:var(--soft)}
.gt th:first-child,.gt td:first-child{border-left:5px solid var(--g)}
.gt thead th:first-child{border-top-left-radius:8px;cursor:default}
.gt thead th:nth-child(2){cursor:default;text-align:left;padding-left:16px}
.gt thead th:last-child{border-top-right-radius:8px}
.gt tr.addrow td:first-child{border-left-color:color-mix(in srgb,var(--g) 40%,transparent);border-bottom-left-radius:8px}
.gt th .sort{color:var(--accent);font-size:10px;margin-left:4px}
.gt tbody tr:not(.addrow):hover td{background:var(--soft)}
.gt tbody tr.sel td{background:var(--sel)!important}
.cc{text-align:center}
.cc input{width:15px;height:15px;accent-color:var(--accent);vertical-align:middle;margin:0}
.nmwrap{display:flex;align-items:center;height:100%;padding-left:8px;gap:2px}
.cellin{flex:1;min-width:0;border:1px solid transparent;background:none;border-radius:6px;padding:4px 7px;text-overflow:ellipsis;font-weight:500;color:var(--ink)}
.cellin:hover{border-color:var(--line)}
.cellin:focus{border-color:var(--accent);outline:none;background:var(--bg)}
.done-name .cellin{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.rowbtn{border:0;background:none;color:var(--faint);width:28px;height:28px;border-radius:6px;display:grid;place-items:center;padding:0;flex:none;opacity:0}
tr:hover .rowbtn,.rowbtn:focus-visible{opacity:1}
.rowbtn:hover{background:var(--hover);color:var(--ink)}
.rowbtn svg{width:16px;height:16px}
.open{border:0;border-left:1px solid var(--line);background:none;color:var(--faint);height:100%;width:42px;display:grid;place-items:center;flex:none;padding:0;position:relative}
.open:hover{color:var(--accent)}
.open svg{width:19px;height:19px}
.open .badge{position:absolute;top:5px;right:6px;min-width:15px;height:15px;border-radius:8px;background:var(--accent);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;padding:0 3px}
.cellbtn{border:0;background:none;width:100%;height:calc(var(--row) - 1px);display:flex;align-items:center;justify-content:center;gap:7px;padding:0 8px;font-size:13.5px;border-radius:0}
.fillcell .cellbtn{color:#fff;font-weight:600;background:var(--c);text-shadow:0 1px 1px rgba(0,0,0,.22);letter-spacing:.005em}
.fillcell .cellbtn:hover{filter:brightness(.93)}
.fillcell .cellbtn.nopri{background:transparent;color:var(--faint);text-shadow:none;font-weight:400}
.fillcell .cellbtn.nopri:hover{background:var(--hover);filter:none}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 10.5px var(--font);letter-spacing:.02em;flex:none}
.av-empty{color:var(--faint)}
.av-empty svg{width:26px;height:26px}
.duebtn .ic{width:15px;height:15px;flex:none}
.duebtn .late{color:var(--danger)}
.duebtn .ok{color:var(--ok)}
.duebtn .strike{text-decoration:line-through;color:var(--faint)}
.duebtn .lt{color:var(--danger);font-weight:500}
.duebtn .ph{color:var(--faint);opacity:0}
.duebtn:hover .ph{opacity:1}
.tlpill{display:inline-block;min-width:96px;padding:3px 12px;border-radius:14px;background:var(--pill-empty);color:var(--pill-ink);font-size:12.5px;font-weight:600;white-space:nowrap;text-align:center}
.tlpill.on{background:var(--pill-on);color:#fff}
.prog{display:flex;align-items:center;gap:8px;width:100%;padding:0 12px}
.prog .bar{flex:1;height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.prog span{font-size:12px;color:var(--muted);width:34px;text-align:right;font-variant-numeric:tabular-nums}
.prog.none{justify-content:center;color:var(--faint)}
.addin{width:100%;height:100%;border:0;background:none;padding:0 16px;color:var(--ink)}
.addin::placeholder{color:var(--faint)}
.addin:focus{outline:none;background:var(--bg);box-shadow:inset 0 0 0 1px var(--accent)}
.gt tfoot td{height:40px;background:var(--bg)}
.gt tfoot td:first-child,.gt tfoot td:nth-child(2),.gt tfoot td:nth-child(3){border:0;background:transparent}
.gt tfoot td:nth-child(4){border-left:1px solid var(--line);border-bottom-left-radius:8px}
.gt tfoot td:last-child{border-bottom-right-radius:8px}
.dist{display:flex;height:22px;margin:0 10px;overflow:hidden;background:var(--pill-empty);border-radius:4px;gap:1px}
.dist i{display:block;height:100%}
.sumpill{display:flex;justify-content:center}
.rz{position:absolute;top:0;right:-4px;width:8px;height:100%;cursor:col-resize;z-index:2;touch-action:none}
.rz::after{content:"";position:absolute;top:8px;bottom:8px;left:3px;width:2px;border-radius:1px}
.gt th:hover .rz::after{background:var(--line)}
.rz:hover::after,.rz.on::after{background:var(--accent)!important}
body.resizing,body.resizing *{cursor:col-resize!important;user-select:none!important}
.newgroup{align-self:flex-start;margin-top:4px}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 13px;font-weight:500;color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.ghost{border-color:transparent;background:none}
.empty{padding:44px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.empty b{display:block;color:var(--ink);font-size:16px;font-weight:600;margin-bottom:4px}

/* kanban */
.board{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:12px;align-items:start;overflow-x:auto;padding-bottom:6px}
.col{background:var(--soft);border-radius:12px;display:flex;flex-direction:column;gap:8px;min-height:140px;padding:10px;transition:background .15s}
.col.over{background:var(--accent-soft)}
.colh{display:flex;align-items:center;gap:8px;font-weight:600;padding:2px 2px 4px}
.colh i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.colh .n{color:var(--faint);font-weight:500;font-size:12.5px}
.kcard{background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;width:100%;box-shadow:var(--shadow-sm);border-top:3px solid var(--c)}
.kcard:hover{border-color:var(--line)}
.kcard.dragging{opacity:.45}
.kcard .t{font-weight:500;overflow-wrap:anywhere}
.kcard.done .t{color:var(--muted);text-decoration:line-through}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:5px;padding:2px 7px;font-size:11.5px;white-space:nowrap;color:#fff;font-weight:600;background:var(--c)}
.tag.plain{background:var(--soft);color:var(--muted);font-weight:500}
.meta .av{width:20px;height:20px;font-size:8.5px}
.meta .late{color:var(--danger);font-weight:500}
.meta .bar{width:44px;height:4px;border-radius:2px;background:var(--soft);overflow:hidden}
.meta .bar i{display:block;height:100%;background:var(--ok)}
.quick input{width:100%;border:1px dashed var(--line);background:transparent;border-radius:8px;padding:7px 9px}
.quick input:focus{border-style:solid;background:var(--bg);outline:none;border-color:var(--accent)}

/* calendar */
.calhead{display:flex;align-items:center;gap:8px}
.calhead h2{margin:0 8px 0 0;font-size:18px;font-weight:600;letter-spacing:-.01em;min-width:150px}
.calhead .note{margin-left:auto;font-size:12.5px;color:var(--muted)}
.calwrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line);gap:1px;min-width:770px}
.cal .dow{background:var(--soft);font-size:12px;font-weight:600;color:var(--muted);padding:8px 10px;text-transform:uppercase;letter-spacing:.05em}
.day{background:var(--bg);min-height:112px;padding:6px;display:flex;flex-direction:column;gap:4px;transition:background .12s}
.day.out{background:var(--soft)}
.day.out .dnum{color:var(--faint)}
.day.over{background:var(--accent-soft)}
.dnum{font-size:12.5px;font-weight:600;color:var(--ink2);width:24px;height:24px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.day.today .dnum{background:var(--accent);color:#fff}
.chip{border:0;text-align:left;background:color-mix(in srgb,var(--c) 14%,var(--bg));border-left:3px solid var(--c);border-radius:5px;padding:3px 7px;font-size:12px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.chip:hover{background:color-mix(in srgb,var(--c) 24%,var(--bg))}
.chip.done{color:var(--muted);text-decoration:line-through}
.chip.dragging{opacity:.4}
.moreb{border:0;background:none;color:var(--muted);font-size:12px;text-align:left;padding:2px 4px;border-radius:4px}
.moreb:hover{background:var(--hover);color:var(--ink)}
.dayadd{border:0;background:none;color:var(--faint);font-size:12px;text-align:left;padding:2px 4px;border-radius:4px;opacity:0;margin-top:auto}
.day:hover .dayadd{opacity:1}
.dayadd:hover{color:var(--accent);background:var(--hover)}

/* popover + menus */
.pop{position:fixed;z-index:40;background:var(--bg);border-radius:10px;box-shadow:var(--shadow);border:1px solid var(--line2);padding:8px;width:220px;display:flex;flex-direction:column;gap:5px}
.pop .opt{border:0;color:#fff;font-weight:600;padding:8px;border-radius:6px;background:var(--c);text-align:center;text-shadow:0 1px 1px rgba(0,0,0,.2)}
.pop .opt:hover{filter:brightness(.93)}
.pop .opt.cur{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--c)}
.pop label{font-size:12px;color:var(--muted);font-weight:500}
.pop input[type=date],.pop input[type=text]{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:6px 8px;width:100%}
.pop .row{display:flex;gap:4px;flex-wrap:wrap}
.lnk{border:0;background:none;color:var(--accent);padding:4px 6px;font-size:13px;border-radius:5px;font-weight:500}
.lnk:hover{background:var(--hover)}
.lnk.danger{color:var(--danger)}
.mi{display:flex;align-items:center;gap:9px;border:0;background:none;padding:7px 8px;border-radius:6px;text-align:left;color:var(--ink);font-weight:500}
.mi:hover{background:var(--hover)}
.mi svg{width:16px;height:16px;color:var(--muted)}
.mi.danger{color:var(--danger)}
.mi.danger svg{color:var(--danger)}
.mi .sq{width:10px;height:10px;border-radius:3px;margin-inline:3px}
.pop hr{border:0;border-top:1px solid var(--line2);margin:2px 0;width:100%}
.pop .mlabel{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:4px 8px 0}
.person{display:flex;align-items:center;gap:8px;border:0;background:none;padding:5px 6px;border-radius:6px;text-align:left}
.person:hover{background:var(--hover)}
.person .av{width:24px;height:24px;font-size:9.5px}
.sw{display:flex;gap:6px;flex-wrap:wrap;padding:2px}
.sw button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;background:var(--c);padding:0}
.sw button.cur{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--c)}

/* bulk */
.bulk{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--bg);border:1px solid var(--line2);box-shadow:var(--shadow);border-radius:12px;padding:8px 10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 32px)}
.bulk b{background:var(--accent);color:#fff;border-radius:7px;padding:4px 9px;font-weight:600}
.bulk .sd{width:9px;height:9px;border-radius:50%;background:var(--c)}
.bulk .btn{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;font-size:13px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,24,.32);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--bg);border-left:1px solid var(--line2);z-index:21;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) 26px calc(22px + env(safe-area-inset-bottom,0px));gap:18px;overflow-y:auto;box-shadow:-16px 0 40px rgba(0,0,0,.12)}
.dh{display:flex;gap:6px;align-items:center}
.dh .sp{flex:1}
.dh .crumb{font-size:12.5px;color:var(--faint);display:flex;align-items:center;gap:6px}
.dh .crumb .sq{width:9px;height:9px;border-radius:3px}
#f-title{font:600 22px/1.3 var(--font);letter-spacing:-.015em;border:0;background:none;resize:none;width:100%;padding:0;color:var(--ink)}
#f-title:focus{outline:none}
.props{display:grid;grid-template-columns:112px 1fr;gap:4px 10px;align-items:center}
.props label{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px}
.props label svg{width:15px;height:15px;color:var(--faint)}
.props select,.props input{border:1px solid transparent;background:none;border-radius:7px;padding:6px 8px;width:100%;color:var(--ink);font-weight:500}
.props select:hover,.props input:hover{background:var(--hover)}
.props select:focus,.props input:focus{outline:none;border-color:var(--accent);background:var(--bg)}
.props .two{display:flex;gap:6px}
.sect{display:flex;flex-direction:column;gap:8px}
.sect h6{margin:0;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:8px}
.sect h6 .pbar{flex:1;height:4px;border-radius:2px;background:var(--soft);overflow:hidden;max-width:140px}
.sect h6 .pbar i{display:block;height:100%;background:var(--ok)}
.cl{display:flex;flex-direction:column;gap:2px}
.cli{display:flex;align-items:center;gap:10px;padding:5px 6px;border-radius:6px}
.cli:hover{background:var(--hover)}
.cli span{flex:1;overflow-wrap:anywhere}
.cli.done span{text-decoration:line-through;color:var(--muted)}
.cli .x{border:0;background:none;color:var(--faint);font-size:16px;opacity:0}
.cli:hover .x{opacity:1}
.cli input{width:16px;height:16px;accent-color:var(--ok);margin:0}
.inrow{display:flex;gap:6px}
.inrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px}
.inrow input:focus,#f-notes:focus,#f-upd:focus{outline:none;border-color:var(--accent)}
#f-notes{width:100%;min-height:96px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;resize:vertical;line-height:1.5}
.upd{display:flex;gap:10px}
.upd .av{width:28px;height:28px;font-size:10px}
.upd .body{flex:1;background:var(--soft);border-radius:10px;padding:8px 11px}
.upd .who{font-size:12.5px;font-weight:600;display:flex;gap:8px;align-items:baseline}
.upd .who time{font-weight:400;color:var(--faint);font-size:12px}
.upd p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.updbox{display:flex;flex-direction:column;gap:6px}
#f-upd{width:100%;min-height:64px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;resize:vertical}
.updbox .row{display:flex;justify-content:flex-end}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;border-top:1px solid var(--line2);padding-top:14px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 8px 8px 14px;border-radius:10px;font-size:13px;z-index:45;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
.toast button{border:0;background:rgba(255,255,255,.14);color:inherit;border-radius:6px;padding:4px 10px;font-weight:600}
.toast:not(:has(button)){padding-right:14px}
.kbdhint{font-size:12px;color:var(--faint)}
.kbdhint kbd{font:500 11px var(--font);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted);background:var(--bg)}

@media (max-width:1100px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.stat.progt{grid-column:1/-1}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;padding:12px 16px;gap:12px}
  .side.collapsed .snav,.side.collapsed .shead,.side.collapsed .addp,.side.collapsed .sfoot{display:none}
  .menu-btn{display:inline-flex}
  .main{padding-inline:8px;padding-block:0 8px}
  .card{min-height:auto;padding-inline:16px;padding-block:16px 100px;border-radius:12px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tsearch{flex:1 1 100%}.tsearch input,.tsearch input:focus{width:100%}
  .top h1{font-size:22px}
  .kbdhint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* fixes */
.drawer>*{flex-shrink:0}
.ghead .gname{font:600 16.5px/1.2 var(--font);letter-spacing:-.01em;color:var(--g);flex:0 1 auto;padding:2px 6px}
.ghead .gname:focus{color:var(--ink)}
#ptitle{field-sizing:fixed;max-width:100%}
/* account + auth */
.me{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:10px 8px 0;border-top:1px solid var(--line2)}
.me .who{display:flex;align-items:center;gap:9px;min-width:0}
.me .who .av{width:30px;height:30px;flex:none}
.me .who div{min-width:0}
.me .who b{display:block;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .who small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .acts{display:flex;gap:6px;flex-wrap:wrap}
.me .acts a,.me .acts button{font-size:12.5px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 9px;color:var(--ink);text-decoration:none}
.me .acts a:hover,.me .acts button:hover{background:var(--hover)}
.authwrap{min-height:100%;display:grid;place-items:center;padding-block:40px;padding-inline:16px;background:var(--soft)}
.authcard{width:min(400px,100%);background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);padding:30px 28px;display:flex;flex-direction:column;gap:14px}
.authcard .brand{padding:0;font-size:22px;gap:10px}
.authcard .logo{height:28px!important}
.authcard .wordmark{font-size:31px}
.authcard h2{margin:6px 0 0;font:600 22px/1.25 var(--head);text-wrap:balance}
.authcard p.lead{margin:0;color:var(--muted)}
.authcard form{display:flex;flex-direction:column;gap:10px}
.authcard label{font-size:13px;font-weight:500;display:flex;flex-direction:column;gap:5px}
.authcard input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;font-size:15px}
.authcard input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.authcard .btn{padding:10px 14px;font-size:15px;border-radius:8px;width:100%}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line2)}
.authlinks{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13.5px}
.authlinks button{border:0;background:none;color:var(--accent);padding:0;font-weight:500}
.amsg{font-size:13.5px;border-radius:8px;padding:9px 11px}
.amsg.err{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
.amsg.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ink)}
.fine{font-size:12px;color:var(--muted);text-align:center}
.fine a{color:var(--muted)}
.me{margin-top:0;padding:10px 4px 0}
.sidefoot{font-size:12px;color:var(--faint);padding-inline:4px}
.loading{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="authwrap" id="auth" hidden><div class="authcard" id="authcard"></div></div>
<div class="app" id="app" hidden>
  <aside class="side collapsed" id="side">
    <div class="brandrow">
      <div class="brand"><svg class="logo" viewBox="0 0 176 181" aria-hidden="true"><rect width="176" height="50" rx="25" fill="#3B5BDB"/><rect y="65.5" width="94" height="50" rx="25" fill="#F2643D"/><rect y="131" width="176" height="50" rx="25" fill="#12A38A"/></svg><span class="wordmark">crossway</span></div>
      <button class="ghostbtn menu-btn" id="menuBtn">Menu</button>
    </div>
    <nav class="snav" id="viewsList" aria-label="Views"></nav>
    <div>
      <div class="shead"><span>Projects</span><button class="iconbtn" id="addProjBtn" title="New project" aria-label="New project"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 4.5v11M4.5 10h11"/></svg></button></div>
      <nav class="snav" id="projList" aria-label="Projects"></nav>
      <form class="addp" id="addProj" hidden><input id="newProjName" placeholder="Project name, then Enter" maxlength="60" aria-label="New project name"></form>
    </div>
    <div class="sfoot">
      <div class="row"><button class="ghostbtn" id="themeBtn"></button></div>
      <div class="me" id="me"></div>
      <div class="sidefoot" id="syncNote">Loading…</div>
    </div>
  </aside>

  <main class="main">
   <div class="card">
    <div class="crumbs" id="crumbs"></div>
    <div class="top">
      <h1 id="titleText">All tasks</h1>
      <button class="iconbtn" id="projMenu" hidden aria-label="Project options" title="Project options"><svg viewBox="0 0 20 20" fill="currentColor"><circle cx="4.5" cy="10" r="1.6"/><circle cx="10" cy="10" r="1.6"/><circle cx="15.5" cy="10" r="1.6"/></svg></button>
    </div>
    <input id="pdesc" hidden maxlength="160" placeholder="Add a short description" aria-label="Project description">
    <div class="tabrow">
      <div class="tabs" role="tablist">
        <button data-view="table"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="14" height="12" rx="2"/><path d="M3 8h14M8 8v8"/></svg>Main table</button>
        <button data-view="board"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="4" height="12" rx="1.2"/><rect x="8.5" y="4" width="4" height="8" rx="1.2"/><rect x="14" y="4" width="3" height="10" rx="1.2"/></svg>Kanban</button>
        <button data-view="calendar"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4.5" width="14" height="12.5" rx="2"/><path d="M3 8.5h14M7 3v3M13 3v3" stroke-linecap="round"/></svg>Calendar</button>
      </div>
      <div class="avstack" id="avstack"></div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="tools">
      <button class="newbtn" id="newTask"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M10 4.5v11M4.5 10h11"/></svg>New task<kbd>N</kbd></button>
      <label class="tb tsearch"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="9" r="5.5"/><path d="M13.2 13.2L17 17" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="Search" aria-label="Search tasks"></label>
      <label class="tb tsel"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="7" r="3.2"/><path d="M3.8 17c1.1-3 3.4-4.5 6.2-4.5s5.1 1.5 6.2 4.5" stroke-linecap="round"/></svg><select id="fOwner" aria-label="Filter by person"><option value="">Person</option></select></label>
      <label class="tb tsel"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M5 17V3.5M5 4h9l-2 3.5 2 3.5H5"/></svg><select id="fPri" aria-label="Filter by priority"><option value="">Priority</option><option value="urgent">Critical</option><option value="high">High</option><option value="med">Medium</option><option value="low">Low</option></select></label>
      <label class="tb tsel"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4.5" width="14" height="12.5" rx="2"/><path d="M3 8.5h14M7 3v3M13 3v3" stroke-linecap="round"/></svg><select id="fDue" aria-label="Filter by due date"><option value="">Due date</option><option value="late">Overdue</option><option value="week">Due in 7 days</option><option value="none">No due date</option></select></label>
      <label class="tb tchk"><input type="checkbox" id="hideDone">Hide done</label>
      <span class="sp"></span>
      <span class="kbdhint"><kbd>/</kbd> search</span>
      <button class="iconbtn" id="compactBtn" title="Compact rows" aria-label="Compact rows"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 5h12M4 8.5h12M4 12h12M4 15.5h12"/></svg></button>
    </div>
    <div id="view"></div>
   </div>
  </main>
</div>

<div class="pop" id="pop" hidden></div>
<div class="bulk" id="bulk" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Task details"></aside>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const STATUSES=[["todo","Not started","#848A9C"],["doing","Working on it","#EE8E0B"],["review","Waiting","#8E44CF"],["stuck","Stuck","#D32A44"],["done","Done","#00A862"]];
const PRIS=[["urgent","Critical","#2E3140"],["high","High","#4A1FA8"],["med","Medium","#5559DF"],["low","Low","#3A86EE"]];
const GCOLORS=["#579BFC","#00C875","#FDAB3D","#DF2F4A","#A25DDC","#FF7575","#037F4C","#9CD326","#784BD1","#FF642E"];
const DEFAULT_GROUPS=[{id:"g_main",name:"To do",color:"#579BFC"},{id:"g_done",name:"Completed",color:"#00C875"}];
const stInfo=k=>STATUSES.find(s=>s[0]===k)||STATUSES[0];
const prInfo=k=>PRIS.find(s=>s[0]===k)||null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const todayStr=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return ymd(d)};
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONL=["January","February","March","April","May","June","July","August","September","October","November","December"];
const md=s=>{const d=new Date(s+"T00:00:00");return MON[d.getMonth()]+" "+d.getDate()};
function fmtRange(a,b){if(!a&&!b)return"";a=a||b;b=b||a;if(b<a)[a,b]=[b,a];if(a===b)return md(a);const A=new Date(a+"T00:00:00"),B=new Date(b+"T00:00:00");return A.getMonth()===B.getMonth()?md(a)+" – "+B.getDate():md(a)+" – "+md(b)}
function ago(ts){const s=(Date.now()-ts)/1000;if(s<60)return"just now";if(s<3600)return Math.floor(s/60)+"m ago";if(s<86400)return Math.floor(s/3600)+"h ago";if(s<604800)return Math.floor(s/86400)+"d ago";return new Date(ts).toLocaleDateString(undefined,{month:"short",day:"numeric"})}
function initials(n){const p=String(n).trim().split(/\s+/);return((p[0]||"")[0]||"").toUpperCase()+((p[1]||"")[0]||"").toUpperCase()}
function avColor(n){let h=0;for(const c of String(n))h=(h*31+c.charCodeAt(0))>>>0;return ["#3B5BDB","#F2643D","#12A38A","#8E44CF","#D32A44","#0B84A5","#C2410C","#4A1FA8"][h%8]}
const avatar=n=>n?`<span class="av" style="background:${avColor(n)}" title="${esc(n)}">${esc(initials(n))}</span>`:`<span class="av-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="10.5"/><circle cx="12" cy="10" r="3.4"/><path d="M5.6 18.8c1.5-2.5 3.8-3.8 6.4-3.8s4.9 1.3 6.4 3.8"/></svg></span>`;
const cv=c=>`--c:${c}`;

let sb=null,user=null,pending=0,chain=Promise.resolve(),mode="cloud",recovering=false,isAdmin=false;
function queue(fn){pending++;chain=chain.then(fn).catch(e=>{console.warn(e);toast("Couldn't save that change. Check your connection and try again.")}).finally(()=>{pending--;$("syncNote").textContent=pending?"Saving…":"All changes saved"});$("syncNote").textContent="Saving…";return chain}
function toRow(kind,obj){const{id,...data}=obj;const r={id,data:JSON.parse(JSON.stringify(data))};if(kind==="tasks")r.project_id=obj.projectId||null;return r}
async function put(kind,obj){const a=S[kind];const i=a.findIndex(x=>x.id===obj.id);if(i>=0)a[i]=obj;else a.push(obj);render();const r=toRow(kind,obj);
  return queue(async()=>{const{error}=await sb.from(kind).upsert(r);if(error)throw error})}
async function patch(kind,id,p){const o=S[kind].find(x=>x.id===id);if(!o)return;Object.assign(o,p);render();const r=toRow(kind,o);
  return queue(async()=>{const{error}=await sb.from(kind).upsert(r);if(error)throw error})}
async function del(kind,id){S[kind]=S[kind].filter(x=>x.id!==id);render();
  return queue(async()=>{const{error}=await sb.from(kind).delete().eq("id",id);if(error)throw error})}
function safe(p){return Promise.resolve(p).catch(e=>console.warn(e))}
function setTask(id,p){return safe(patch("tasks",id,p))}

async function loadAll(seed){
  const [p,t]=await Promise.all([sb.from("projects").select("id,data").range(0,4999),sb.from("tasks").select("id,data").range(0,9999)]);
  if(p.error||t.error){console.warn(p.error||t.error);$("syncNote").textContent="Couldn't load your data. Refresh to try again.";return}
  S.projects=p.data.map(r=>({...r.data,id:r.id}));S.tasks=t.data.map(r=>({...r.data,id:r.id}));S.ready={p:true,t:true};
  if(seed&&!S.projects.length)await seedStarter();
  $("syncNote").textContent="All changes saved";render();
}

const here=()=>location.origin+location.pathname;

$("auth").addEventListener("click",async e=>{const v=e.target.closest("[data-av]");if(v){drawAuth(v.dataset.av);return}

$("auth").addEventListener("submit",async e=>{e.preventDefault();const f=e.target,btn=f.querySelector("button[type=submit]");btn.disabled=true;
  const email=$("aEmail")?$("aEmail").value.trim():"",pass=$("aPass")?$("aPass").value:"";

    if(f.id==="fReset"){const{error}=await sb.auth.updateUser({password:pass});if(error)throw error;recovering=false;const{data}=await sb.auth.getSession();handleSession(data.session,true);toast("Password updated")}
  }catch(err){drawAuth(f.id==="fSignup"?"signup":f.id==="fForgot"?"forgot":f.id==="fReset"?"reset":"signin",{err:1,text:friendly(err)})}
  finally{btn.disabled=false}});
function handleSession(session,force){
  if(recovering)return;
  const u=session&&session.user;
  if(u){if(!force&&user&&user.id===u.id){user=u;return}
    user=u;isAdmin=false;showApp();renderMe();S.ready={p:false,t:false};render();loadAll(true);
    sb.rpc("is_admin").then(({data})=>{isAdmin=data===true;renderMe()});}
  else{user=null;S.projects=[];S.tasks=[];S.ready={p:false,t:false};closePop();if(S.openId){$("drawer").innerHTML="";S.openId=null;$("drawer").hidden=true;$("scrim").hidden=true}location.replace("welcome.html"+(location.hash==="#login"?"#login":""))}
}

async function boot(){
  const cfg=window.WORKBOARD_CONFIG||{};
  if(!window.supabase||!cfg.supabaseUrl||/YOUR_/.test(cfg.supabaseUrl+cfg.supabaseAnonKey)){showAuth("setup");return}
  sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
  sb.auth.onAuthStateChange((ev,session)=>{if(ev==="PASSWORD_RECOVERY"){recovering=true;showAuth("reset");return}setTimeout(()=>handleSession(session),0)});
  const{data}=await sb.auth.getSession();handleSession(data.session);

/* derived */
const projById=id=>S.projects.find(p=>p.id===id);
const groupsOf=p=>(p&&Array.isArray(p.groups)&&p.groups.length)?p.groups:DEFAULT_GROUPS;
function taskGroup(x){const gs=groupsOf(projById(x.projectId));return gs.some(g=>g.id===x.group)?x.group:gs[0].id}
const isCross=()=>!projById(S.sel);
const isView=v=>v==="all"||v==="today"||v==="week";
function scoped(){const t=todayStr(),wk=addDays(t,7);let ts=S.tasks.slice();
  if(S.sel==="today")ts=ts.filter(x=>x.status!=="done"&&x.due&&x.due<=t);
  else if(S.sel==="week")ts=ts.filter(x=>x.status!=="done"&&x.due&&x.due<=wk);
  else if(projById(S.sel))ts=ts.filter(x=>x.projectId===S.sel);
  return ts.filter(x=>projById(x.projectId));}
function filtered(){const q=$("q").value.trim().toLowerCase(),fo=$("fOwner").value,fp=$("fPri").value,fd=$("fDue").value,hd=$("hideDone").checked,t=todayStr(),wk=addDays(t,7);
  return scoped().filter(x=>{if(q&&!((x.title||"").toLowerCase().includes(q)||(x.notes||"").toLowerCase().includes(q)||(x.owner||"").toLowerCase().includes(q)))return false;
    if(fo&&(fo==="__none"?x.owner:x.owner!==fo))return false;
    if(fp&&x.priority!==fp)return false;if(fd==="late"&&!(x.due&&x.due<t&&x.status!=="done"))return false;
    if(fd==="week"&&!(x.due&&x.due>=t&&x.due<=wk))return false;if(fd==="none"&&x.due)return false;if(hd&&x.status==="done")return false;return true})}
const PRANK={urgent:0,high:1,med:2,low:3};
function sortTasks(ts){const k=S.sortKey,d=S.sortDir,sIdx=Object.fromEntries(STATUSES.map((s,i)=>[s[0],i]));
  return ts.sort((a,b)=>{let r=0;
    if(k==="status")r=sIdx[a.status||"todo"]-sIdx[b.status||"todo"];
    else if(k==="priority")r=(PRANK[a.priority]??9)-(PRANK[b.priority]??9);
    else if(k==="due")r=(a.due||"9")<(b.due||"9")?-1:(a.due||"9")>(b.due||"9")?1:0;
    else if(k==="owner")r=(a.owner||"~").localeCompare(b.owner||"~");
    else if(k==="progress")r=pctOf(a)-pctOf(b);
    else if(k==="timeline")r=(a.start||"9")<(b.start||"9")?-1:(a.start||"9")>(b.start||"9")?1:0;
    return r*d||(a.created||0)-(b.created||0)})}
const allOwners=()=>[...new Set(S.tasks.map(x=>(x.owner||"").trim()).filter(Boolean))].sort();
function pctOf(x){const cl=x.checklist||[];if(!cl.length)return x.status==="done"?100:-1;return Math.round(cl.filter(c=>c.d).length/cl.length*100)}

function renderStats(){const ts=scoped(),t=todayStr(),wk=addDays(t,7),open=ts.filter(x=>x.status!=="done");
  const late=open.filter(x=>x.due&&x.due<t).length,soon=open.filter(x=>x.due&&x.due>=t&&x.due<=wk).length,stuck=open.filter(x=>x.status==="stuck").length,done=ts.length-open.length;
  const dueToday=open.filter(x=>x.due===t).length,working=open.filter(x=>x.status==="doing").length;
  const pct=ts.length?Math.round(done/ts.length*100):0;

/* columns */
const COLS=["sel","task","owner","status","priority","due","progress","timeline"];
const COLDEF={sel:44,task:330,owner:84,status:140,priority:120,due:118,progress:130,timeline:150};
const COLMIN={sel:44,task:160,owner:64,status:96,priority:90,due:96,progress:90,timeline:110};
let COLW={...COLDEF,...LS.get("cwp_colw",{})};COLS.forEach(k=>{if(!COLW[k])COLW[k]=COLDEF[k]});

const rz=k=>`<span class="rz" data-rz="${k}" title="Drag to resize. Double click to reset." aria-hidden="true"></span>`;
function applyColW(){document.querySelectorAll("col[data-col]").forEach(c=>c.style.width=COLW[c.dataset.col]+"px");document.querySelectorAll("table.gt").forEach(t=>t.style.width=tableW()+"px")}
let rzState=null,rzJustDone=false;
document.addEventListener("pointerdown",e=>{const h=e.target.closest(".rz");if(!h)return;e.preventDefault();e.stopPropagation();rzState={k:h.dataset.rz,x:e.clientX,w:COLW[h.dataset.rz]};document.body.classList.add("resizing");h.classList.add("on");try{h.setPointerCapture(e.pointerId)}catch(_){}});
document.addEventListener("pointermove",e=>{if(!rzState)return;COLW[rzState.k]=Math.max(COLMIN[rzState.k],Math.round(rzState.w+e.clientX-rzState.x));applyColW()});
document.addEventListener("pointerup",()=>{if(!rzState)return;rzState=null;rzJustDone=true;setTimeout(()=>rzJustDone=false,0);document.body.classList.remove("resizing");document.querySelectorAll(".rz.on").forEach(x=>x.classList.remove("on"));LS.set("cwp_colw",COLW)});
document.addEventListener("dblclick",e=>{const h=e.target.closest(".rz");if(!h)return;COLW[h.dataset.rz]=COLDEF[h.dataset.rz];applyColW();LS.set("cwp_colw",COLW)});
document.addEventListener("click",e=>{if(e.target.closest(".rz")||rzJustDone){e.stopImmediatePropagation();e.preventDefault()}},true);

  <div class="sect"><h6>Updates ${ups.length?`<span class="num">${ups.length}</span>`:""}</h6>
    <div class="updbox"><textarea id="f-upd" placeholder="Write an update for this task…" maxlength="1000"></textarea><div class="row"><button class="btn pri" id="postUpd">Post update</button></div></div>
    ${ups.map(u=>`<div class="upd">${avatar(u.by)}<div class="body"><div class="who">${esc(u.by)}<time>${ago(u.at)}</time></div><p>${esc(u.t)}</p></div></div>`).join("")}</div>
  <div class="confirm">${delConfirm?`<span>Delete this task?</span><button class="btn danger" id="dDelYes">Delete</button><button class="btn ghost" id="dDelNo">Keep</button>`:`<button class="btn ghost danger" id="dDel">Delete task</button><span class="sp" style="flex:1"></span><span class="kbdhint">Created ${new Date(x.created||Date.now()).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}</span>`}</div>`;
  if(active&&$(active))$(active).focus();
}
function openDrawer(id){closePop();S.openId=id;delConfirm=false;$("drawer").hidden=false;$("scrim").hidden=false;renderDrawer();setTimeout(()=>{const t=$("f-title");if(t&&!t.value)t.focus()},30)}
function closeDrawer(){const x=S.openId&&S.tasks.find(t=>t.id===S.openId),ti=$("f-title"),no=$("f-notes");
  if(x&&ti){clearTimeout(tmr.title);clearTimeout(tmr.notes);const tv=ti.value.trim(),nv=no?no.value:"";
    if(!tv&&!nv&&!(x.checklist||[]).length&&!x.owner&&!x.due&&!(x.updates||[]).length){safe(del("tasks",x.id))}
    else{const p={};if(tv!==(x.title||""))p.title=tv;if(nv!==(x.notes||""))p.notes=nv;if(Object.keys(p).length)setTask(x.id,p)}}
  $("drawer").innerHTML="";S.openId=null;$("drawer").hidden=true;$("scrim").hidden=true;render()}
function debounced(k,fn){clearTimeout(tmr[k]);tmr[k]=setTimeout(fn,500)}

/* actions */
async function createTask(title,o={}){
  let pid=o.projectId||(projById(S.sel)?S.sel:null);
  if(!pid){const ps=S.projects.slice().sort((a,b)=>(a.created||0)-(b.created||0));pid=ps[0]&&ps[0].id}
  if(!pid){toast("Create a project first");return null}
  const t={id:uid("t"),title,projectId:pid,group:o.group||groupsOf(projById(pid))[0].id,status:o.status||"todo",priority:"",due:o.due||(S.sel==="today"?todayStr():""),owner:"",start:"",end:"",notes:"",checklist:[],updates:[],created:Date.now()};
  await safe(put("tasks",t));return t.id}
function dupTask(x){const c=JSON.parse(JSON.stringify(x));c.id=uid("t");c.title=(x.title||"Untitled")+" (copy)";c.updates=[];c.created=Date.now();return safe(put("tasks",c))}
async function deleteTasks(ids){const gone=S.tasks.filter(t=>ids.includes(t.id)).map(t=>JSON.parse(JSON.stringify(t)));for(const id of ids)await safe(del("tasks",id));
  toast(gone.length===1?"Task deleted":`${gone.length} tasks deleted`,async()=>{for(const t of gone)await safe(put("tasks",t));toast("Restored")})}
function saveGroups(pid,gs){return safe(patch("projects",pid,{groups:gs}))}
function toast(m,undo){const e=$("toast");e.innerHTML=`<span>${esc(m)}</span>${undo?`<button id="undoBtn">Undo</button>`:""}`;e.hidden=false;toast.undo=undo||null;clearTimeout(toast.t);toast.t=setTimeout(()=>{e.hidden=true;toast.undo=null},undo?6000:2600)}

document.addEventListener("mousedown",e=>{if(!$("pop").hidden&&!e.target.closest("#pop")&&!e.target.closest("[data-pop]"))closePop()});
window.addEventListener("scroll",e=>{if(!$("pop").hidden&&!(e.target.closest&&e.target.closest("#pop")))closePop()},true);
window.addEventListener("resize",closePop);

document.addEventListener("click",async e=>{
  const T=e.target;
  if(T.id==="undoBtn"&&toast.undo){const u=toast.undo;toast.undo=null;$("toast").hidden=true;u();return}
  const sel=T.closest("[data-sel]");if(sel){S.sel=sel.dataset.sel;S.selected.clear();LS.set("cwp_sel",S.sel);$("side").classList.add("collapsed");closePop();render();return}
  const vb=T.closest(".tabs [data-view]");if(vb){S.view=vb.dataset.view;S.selected.clear();LS.set("cwp_view",S.view);render();return}
  const pb=T.closest("[data-pop]");if(pb){if(popState&&popState.kind===pb.dataset.pop&&popState.id===pb.dataset.id){closePop();return}openPop(pb.dataset.pop,pb.dataset.id,pb);return}
  if(popState){const x=S.tasks.find(t=>t.id===popState.id);
    const so=T.closest("[data-set]");if(so&&x){setTask(x.id,{[so.dataset.set]:so.dataset.v});closePop();return}
    const dp=T.closest("[data-duepick]");if(dp&&x){setTask(x.id,{due:dp.dataset.duepick});closePop();return}
    if(T.closest("[data-tlclear]")&&x){setTask(x.id,{start:"",end:""});closePop();return}
    const ow=T.closest("[data-owner]");if(ow&&x){setTask(x.id,{owner:ow.dataset.owner});closePop();return}
    const ra=T.closest("[data-rowact]");if(ra&&x){const a=ra.dataset.rowact;closePop();if(a==="open")openDrawer(x.id);if(a==="dup"){await dupTask(x);toast("Task duplicated")}if(a==="del"){if(S.openId===x.id){$("drawer").innerHTML="";closeDrawer()}deleteTasks([x.id])}return}
    const rm=T.closest("[data-rowmove]");if(rm&&x&&!rm.disabled){setTask(x.id,{group:rm.dataset.rowmove});closePop();toast("Moved");return}
    const gc=T.closest("[data-gcolor]");if(gc){const pr=projById(S.sel);saveGroups(pr.id,groupsOf(pr).map(g=>g.id===popState.id?{...g,color:gc.dataset.gcolor}:{...g}));drawPop();return}
    const pc=T.closest("[data-pcolor]");if(pc){const pr=projById(S.sel);safe(patch("projects",pr.id,{color:pc.dataset.pcolor}));drawPop();return}
    if(T.closest("[data-gdel]")||T.closest("[data-pdel]")){popState.confirm=true;drawPop();return}
    if(T.closest("[data-gdelno]")||T.closest("[data-pdelno]")){popState.confirm=false;drawPop();return}
    if(T.closest("[data-gdelyes]")){const pr=projById(S.sel),gid=popState.id,ids=S.tasks.filter(x=>x.projectId===pr.id&&taskGroup(x)===gid).map(x=>x.id);closePop();
      await saveGroups(pr.id,groupsOf(pr).filter(g=>g.id!==gid).map(g=>({...g})));for(const id of ids)await safe(del("tasks",id));toast("Group deleted");return}
    if(T.closest("[data-pdelyes]")){const pr=projById(S.sel),ids=S.tasks.filter(x=>x.projectId===pr.id).map(x=>x.id);closePop();S.sel="all";for(const id of ids)await safe(del("tasks",id));await safe(del("projects",pr.id));toast("Project deleted");return}
  }
  const cb=T.closest("[data-collapse]");if(cb){const k=cb.dataset.collapse;S.collapsed.has(k)?S.collapsed.delete(k):S.collapsed.add(k);saveCollapsed();render();return}
  const srt=T.closest("th[data-sort]");if(srt){const k=srt.dataset.sort;if(S.sortKey===k){if(S.sortDir>0)S.sortDir=-1;else{S.sortKey=null;S.sortDir=1}}else{S.sortKey=k;S.sortDir=1}render();return}
  const op=T.closest("[data-open]");if(op){openDrawer(op.dataset.open);return}
  const cd=T.closest("[data-card]")||T.closest("[data-chip]");if(cd){openDrawer(cd.dataset.card||cd.dataset.chip);return}
  const cn=T.closest("[data-calnav]");if(cn){const v=+cn.dataset.calnav;if(!v)S.calMonth=todayStr().slice(0,7);else{const [y,m]=S.calMonth.split("-").map(Number);const d=new Date(y,m-1+v,1);S.calMonth=ymd(d).slice(0,7)}S.calOpen=null;render();return}
  const cm=T.closest("[data-calmore]");if(cm){S.calOpen=cm.dataset.calmore;render();return}
  const da=T.closest("[data-dayadd]");if(da){const id=await createTask("",{due:da.dataset.dayadd});if(id)openDrawer(id);return}
  if(T.id==="addGroup"){const pr=projById(S.sel);const gs=groupsOf(pr).map(g=>({...g}));const used=new Set(gs.map(g=>g.color));const c=GCOLORS.find(c=>!used.has(c))||GCOLORS[gs.length%GCOLORS.length];const ng={id:uid("g"),name:"New group",color:c};
    await saveGroups(pr.id,[...gs,ng]);const inp=document.querySelector(`[data-gname="${ng.id}"]`);if(inp){inp.focus();inp.select()}return}
  const bs=T.closest("[data-bulkst]");if(bs){for(const id of S.selected)await setTask(id,{status:bs.dataset.bulkst});S.selected.clear();render();return}
  if(T.closest("#bulkDup")){const xs=S.tasks.filter(t=>S.selected.has(t.id));S.selected.clear();for(const x of xs)await dupTask(x);toast(`${xs.length} duplicated`);return}
  if(T.id==="bulkDel"){const ids=[...S.selected];S.selected.clear();deleteTasks(ids);return}
  if(T.id==="bulkClear"){S.selected.clear();render();return}
  if(T.closest("#addProjBtn")){const f=$("addProj");f.hidden=!f.hidden;if(!f.hidden)$("newProjName").focus();return}
  if(T.closest("#themeBtn")){const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;const nt=dark?"light":"dark";LS.set("cwp_theme",nt);document.documentElement.dataset.theme=nt;applyTheme();return}
  if(T.closest("#compactBtn")){LS.set("cwp_compact",!LS.get("cwp_compact",false));applyDensity();return}
  if(T.closest("#newTask")){const id=await createTask("");if(id)openDrawer(id);return}
  if(T.closest("#menuBtn")){$("side").classList.toggle("collapsed");return}
  const x=S.openId&&S.tasks.find(t=>t.id===S.openId);
  if(x){const cx=T.closest("[data-cx]");if(cx){e.preventDefault();setTask(x.id,{checklist:(x.checklist||[]).filter((_,i)=>i!==+cx.dataset.cx)});return}
    if(T.id==="postUpd"){const v=$("f-upd").value.trim();if(!v)return;$("f-upd").value="";$("f-upd").blur();setTask(x.id,{updates:[...(x.updates||[]),{by:(user?displayName(user):"Me"),at:Date.now(),t:v}]});return}
    if(T.id==="dDel"){delConfirm=true;renderDrawer();return}
    if(T.id==="dDelNo"){delConfirm=false;renderDrawer();return}
    if(T.id==="dDelYes"){const id=x.id;$("drawer").innerHTML="";closeDrawer();deleteTasks([id]);return}}
  if(T.id==="dClose"||T.id==="scrim"){closeDrawer();return}
});
const typing=el=>el&&(/INPUT|TEXTAREA|SELECT/.test(el.tagName)||el.isContentEditable);
document.addEventListener("keydown",async e=>{
  if(e.key==="Escape"){if(popState){closePop();return}if(S.openId){closeDrawer();return}}
  if(!typing(e.target)&&!e.metaKey&&!e.ctrlKey&&!e.altKey){
    if(e.key==="n"||e.key==="N"){e.preventDefault();const id=await createTask("");if(id)openDrawer(id);return}
    if(e.key==="/"){e.preventDefault();$("q").focus();return}}
  if(e.target.id==="ptitle"||e.target.id==="pdesc"){if(e.key==="Enter")e.target.blur();if(e.key==="Escape"){const pr=projById(S.sel);if(pr)e.target.value=e.target.id==="ptitle"?pr.name:(pr.description||"");e.target.blur()}}
  if(e.target.id==="f-upd"&&e.key==="Enter"&&(e.metaKey||e.ctrlKey)){$("postUpd").click();return}
  if(e.target.classList&&e.target.classList.contains("cellin")){if(e.key==="Enter"){e.preventDefault();e.target.blur()}
    if(e.key==="Escape"){const x=S.tasks.find(t=>t.id===e.target.dataset.name);if(x)e.target.value=x.title||"";const pr=projById(e.target.dataset.projname);if(pr)e.target.value=pr.name;e.target.blur()}}
});
document.addEventListener("focusout",e=>{const t=e.target;if(t&&t.form&&(t.classList.contains("addin")||t.form.classList.contains("quick"))&&t.value.trim()){const f=t.form;setTimeout(()=>f.requestSubmit?f.requestSubmit():f.dispatchEvent(new Event("submit",{cancelable:true,bubbles:true})),0)}});
document.addEventListener("focusout",e=>{if(e.target.classList&&e.target.classList.contains("cellin")&&S.pending)setTimeout(()=>{if(!(document.activeElement&&document.activeElement.classList.contains("cellin")))render()},0)});
document.addEventListener("input",e=>{const x=S.openId&&S.tasks.find(t=>t.id===S.openId);
  if(x&&e.target.id==="f-title"){const v=e.target.value;debounced("title",()=>setTask(x.id,{title:v}))}
  if(x&&e.target.id==="f-notes"){const v=e.target.value;debounced("notes",()=>setTask(x.id,{notes:v}))}
  if(e.target.id==="q")render();
  if(e.target.id==="ptitle")fitInput(e.target);
});
document.addEventListener("change",e=>{const T=e.target;
  if(T.dataset.projname){const pr=projById(T.dataset.projname),v=T.value.trim();if(pr&&v&&v!==pr.name){safe(patch("projects",pr.id,{name:v}))}else if(pr&&!v)T.value=pr.name;return}
  if(T.id==="ptitle"){const pr=projById(S.sel),v=T.value.trim();if(pr&&v&&v!==pr.name){safe(patch("projects",pr.id,{name:v}))}else if(pr&&!v)T.value=pr.name;return}
  if(T.id==="pdesc"){const pr=projById(S.sel);if(pr)safe(patch("projects",pr.id,{description:T.value.trim()}));return}
  if(T.dataset.name){const v=T.value.trim(),x=S.tasks.find(t=>t.id===T.dataset.name);if(x&&v!==(x.title||""))setTask(x.id,{title:v});return}
  if(T.dataset.gname){const pr=projById(S.sel);const v=T.value.trim()||"Untitled group";saveGroups(pr.id,groupsOf(pr).map(g=>g.id===T.dataset.gname?{...g,name:v}:{...g}));return}
  if(T.dataset.pick){T.checked?S.selected.add(T.dataset.pick):S.selected.delete(T.dataset.pick);render();return}
  if(T.dataset.pickall){const s=sections().find(s=>s.key===T.dataset.pickall);if(s)s.tasks.forEach(x=>T.checked?S.selected.add(x.id):S.selected.delete(x.id));render();return}
  if(popState){const x=S.tasks.find(t=>t.id===popState.id);
    if(x&&T.id==="popDue"){setTask(x.id,{due:T.value});closePop();return}
    if(x&&(T.id==="popStart"||T.id==="popEnd")){const p={};p[T.id==="popStart"?"start":"end"]=T.value;
      const s=T.id==="popStart"?T.value:x.start,en=T.id==="popEnd"?T.value:x.end;
      if(T.id==="popStart"&&T.value&&(!en||en<T.value))p.end=T.value;if(T.id==="popEnd"&&T.value&&(!s||s>T.value))p.start=T.value;
      setTask(x.id,p);drawPop();return}}
  const x=S.openId&&S.tasks.find(t=>t.id===S.openId);
  if(x){const m={"f-status":"status","f-pri":"priority","f-due":"due","f-owner":"owner","f-start":"start","f-end":"end","f-group":"group"};
    if(m[T.id]){setTask(x.id,{[m[T.id]]:T.id==="f-owner"?T.value.trim():T.value});return}
    if(T.id==="f-proj"){setTask(x.id,{projectId:T.value,group:groupsOf(projById(T.value))[0].id});return}
    if(T.dataset.ci!==undefined){const cl=(x.checklist||[]).map(c=>({...c}));cl[+T.dataset.ci].d=T.checked;setTask(x.id,{checklist:cl});return}}
  if(["fOwner","fPri","fDue","hideDone"].includes(T.id))render();
});
document.addEventListener("submit",async e=>{e.preventDefault();const f=e.target;
  if(f.classList.contains("addf")){const i=f.querySelector("input"),v=i.value.trim();if(!v)return;i.value="";await createTask(v,{projectId:f.dataset.p,group:f.dataset.g});return}
  if(f.classList.contains("quick")){const i=f.querySelector("input"),v=i.value.trim();if(!v)return;i.value="";await createTask(v,{status:f.dataset.status});return}
  if(f.id==="ownerForm"&&popState){const v=$("popOwner").value.trim();if(v)setTask(popState.id,{owner:v});closePop();return}
  if(f.id==="addProj"){const v=$("newProjName").value.trim();if(!v)return;$("newProjName").value="";f.hidden=true;const p={id:uid("p"),name:v,description:"",color:GCOLORS[S.projects.length%GCOLORS.length],created:Date.now(),groups:DEFAULT_GROUPS.map(g=>({...g}))};S.sel=p.id;LS.set("cwp_sel",S.sel);await safe(put("projects",p));return}
  if(f.id==="clAdd"){const x=S.tasks.find(t=>t.id===S.openId),v=$("f-cl").value.trim();if(!x||!v)return;$("f-cl").value="";await setTask(x.id,{checklist:[...(x.checklist||[]),{t:v,d:false}]});$("f-cl")&&$("f-cl").focus();return}
});
/* drag: kanban cards and calendar chips */
let dragId=null;
document.addEventListener("dragstart",e=>{const c=e.target.closest&&e.target.closest(".kcard,.chip");if(!c)return;dragId=c.dataset.card||c.dataset.chip;c.classList.add("dragging");try{e.dataTransfer.setData("text/plain",dragId);e.dataTransfer.effectAllowed="move"}catch(_){}});
document.addEventListener("dragend",()=>{document.querySelectorAll(".dragging,.over").forEach(el=>el.classList.remove("dragging","over"));dragId=null});
document.addEventListener("dragover",e=>{const col=e.target.closest&&e.target.closest(".col,.day");if(!col||!dragId)return;e.preventDefault();document.querySelectorAll(".over").forEach(c=>c!==col&&c.classList.remove("over"));col.classList.add("over")});
document.addEventListener("drop",e=>{const col=e.target.closest&&e.target.closest(".col,.day");if(!col||!dragId)return;e.preventDefault();col.classList.remove("over");const x=S.tasks.find(t=>t.id===dragId);if(!x)return;
  if(col.dataset.status&&x.status!==col.dataset.status)setTask(x.id,{status:col.dataset.status});
  if(col.dataset.day&&x.due!==col.dataset.day){setTask(x.id,{due:col.dataset.day});toast("Moved to "+md(col.dataset.day))}});

/* boot */
applyTheme();applyDensity();boot();
})();
</script>
</body>
</html>
