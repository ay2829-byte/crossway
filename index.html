<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crossway</title>
<meta name="description" content="Crossway is a free, simple project tracker. Groups, statuses, priorities, due dates, timelines and a Kanban board.">
<meta property="og:title" content="Crossway">
<meta property="og:description" content="A free, simple project tracker for your work and life.">
<meta property="og:image" content="logo.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"%3E%3Crect width="32" height="32" rx="9" fill="%230073EA"/%3E%3Cpath d="M8 23.5C14 23.5 18 8.5 24 8.5" fill="none" stroke="%23fff" stroke-width="3.4" stroke-linecap="round"/%3E%3Cpath d="M8 8.5C14 8.5 18 23.5 24 23.5" fill="none" stroke="%23fff" stroke-opacity=".5" stroke-width="3.4" stroke-linecap="round"/%3E%3Ccircle cx="24" cy="8.5" r="3.1" fill="%2300C875"/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Poppins:wght@500;600&display=swap">
<style>
:root{
  --bg:#FFFFFF; --panel:#FFFFFF; --soft:#F6F7FB; --hover:#F0F2F8; --ink:#323338; --muted:#676879; --line:#D0D4E4; --line2:#E6E9EF;
  --accent:#0073EA; --accent-ink:#FFFFFF; --accent-soft:#CCE5FF;
  --danger:#D83A52; --ok:#00A95C; --warn:#E69A14;
  --pill-empty:#D5D8DF; --pill-ink:#323338; --pill-on:#0060C7;
  --shadow:0 6px 20px rgba(0,0,0,.14);
  --head:"Poppins","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#181B34; --panel:#1F2342; --soft:#292F4C; --hover:#30355A; --ink:#D5D8DF; --muted:#9699A6; --line:#4B4E69; --line2:#3A3E5C;
    --accent:#3D8BFF; --accent-ink:#FFFFFF; --accent-soft:#1D3664; --danger:#F0647A; --ok:#2BD384; --warn:#FDAB3D;
    --pill-empty:#4B4F6B; --pill-ink:#E6E8EE; --pill-on:#2F7FF0; --shadow:0 8px 26px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#181B34; --panel:#1F2342; --soft:#292F4C; --hover:#30355A; --ink:#D5D8DF; --muted:#9699A6; --line:#4B4E69; --line2:#3A3E5C;
  --accent:#3D8BFF; --accent-ink:#FFFFFF; --accent-soft:#1D3664; --danger:#F0647A; --ok:#2BD384; --warn:#FDAB3D;
  --pill-empty:#4B4F6B; --pill-ink:#E6E8EE; --pill-on:#2F7FF0; --shadow:0 8px 26px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.4 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
svg{display:block}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100%}

/* sidebar */
.side{background:var(--soft);border-right:1px solid var(--line2);padding:18px 12px;display:flex;flex-direction:column;gap:16px}
.brandrow{display:flex;align-items:center;justify-content:space-between}
.brand{font:600 18px/1 var(--head);padding-inline:8px;display:flex;align-items:center;gap:9px}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:#fff;font:700 12px var(--body);font-style:normal}
.side h6{margin:0;padding-inline:8px;font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.plist{display:flex;flex-direction:column;gap:1px}
.pitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:6px;font-size:14px}
.pitem:hover{background:var(--hover)}
.pitem.on{background:var(--accent-soft);font-weight:600}
.pitem .dot{width:9px;height:9px;border-radius:3px;flex:none}
.pitem .n{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pitem .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addp{display:flex;gap:6px;padding-inline:4px}
.addp input{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 9px}
.addp button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:0 10px}
.sidefoot{margin-top:auto;padding-inline:8px;font-size:12px;color:var(--muted)}
.menu-btn{display:none}

/* main */
.main{padding-block:22px 90px;padding-inline:28px;min-width:0;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font:600 24px/1.2 var(--head);letter-spacing:-.01em;text-wrap:balance}
.top .sp{flex:1}
#ptitle{font:inherit;letter-spacing:inherit;color:inherit;border:1px solid transparent;background:none;border-radius:6px;padding:2px 6px;margin-left:-7px;field-sizing:content;min-width:4ch;max-width:100%}
#ptitle:hover{border-color:var(--line);background:var(--soft)}
#titleText{display:flex;align-items:center;gap:4px;min-width:0}
.pencil{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:6px;display:grid;place-items:center;padding:0;flex:none}
.pencil:hover{background:var(--hover);color:var(--ink)}
.pencil svg{width:18px;height:18px}
#ptitle:focus{border-color:var(--accent);outline:none;background:var(--panel)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line2)}
.tabs button{border:0;background:none;padding:8px 12px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;border-radius:6px 6px 0 0}
.tabs button:hover{background:var(--hover)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 13px;font-weight:500}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.pri:hover{filter:brightness(1.08);background:var(--accent)}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--danger)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools input[type=search],.tools select{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 10px}
.tools input[type=search]{width:220px;max-width:100%}
.tools label{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,1.6fr);border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:var(--line2);gap:1px}
.stat{background:var(--panel);padding:14px 18px 15px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat .lb{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.stat .lb i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.stat b{font:600 28px/1 var(--head);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.warn b{color:var(--danger)}
.stat.hot b{color:var(--c)}
.stat.prog .top2{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.segbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--soft);gap:2px}
.segbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.legend span::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--c)}
@media (max-width:1100px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.stat.prog{grid-column:1/-1}}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* groups (table view) */
.groups{display:flex;flex-direction:column;gap:34px}
.group{--g:#579BFC}
.ghead{display:flex;align-items:center;gap:6px;margin-bottom:8px;min-height:32px}
.chev{border:0;background:none;color:var(--g);width:26px;height:26px;border-radius:5px;display:grid;place-items:center;padding:0}
.chev:hover{background:var(--hover)}
.chev svg{width:18px;height:18px;transition:transform .15s}
.group.collapsed .chev svg{transform:rotate(-90deg)}
.gname{font:600 18px/1.2 var(--head);color:var(--g);border:1px solid transparent;background:none;border-radius:5px;padding:2px 6px;min-width:60px;max-width:100%}
input.gname{flex:0 1 auto;width:auto;field-sizing:content;min-width:4ch}
input.gname:hover{border-color:var(--line)}
input.gname:focus{border-color:var(--accent);outline:none;color:var(--ink)}
.gcount{font-size:13px;color:var(--muted);margin-left:4px;white-space:nowrap}
.gmenu{border:0;background:none;color:var(--muted);width:28px;height:28px;border-radius:5px;font-size:18px;line-height:1;padding:0}
.gmenu:hover{background:var(--hover)}
.tscroll{overflow-x:auto;padding-bottom:2px}
table.gt{width:100%;min-width:940px;border-collapse:separate;border-spacing:0;table-layout:fixed}
.gt th,.gt td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);height:38px;padding:0;background:var(--bg)}
.gt th{border-top:1px solid var(--line);font-weight:400;color:var(--ink);text-align:center;font-size:14px;cursor:pointer;user-select:none;white-space:nowrap}
.gt th:hover{background:var(--hover)}
.gt th:first-child,.gt td:first-child{border-left:6px solid var(--g)}
.gt thead th:first-child{border-top-left-radius:6px}
.gt tr.addrow td:first-child{border-left-color:color-mix(in srgb,var(--g) 45%,transparent);border-bottom-left-radius:6px}
.gt th:first-child,.gt th:nth-child(2){cursor:default}
.gt th.tl{text-align:center}
.gt th .sort{color:var(--muted);font-size:11px;margin-left:4px}
.gt tbody tr:not(.addrow):hover td:not(.fill){background:var(--hover)}
.gt tbody tr.sel td:not(.fill){background:var(--accent-soft)}
.cc{text-align:center}
.cc input{width:16px;height:16px;accent-color:var(--accent);vertical-align:middle;margin:0}
.nmwrap{display:flex;align-items:center;height:100%;padding-left:10px;gap:4px}
.cellin{flex:1;min-width:0;border:1px solid transparent;background:none;border-radius:4px;padding:4px 6px;text-overflow:ellipsis}
.cellin:hover{border-color:var(--line)}
.cellin:focus{border-color:var(--accent);outline:none;background:var(--panel)}
.done-name .cellin{color:var(--muted)}
.subc{font-size:12px;color:var(--muted);white-space:nowrap;padding-inline:4px;font-variant-numeric:tabular-nums}
.open{border:0;border-left:1px solid var(--line);background:none;color:var(--muted);height:100%;width:44px;display:grid;place-items:center;flex:none;padding:0}
.open:hover{color:var(--accent)}
.open svg{width:20px;height:20px}
.cellbtn{border:0;background:none;width:100%;height:100%;display:flex;align-items:center;justify-content:center;gap:7px;padding:0 8px;font-size:14px}
.fillcell .cellbtn{color:#fff;font-weight:600;background:var(--c);text-shadow:0 1px 1px rgba(0,0,0,.28)}
.fillcell .cellbtn:hover{filter:brightness(.94)}
.fillcell .cellbtn.nopri{background:transparent;color:var(--muted);text-shadow:none;font-weight:400}
.fillcell .cellbtn.nopri:hover{background:var(--hover);filter:none}
.cellbtn{border-radius:0;height:37px;line-height:1}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--t,#fff);font:700 11px var(--body);letter-spacing:.02em}
.av-empty{color:var(--muted)}
.av-empty svg{width:28px;height:28px}
.duebtn .ic{width:16px;height:16px;flex:none}
.duebtn .ic.late{color:var(--danger)}
.duebtn .ic.ok{color:var(--ok)}
.duebtn .strike{text-decoration:line-through;color:var(--muted)}
.duebtn .ph{color:var(--muted);opacity:0;font-size:13px}
.duebtn:hover .ph{opacity:1}
.tlpill{display:inline-block;min-width:108px;padding:3px 12px;border-radius:14px;background:var(--pill-empty);color:var(--pill-ink);font-size:13px;font-weight:600;white-space:nowrap;text-align:center}
.tlpill.on{background:var(--pill-on);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.2)}
.gt td.fill,.gt th.fill{border-right:0}
.gt tr.addrow td{height:36px}
.addin{width:100%;height:100%;border:0;background:none;padding:0 16px;color:var(--ink)}
.addin::placeholder{color:var(--muted)}
.addin:focus{outline:none;background:var(--panel);box-shadow:inset 0 0 0 1px var(--accent)}
.gt tfoot td{border-bottom:1px solid var(--line);height:44px;background:var(--bg)}
.gt tfoot td:first-child,.gt tfoot td:nth-child(2){border:0;background:transparent}
.gt tfoot td:nth-child(3){border-left:1px solid var(--line);border-bottom-left-radius:6px}
.gt tfoot td.fill{border-right:0}
.dist{display:flex;height:24px;margin:0 10px;overflow:hidden;background:var(--pill-empty)}
.dist i{display:block;height:100%}
.sumpill{display:flex;justify-content:center}
.collapsed .tbody-wrap{display:none}
.newgroup{align-self:flex-start;display:flex;gap:8px;align-items:center}
.nogroup{color:var(--muted);font-size:13px;padding:8px 2px}

/* board */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;align-items:start}
.col{background:var(--soft);border-radius:8px;display:flex;flex-direction:column;gap:8px;min-height:120px;padding:0 8px 10px;transition:background .15s;overflow:hidden}
.col.over{background:var(--accent-soft)}
.colh{margin:0 -8px 2px;padding:9px 12px;color:var(--t,#fff);font-weight:600;display:flex;justify-content:space-between;background:var(--c)}
.card{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:10px 11px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;width:100%;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card:hover{border-color:var(--line)}
.card.dragging{opacity:.45}
.card .t{font-weight:500;overflow-wrap:anywhere}
.card.done .t{color:var(--muted);text-decoration:line-through}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:4px;padding:2px 7px;font-size:12px;white-space:nowrap;color:var(--t,#fff);font-weight:600;background:var(--c)}
.tag.plain{background:var(--soft);color:var(--muted)}
.tag .av{width:18px;height:18px;font-size:9px}
.late{color:var(--danger)}
.quick input{width:100%;border:1px dashed var(--line);background:transparent;border-radius:6px;padding:7px 9px}
.quick input:focus{border-style:solid;background:var(--panel)}
.empty{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.empty b{display:block;color:var(--ink);font:600 17px var(--head);margin-bottom:4px}

/* popover */
.pop{position:fixed;z-index:40;background:var(--panel);border-radius:8px;box-shadow:var(--shadow);border:1px solid var(--line2);padding:10px;width:220px;display:flex;flex-direction:column;gap:6px}
.pop .opt{border:0;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.28);font-weight:600;padding:8px;border-radius:4px;background:var(--c);text-align:center}
.pop .opt:hover{filter:brightness(.92)}
.pop .opt.cur{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--c)}
.pop label{font-size:12px;color:var(--muted)}
.pop input[type=date],.pop input[type=text]{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 8px;width:100%}
.pop .row{display:flex;gap:6px;flex-wrap:wrap}
.pop .lnk{border:0;background:none;color:var(--accent);padding:4px 2px;font-size:13px;text-align:left}
.pop .lnk.danger{color:var(--danger)}
.pop .person{display:flex;align-items:center;gap:8px;border:0;background:none;padding:5px 4px;border-radius:5px;text-align:left}
.pop .person:hover{background:var(--hover)}
.pop .person .av{width:24px;height:24px;font-size:10px}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;background:var(--c);padding:0}
.sw button.cur{border-color:var(--ink)}

/* bulk bar */
.bulk{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--panel);border:1px solid var(--line2);box-shadow:var(--shadow);border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 32px)}
.bulk b{background:var(--accent);color:#fff;border-radius:6px;padding:4px 9px;font-weight:600}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,30,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--panel);border-left:1px solid var(--line2);z-index:21;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 22px calc(18px + env(safe-area-inset-bottom,0px));gap:16px;overflow-y:auto;box-shadow:-10px 0 30px rgba(0,0,0,.14)}
.dh{display:flex;gap:8px;align-items:center}
.dh .sp{flex:1}
.stamp{font-size:12px;color:var(--muted)}
.drawer textarea#f-title{font:600 20px/1.3 var(--head);border:0;background:none;resize:none;width:100%;padding:0}
.fields{display:grid;grid-template-columns:110px 1fr;gap:10px 12px;align-items:center}
.fields label{color:var(--muted);font-size:13px}
.fields select,.fields input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 9px;width:100%}
.two{display:flex;gap:8px}
.drawer h6{margin:0;font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#f-notes{width:100%;min-height:110px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;resize:vertical}
.cl{display:flex;flex-direction:column;gap:6px}
.cli{display:flex;align-items:center;gap:9px}
.cli span{flex:1;overflow-wrap:anywhere}
.cli.done span{text-decoration:line-through;color:var(--muted)}
.cli .x{border:0;background:none;color:var(--muted);font-size:16px}
.cli input{width:16px;height:16px;accent-color:var(--ok)}
.cladd{display:flex;gap:6px}
.cladd input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 9px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:45}

/* account + auth */
.me{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:10px 8px 0;border-top:1px solid var(--line2)}
.me .who{display:flex;align-items:center;gap:9px;min-width:0}
.me .who .av{width:30px;height:30px;flex:none}
.me .who div{min-width:0}
.me .who b{display:block;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .who small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .acts{display:flex;gap:6px;flex-wrap:wrap}
.me .acts a,.me .acts button{font-size:12.5px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 9px;color:var(--ink);text-decoration:none}
.me .acts a:hover,.me .acts button:hover{background:var(--hover)}
.authwrap{min-height:100%;display:grid;place-items:center;padding-block:40px;padding-inline:16px;background:var(--soft)}
.authcard{width:min(400px,100%);background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);padding:30px 28px;display:flex;flex-direction:column;gap:14px}
.authcard .brand{padding:0;font-size:22px;gap:10px}
.authcard .logo{height:28px!important}
.authcard .wordmark{font-size:31px}
.authcard h2{margin:6px 0 0;font:600 22px/1.25 var(--head);text-wrap:balance}
.authcard p.lead{margin:0;color:var(--muted)}
.authcard form{display:flex;flex-direction:column;gap:10px}
.authcard label{font-size:13px;font-weight:500;display:flex;flex-direction:column;gap:5px}
.authcard input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;font-size:15px}
.authcard input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.authcard .btn{padding:10px 14px;font-size:15px;border-radius:8px;width:100%}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line2)}
.authlinks{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13.5px}
.authlinks button{border:0;background:none;color:var(--accent);padding:0;font-weight:500}
.amsg{font-size:13.5px;border-radius:8px;padding:9px 11px}
.amsg.err{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
.amsg.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ink)}
.fine{font-size:12px;color:var(--muted);text-align:center}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{border-right:0;border-bottom:1px solid var(--line2);padding:12px 16px;gap:10px}
  .side.collapsed .plist,.side.collapsed h6,.side.collapsed .addp,.side.collapsed .sidefoot,.side.collapsed .me{display:none}
  .menu-btn{display:inline-block}
  .main{padding-inline:16px;padding-block:16px 90px}
  .tools input[type=search]{width:100%}
  .top h1{font-size:21px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.tlpill{min-width:96px}
.tlpill:not(.on){background:var(--soft);color:var(--muted);text-shadow:none;font-weight:500}
/* ---------- polish v2 ---------- */
:root{--app:#F1F3F8; --line:#E0E3EB; --line2:#EBEDF3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--app:#11142A; --line:#3A3E5C; --line2:#30344F}}
:root[data-theme="dark"]{--app:#11142A; --line:#3A3E5C; --line2:#30344F}
body{background:var(--app)}
.app{grid-template-columns:244px 1fr}
.side{background:transparent;border-right:0;padding:18px 12px 14px}
.brand{font-size:19px}
.brand i{width:26px;height:26px;border-radius:7px;font-size:13px}
.pitem{padding:7px 10px;font-size:14px;color:var(--ink)}
.pitem:hover{background:rgba(103,104,121,.10)}
.pitem.on{background:var(--accent-soft);color:var(--ink)}
.addp input{background:var(--bg);border-color:var(--line)}
.addp button{background:var(--bg);border-color:var(--line)}
.main{padding-block:8px;padding-inline:0 8px;gap:0;display:block}
.boardcard{background:var(--bg);border:1px solid var(--line2);border-radius:14px;min-height:calc(100vh - 16px);padding-block:22px 90px;padding-inline:30px;display:flex;flex-direction:column;gap:16px;box-shadow:0 1px 2px rgba(20,24,40,.04)}
.top{gap:6px}
.top h1{font-size:24px}
#titleText{display:flex;align-items:center;gap:2px}
#titleText .pencil{opacity:0;transition:opacity .15s}
#titleText:hover .pencil,#titleText .pencil:focus-visible{opacity:1}
.iconbtn{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:6px;display:grid;place-items:center;padding:0;cursor:pointer}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
.iconbtn svg{width:18px;height:18px}
.tabs{gap:2px;border-bottom:1px solid var(--line2);margin-top:-6px}
.tabs button{display:inline-flex;align-items:center;gap:7px;padding:7px 10px 9px;font-size:14px}
.tabs button svg{width:17px;height:17px}
.stats{border-color:var(--line2);background:var(--line2);border-radius:10px}
.stat{padding:12px 16px 13px;gap:5px}
.stat b{font-size:24px}
.tools{gap:2px}
.tools .newbtn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px 6px 11px;border-radius:6px;margin-right:10px;font-weight:500}
.tools .newbtn svg{width:15px;height:15px}
.tools .tb{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 10px;border-radius:6px;color:var(--ink);font-size:14px;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.tools .tb:hover{background:var(--hover)}
.tools .tb svg{width:17px;height:17px;color:var(--muted);flex:none}
.tools .tb.on{background:var(--accent-soft)}
.tools .tb.on svg{color:var(--accent)}
.tools .tsearch input{border:0;background:none;padding:0;width:70px;outline:none;transition:width .2s}
.tools .tsearch input:focus,.tools .tsearch input:not(:placeholder-shown){width:190px}
.tools .tsearch:focus-within{border-color:var(--accent);background:var(--bg)}
.tools .tsel select{appearance:none;-webkit-appearance:none;border:0;background:none;padding:0;cursor:pointer;color:inherit;font:inherit}
.tools .tchk input{width:15px;height:15px;margin:0;accent-color:var(--accent)}
.groups{gap:30px}
.gname{font-size:17px}
.gt th{color:var(--muted);font-size:13.5px;height:36px}
.gt td{height:36px}
.cellbtn{height:35px}
.gt tbody tr:not(.addrow):hover td:not(.fill){background:var(--soft)}
.gt tfoot td{height:40px}
.newgroup{border-color:var(--line);color:var(--ink)}
.col{background:var(--soft)}
@media (max-width:760px){
  .main{padding-inline:8px;padding-block:0 8px}
  .boardcard{min-height:auto;padding-inline:16px;padding-block:16px 90px;border-radius:12px}
  .side{padding:12px 16px}
  .tools .tsearch{flex:1 1 100%}
  .tools .tsearch input,.tools .tsearch input:focus{width:100%}
}
.logo{width:30px;height:30px;display:block;flex:none;filter:drop-shadow(0 1px 2px rgba(0,115,234,.25))}
.brand{letter-spacing:-.01em}
.logo{width:auto!important;height:22px!important;display:block;flex:none;filter:none!important}
.wordmark{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;font-weight:800;font-size:25px;line-height:1;letter-spacing:-.025em;color:var(--wordmark);font-optical-sizing:auto}
.brand{gap:10px!important;align-items:center}
:root{--wordmark:#16152B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--wordmark:#F4F5FA}}
:root[data-theme="dark"]{--wordmark:#F4F5FA}
</style>
</head>
<body>
<div class="app" id="app" hidden>
  <aside class="side collapsed" id="side">
    <div class="brandrow"><div class="brand"><svg class="logo" viewBox="0 0 176 181" aria-hidden="true"><rect width="176" height="50" rx="25" fill="#3B5BDB"/><rect y="65.5" width="94" height="50" rx="25" fill="#F2643D"/><rect y="131" width="176" height="50" rx="25" fill="#12A38A"/></svg><span class="wordmark">crossway</span></div><button class="btn ghost menu-btn" id="menuBtn">Projects</button></div>
    <h6>Views</h6>
    <div class="plist" id="viewsList"></div>
    <h6>Projects</h6>
    <div class="plist" id="projList"></div>
    <form class="addp" id="addProj">
      <input id="newProjName" placeholder="New project" maxlength="60" aria-label="New project name">
      <button type="submit" aria-label="Add project">+</button>
    </form>
    <div class="me" id="me"></div>
    <div class="sidefoot" id="syncNote" style="margin-top:0">Loading…</div>
  </aside>

  <main class="main">
   <div class="boardcard">
    <div class="top">
      <h1 id="titleText">All tasks</h1>
      <button class="iconbtn" id="projMenu" hidden aria-label="Project settings" title="Project settings"><svg viewBox="0 0 20 20" fill="currentColor"><circle cx="4.5" cy="10" r="1.6"/><circle cx="10" cy="10" r="1.6"/><circle cx="15.5" cy="10" r="1.6"/></svg></button>
    </div>
    <div class="tabs" role="tablist">
      <button id="vTable" class="on"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="14" height="12" rx="2"/><path d="M3 8h14M8 8v8"/></svg>Main table</button>
      <button id="vBoard"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="4" height="12" rx="1.2"/><rect x="8.5" y="4" width="4" height="8" rx="1.2"/><rect x="14" y="4" width="3" height="10" rx="1.2"/></svg>Kanban</button>
    </div>
    <div id="projSettings" hidden></div>
    <div class="stats" id="stats"></div>
    <div class="tools">
      <button class="btn pri newbtn" id="newTask"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 4.5v11M4.5 10h11"/></svg>New task</button>
      <label class="tb tsearch"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="9" r="5.5"/><path d="M13.2 13.2L17 17" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="Search" aria-label="Search tasks"></label>
      <label class="tb tsel"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M5 17V3.5M5 4h9l-2 3.5 2 3.5H5"/></svg><select id="fPri" aria-label="Filter by priority"><option value="">Priority</option><option value="urgent">Critical</option><option value="high">High</option><option value="med">Medium</option><option value="low">Low</option></select></label>
      <label class="tb tsel"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4.5" width="14" height="12.5" rx="2"/><path d="M3 8.5h14M7 3v3M13 3v3" stroke-linecap="round"/></svg><select id="fDue" aria-label="Filter by due date"><option value="">Due date</option><option value="late">Overdue</option><option value="week">Due in 7 days</option><option value="none">No due date</option></select></label>
      <label class="tb tchk"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 10s2.8-5 7.5-5 7.5 5 7.5 5-2.8 5-7.5 5-7.5-5-7.5-5z"/><circle cx="10" cy="10" r="2.3"/></svg><input type="checkbox" id="hideDone">Hide done</label>
    </div>
    <div id="view"></div>
   </div>
  </main>
</div>

<div class="authwrap" id="auth" hidden><div class="authcard" id="authcard"></div></div>
<div class="pop" id="pop" hidden></div>
<div class="bulk" id="bulk" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Task details"></aside>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const STATUSES=[["todo","Not started","#848A9C"],["doing","Working on it","#EE8E0B"],["review","Waiting","#8E44CF"],["stuck","Stuck","#D32A44"],["done","Done","#00A862"]];
const PRIS=[["urgent","Critical","#333333"],["high","High","#4A1FA8"],["med","Medium","#5559DF"],["low","Low","#3A86EE"]];
const GCOLORS=["#579BFC","#00C875","#FDAB3D","#DF2F4A","#A25DDC","#FF7575","#037F4C","#9CD326","#784BD1","#FF642E"];
const DEFAULT_GROUPS=[{id:"g_main",name:"To do",color:"#579BFC"},{id:"g_done",name:"Completed",color:"#00C875"}];
function ink(hex){const m=/^#([0-9a-f]{6})$/i.exec(hex||"");if(!m)return"#fff";const n=parseInt(m[1],16),ch=[n>>16&255,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});
  const L=.2126*ch[0]+.7152*ch[1]+.0722*ch[2];return "#fff"}
const cv=c=>`--c:${c};--t:${ink(c)}`;
const stInfo=k=>STATUSES.find(s=>s[0]===k)||STATUSES[0];
const prInfo=k=>PRIS.find(s=>s[0]===k)||null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const todayStr=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return ymd(d)};
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const md=s=>{const d=new Date(s+"T00:00:00");return MON[d.getMonth()]+" "+d.getDate()};
function fmtRange(a,b){if(!a&&!b)return"";a=a||b;b=b||a;if(b<a)[a,b]=[b,a];if(a===b)return md(a);const A=new Date(a+"T00:00:00"),B=new Date(b+"T00:00:00");return A.getMonth()===B.getMonth()?md(a)+" – "+B.getDate():md(a)+" – "+md(b)}
function initials(n){const p=String(n).trim().split(/\s+/);return((p[0]||"")[0]||"").toUpperCase()+((p[1]||"")[0]||"").toUpperCase()}
function avColor(n){let h=0;for(const c of String(n))h=(h*31+c.charCodeAt(0))>>>0;return GCOLORS[h%GCOLORS.length]}
const avatar=n=>n?`<span class="av" style="background:${avColor(n)};--t:${ink(avColor(n))}" title="${esc(n)}">${esc(initials(n))}</span>`:`<span class="av-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="10.5"/><circle cx="12" cy="10" r="3.4"/><path d="M5.6 18.8c1.5-2.5 3.8-3.8 6.4-3.8s4.9 1.3 6.4 3.8"/></svg></span>`;
const IC={
  chev:'<svg viewBox="0 0 20 20"><path d="M5 7.5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  bubble:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M12 3.5a8.5 8.5 0 0 0-7.4 12.7L3.5 20.5l4.4-1.1A8.5 8.5 0 1 0 12 3.5z"/><path d="M12 8.5v7M8.5 12h7" stroke-linecap="round"/></svg>',
  alert:'<svg class="ic late" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10" cy="10" r="7.5"/><path d="M10 6v5" stroke-linecap="round"/><circle cx="10" cy="13.8" r=".6" fill="currentColor"/></svg>',
  check:'<svg class="ic ok" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10.5l3.5 3.5 7.5-8"/></svg>'
};

const S={projects:[],tasks:[],sel:"all",view:"table",openId:null,sortKey:null,sortDir:1,ready:{p:false,t:false},selected:new Set(),collapsed:new Set(),pending:false};
try{const v=localStorage.getItem("wb_view");if(v==="board")S.view="board";const s=localStorage.getItem("wb_sel");if(s)S.sel=s;const c=JSON.parse(localStorage.getItem("wb_collapsed")||"[]");S.collapsed=new Set(c)}catch(e){}
const saveCollapsed=()=>{try{localStorage.setItem("wb_collapsed",JSON.stringify([...S.collapsed]))}catch(e){}};

/* storage: Supabase */
let sb=null,user=null,pending=0,chain=Promise.resolve(),mode="cloud",recovering=false,isAdmin=false;
function queue(fn){pending++;chain=chain.then(fn).catch(e=>{console.warn(e);toast("Couldn't save that change. Check your connection and try again.")}).finally(()=>{pending--;$("syncNote").textContent=pending?"Saving…":"All changes saved"});$("syncNote").textContent="Saving…";return chain}
function toRow(kind,obj){const{id,...data}=obj;const r={id,data:JSON.parse(JSON.stringify(data))};if(kind==="tasks")r.project_id=obj.projectId||null;return r}
async function put(kind,obj){const a=S[kind];const i=a.findIndex(x=>x.id===obj.id);if(i>=0)a[i]=obj;else a.push(obj);render();const r=toRow(kind,obj);
  return queue(async()=>{const{error}=await sb.from(kind).upsert(r);if(error)throw error})}
async function patch(kind,id,p){const o=S[kind].find(x=>x.id===id);if(!o)return;Object.assign(o,p);render();const r=toRow(kind,o);
  return queue(async()=>{const{error}=await sb.from(kind).upsert(r);if(error)throw error})}
async function del(kind,id){S[kind]=S[kind].filter(x=>x.id!==id);render();
  return queue(async()=>{const{error}=await sb.from(kind).delete().eq("id",id);if(error)throw error})}
function safe(p){return Promise.resolve(p).catch(e=>console.warn(e))}
function setTask(id,p){return safe(patch("tasks",id,p))}

async function loadAll(seed){
  const [p,t]=await Promise.all([sb.from("projects").select("id,data").range(0,4999),sb.from("tasks").select("id,data").range(0,9999)]);
  if(p.error||t.error){console.warn(p.error||t.error);$("syncNote").textContent="Couldn't load your data. Refresh to try again.";return}
  S.projects=p.data.map(r=>({...r.data,id:r.id}));S.tasks=t.data.map(r=>({...r.data,id:r.id}));S.ready={p:true,t:true};
  if(seed&&!S.projects.length)await seedStarter();
  $("syncNote").textContent="All changes saved";render();
}
async function seedStarter(){const t=todayStr(),pid=uid("p");
  await put("projects",{id:pid,name:"My first project",color:GCOLORS[0],created:Date.now(),groups:[{id:"g_main",name:"To do",color:"#579BFC"},{id:"g_done",name:"Completed",color:"#00C875"}]});
  const mk=(title,o)=>({id:uid("t"),title,projectId:pid,group:"g_main",status:"todo",priority:"",due:"",owner:"",start:"",end:"",notes:"",checklist:[],created:Date.now()+Math.random(),...o});
  const me=(user.user_metadata&&(user.user_metadata.full_name||user.user_metadata.name))||"";
  for(const x of [mk("Click a status cell to change it",{status:"doing",priority:"high",due:t,owner:me}),
    mk("Click the date to set a due date",{priority:"med"}),
    mk("Open me with the bubble icon to add steps and notes",{checklist:[{t:"Add a step",d:true},{t:"Tick it off",d:false}],notes:"Anything you type here saves automatically."}),
    mk("Create my Crossway account",{status:"done",group:"g_done",due:t,owner:me})])await put("tasks",x);
  S.sel=pid;
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&user&&!pending&&!S.openId&&!(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName)))loadAll(false)});

/* auth */
const displayName=u=>(u.user_metadata&&(u.user_metadata.full_name||u.user_metadata.name))||(u.email||"").split("@")[0];
function renderMe(){if(!user)return;const n=displayName(user);
  $("me").innerHTML=`<div class="who">${avatar(n)}<div><b>${esc(n)}</b><small>${esc(user.email||"")}</small></div></div>
  <div class="acts">${isAdmin?`<a href="admin.html">Signup stats</a>`:""}<button id="signOut">Sign out</button></div>`}
function showApp(){$("auth").hidden=true;$("app").hidden=false}
function showAuth(view,msg){$("app").hidden=true;$("auth").hidden=false;drawAuth(view,msg)}
function drawAuth(view,msg){
  const c=$("authcard"),m=msg?`<div class="amsg ${msg.err?"err":"ok"}">${esc(msg.text)}</div>`:"";
  const head=`<div class="brand"><svg class="logo" viewBox="0 0 176 181" aria-hidden="true"><rect width="176" height="50" rx="25" fill="#3B5BDB"/><rect y="65.5" width="94" height="50" rx="25" fill="#F2643D"/><rect y="131" width="176" height="50" rx="25" fill="#12A38A"/></svg><span class="wordmark">crossway</span></div>`;
  if(view==="setup"){c.innerHTML=`${head}<h2>Almost ready</h2><p class="lead">Add your Supabase project URL and anon key to <b>config.js</b>, then reload this page.</p>`;return}
  if(view==="forgot"){c.innerHTML=`${head}<h2>Reset your password</h2><p class="lead">We'll email you a link to set a new one.</p>${m}
    <form id="fForgot"><label>Email<input type="email" id="aEmail" required autocomplete="email"></label><button class="btn pri" type="submit">Send reset link</button></form>
    <div class="authlinks"><button data-av="signin">Back to sign in</button></div>`;return}
  if(view==="reset"){c.innerHTML=`${head}<h2>Choose a new password</h2>${m}
    <form id="fReset"><label>New password<input type="password" id="aPass" minlength="6" required autocomplete="new-password"></label><button class="btn pri" type="submit">Save password</button></form>`;return}
  const up=view==="signup";
  c.innerHTML=`${head}<h2>${up?"Create your free account":"Welcome back"}</h2><p class="lead">${up?"Plan projects, track every task, and see what's due.":"Sign in to see your projects and tasks."}</p>${m}
    <button class="btn gbtn" id="aGoogle" type="button">Continue with Google</button>
    <div class="or">or</div>
    <form id="${up?"fSignup":"fSignin"}">
      ${up?`<label>Name<input type="text" id="aName" maxlength="60" autocomplete="name" required></label>`:""}
      <label>Email<input type="email" id="aEmail" required autocomplete="email"></label>
      <label>Password<input type="password" id="aPass" minlength="6" required autocomplete="${up?"new-password":"current-password"}"></label>
      <button class="btn pri" type="submit">${up?"Create account":"Sign in"}</button>
    </form>
    <div class="authlinks">${up?`<span>Have an account? <button data-av="signin">Sign in</button></span>`:`<span>New here? <button data-av="signup">Create an account</button></span><button data-av="forgot">Forgot password?</button>`}</div>
    <p class="fine">Your projects are private to your account.</p>`;
}
const here=()=>location.origin+location.pathname;
const friendly=e=>{const t=(e&&e.message)||"Something went wrong. Try again.";if(/Invalid login/i.test(t))return"That email and password don't match. Try again or reset your password.";if(/not confirmed/i.test(t))return"Confirm your email first. Check your inbox for the link.";if(/already registered/i.test(t))return"That email already has an account. Sign in instead.";return t};
$("auth").addEventListener("click",async e=>{const v=e.target.closest("[data-av]");if(v){drawAuth(v.dataset.av);return}
  if(e.target.id==="aGoogle"){e.target.disabled=true;const{error}=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:here()}});if(error){e.target.disabled=false;drawAuth("signin",{err:1,text:friendly(error)})}}});
$("auth").addEventListener("submit",async e=>{e.preventDefault();const f=e.target,btn=f.querySelector("button[type=submit]");btn.disabled=true;
  const email=$("aEmail")?$("aEmail").value.trim():"",pass=$("aPass")?$("aPass").value:"";
  try{
    if(f.id==="fSignin"){const{error}=await sb.auth.signInWithPassword({email,password:pass});if(error)throw error}
    if(f.id==="fSignup"){const{data,error}=await sb.auth.signUp({email,password:pass,options:{emailRedirectTo:here(),data:{full_name:$("aName").value.trim()}}});if(error)throw error;
      if(!data.session)drawAuth("signin",{text:"Check your inbox and click the link to confirm your email. Then sign in here."})}
    if(f.id==="fForgot"){const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:here()});if(error)throw error;drawAuth("signin",{text:"Check your inbox for a link to reset your password."})}
    if(f.id==="fReset"){const{error}=await sb.auth.updateUser({password:pass});if(error)throw error;recovering=false;const{data}=await sb.auth.getSession();handleSession(data.session,true);toast("Password updated")}
  }catch(err){drawAuth(f.id==="fSignup"?"signup":f.id==="fForgot"?"forgot":f.id==="fReset"?"reset":"signin",{err:1,text:friendly(err)})}
  finally{btn.disabled=false}});
function handleSession(session,force){
  if(recovering)return;
  const u=session&&session.user;
  if(u){if(!force&&user&&user.id===u.id){user=u;return}
    user=u;isAdmin=false;showApp();renderMe();S.ready={p:false,t:false};render();loadAll(true);
    sb.rpc("is_admin").then(({data})=>{isAdmin=data===true;renderMe()});}
  else{user=null;S.projects=[];S.tasks=[];S.ready={p:false,t:false};closePop();if(S.openId){$("drawer").innerHTML="";S.openId=null;$("drawer").hidden=true;$("scrim").hidden=true}showAuth("signin")}
}
document.addEventListener("click",async e=>{if(e.target.id==="signOut"){await sb.auth.signOut();try{localStorage.removeItem("wb_sel")}catch(_){}}});
async function boot(){
  const cfg=window.WORKBOARD_CONFIG||{};
  if(!window.supabase||!cfg.supabaseUrl||/YOUR_/.test(cfg.supabaseUrl+cfg.supabaseAnonKey)){showAuth("setup");return}
  sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
  sb.auth.onAuthStateChange((ev,session)=>{if(ev==="PASSWORD_RECOVERY"){recovering=true;showAuth("reset");return}setTimeout(()=>handleSession(session),0)});
  const{data}=await sb.auth.getSession();handleSession(data.session);
}

/* derived */
const projById=id=>S.projects.find(p=>p.id===id);
const groupsOf=p=>(p&&Array.isArray(p.groups)&&p.groups.length)?p.groups:DEFAULT_GROUPS;
function taskGroup(x){const gs=groupsOf(projById(x.projectId));return gs.some(g=>g.id===x.group)?x.group:gs[0].id}
const isCross=()=>!projById(S.sel);
function scoped(){const t=todayStr(),wk=addDays(t,7);let ts=S.tasks.slice();
  if(S.sel==="today")ts=ts.filter(x=>x.status!=="done"&&x.due&&x.due<=t);
  else if(S.sel==="week")ts=ts.filter(x=>x.status!=="done"&&x.due&&x.due<=wk);
  else if(projById(S.sel))ts=ts.filter(x=>x.projectId===S.sel);
  return ts.filter(x=>projById(x.projectId));}
function filtered(){const q=$("q").value.trim().toLowerCase(),fp=$("fPri").value,fd=$("fDue").value,hd=$("hideDone").checked,t=todayStr(),wk=addDays(t,7);
  return scoped().filter(x=>{if(q&&!((x.title||"").toLowerCase().includes(q)||(x.notes||"").toLowerCase().includes(q)||(x.owner||"").toLowerCase().includes(q)))return false;
    if(fp&&x.priority!==fp)return false;if(fd==="late"&&!(x.due&&x.due<t&&x.status!=="done"))return false;
    if(fd==="week"&&!(x.due&&x.due>=t&&x.due<=wk))return false;if(fd==="none"&&x.due)return false;if(hd&&x.status==="done")return false;return true})}
const PRANK={urgent:0,high:1,med:2,low:3};
function sortTasks(ts){const k=S.sortKey,d=S.sortDir,sIdx=Object.fromEntries(STATUSES.map((s,i)=>[s[0],i]));
  return ts.sort((a,b)=>{let r=0;
    if(k==="status")r=sIdx[a.status||"todo"]-sIdx[b.status||"todo"];
    else if(k==="priority")r=(PRANK[a.priority]??9)-(PRANK[b.priority]??9);
    else if(k==="due")r=(a.due||"9")<(b.due||"9")?-1:(a.due||"9")>(b.due||"9")?1:0;
    else if(k==="owner")r=(a.owner||"~").localeCompare(b.owner||"~");
    else if(k==="timeline")r=(a.start||"9")<(b.start||"9")?-1:(a.start||"9")>(b.start||"9")?1:0;
    return r*d||(a.created||0)-(b.created||0)})}
const allOwners=()=>[...new Set(S.tasks.map(x=>(x.owner||"").trim()).filter(Boolean))].sort();

function renderStats(){const ts=scoped(),t=todayStr(),wk=addDays(t,7),open=ts.filter(x=>x.status!=="done");
  const late=open.filter(x=>x.due&&x.due<t).length,soon=open.filter(x=>x.due&&x.due>=t&&x.due<=wk).length,stuck=open.filter(x=>x.status==="stuck").length,done=ts.length-open.length;
  const dueToday=open.filter(x=>x.due===t).length,working=open.filter(x=>x.status==="doing").length;
  const pct=ts.length?Math.round(done/ts.length*100):0;
  const counts=STATUSES.map(([k,n,c])=>[n,c,ts.filter(x=>(x.status||"todo")===k).length]).filter(r=>r[2]);
  $("stats").innerHTML=`
  <div class="stat"><span class="lb"><i style="--c:var(--accent)"></i>Open tasks</span><b>${open.length}</b><span class="sub">${working} working on it</span></div>
  <div class="stat ${late?"warn":""}"><span class="lb"><i style="--c:var(--danger)"></i>Overdue</span><b>${late}</b><span class="sub">${late?"Past their due date":"All caught up"}</span></div>
  <div class="stat"><span class="lb"><i style="--c:#FDAB3D"></i>Due in 7 days</span><b>${soon}</b><span class="sub">${dueToday} due today</span></div>
  <div class="stat ${stuck?"hot":""}" style="--c:#DF2F4A"><span class="lb"><i style="--c:#DF2F4A"></i>Stuck</span><b>${stuck}</b><span class="sub">${stuck?"Needs a push":"Nothing blocked"}</span></div>
  <div class="stat prog"><div class="top2"><span class="lb"><i style="--c:#00C875"></i>Progress</span><span class="sub">${done} of ${ts.length} done</span></div><b>${pct}%</b>
    <div class="segbar">${counts.map(([n,c,v])=>`<i style="width:${v/ts.length*100}%;background:${c}" title="${n}: ${v}"></i>`).join("")}</div>
    <div class="legend">${counts.map(([n,c,v])=>`<span style="--c:${c}">${n} ${v}</span>`).join("")}</div></div>`;}

function renderView(){
  const v=$("view"),ae=document.activeElement;
  if(ae&&ae.classList&&ae.classList.contains("cellin")&&v.contains(ae)){S.pending=true;return}
  S.pending=false;
  const key=ae&&ae.dataset?ae.dataset.key:null,val=key?ae.value:null;
  if(!S.ready.p||!S.ready.t){v.innerHTML='<div class="empty">Loading your tasks…</div>';return}
  if(!S.projects.length){v.innerHTML='<div class="empty"><b>No projects yet</b>Name your first project in the sidebar to get started.</div>';return}
  S.view==="board"?renderBoard():renderTable();
  if(key){const el=v.querySelector(`[data-key="${key}"]`);if(el){el.value=val;el.focus()}}
}

function sections(){ // [{key,name,color,projectId,groupId,editable,tasks}]
  const ts=filtered();
  if(!isCross()){const p=projById(S.sel);return groupsOf(p).map(g=>({key:p.id+"|"+g.id,name:g.name,color:g.color,projectId:p.id,groupId:g.id,editable:true,tasks:ts.filter(x=>taskGroup(x)===g.id)}))}
  return S.projects.slice().sort((a,b)=>(a.created||0)-(b.created||0)).map(p=>({key:"x|"+p.id,name:p.name,color:p.color,projectId:p.id,groupId:groupsOf(p)[0].id,editable:false,tasks:ts.filter(x=>x.projectId===p.id)})).filter(s=>s.tasks.length||S.sel==="all");
}
function distBar(ts,list,field){if(!ts.length)return'<div class="dist"></div>';
  return `<div class="dist">${list.map(([k,n,c])=>{const cnt=ts.filter(x=>(x[field]||(field==="status"?"todo":""))===k).length;return cnt?`<i style="width:${cnt/ts.length*100}%;background:${c}" title="${n}: ${cnt} of ${ts.length}"></i>`:""}).join("")}</div>`}
function rangeOf(ts,a,b){const ds=[];ts.forEach(x=>{if(x[a])ds.push(x[a]);if(b&&x[b])ds.push(x[b])});if(!ds.length)return"";ds.sort();return fmtRange(ds[0],ds[ds.length-1])}
function rowHTML(x){
  const st=stInfo(x.status),pr=prInfo(x.priority),t=todayStr(),done=x.status==="done";
  const cl=x.checklist||[],late=x.due&&x.due<t&&!done;

  return `<tr data-row="${x.id}" class="${S.selected.has(x.id)?"sel":""}">

    <td class="${done?"done-name":""}"><div class="nmwrap"><input class="cellin" data-name="${x.id}" value="${esc(x.title)}" placeholder="Untitled" maxlength="200" aria-label="Task name">${cl.length?`<span class="subc">${cl.filter(c=>c.d).length}/${cl.length}</span>`:""}<button class="open" data-open="${x.id}" title="Open task" aria-label="Open task">${IC.bubble}</button></div></td>

    <td class="fillcell" style="${pr?cv(pr[2]):""}"><button class="cellbtn ${pr?"":"nopri"}" data-pop="priority" data-id="${x.id}">${pr?pr[1]:"&nbsp;"}</button></td>

      <thead><tr><th class="cc"><input type="checkbox" data-pickall="${esc(s.key)}" ${allSel?"checked":""} aria-label="Select all in group"></th><th>Task</th>

  $("view").innerHTML=html;

/* popover */
let popState=null;
function closePop(){$("pop").hidden=true;popState=null}
function openPop(kind,id,anchor){popState={kind,id,anchor};drawPop();const p=$("pop");p.hidden=false;placePop(anchor);
  const f=p.querySelector("input[type=text],input[type=date]");if(f&&kind!=="timeline")f.focus()}
function placePop(anchor){const p=$("pop"),r=anchor.getBoundingClientRect(),w=p.offsetWidth,h=p.offsetHeight;
  let left=Math.min(Math.max(8,r.left+r.width/2-w/2),innerWidth-w-8),top=r.bottom+6;if(top+h>innerHeight-8)top=Math.max(8,r.top-h-6);
  p.style.left=left+"px";p.style.top=top+"px"}
function drawPop(){const {kind,id}=popState,p=$("pop");
  if(kind==="group"){const pr=projById(S.sel),gs=groupsOf(pr),g=gs.find(x=>x.id===id);if(!g){closePop();return}
    const n=S.tasks.filter(x=>x.projectId===pr.id&&taskGroup(x)===id).length;
    p.innerHTML=`<label>Group color</label><div class="sw">${GCOLORS.map(c=>`<button class="${c===g.color?"cur":""}" style="--c:${c}" data-gcolor="${c}" aria-label="Color"></button>`).join("")}</div>
    ${gs.length>1?(popState.confirm?`<span style="font-size:13px">Delete group and its ${n} task${n===1?"":"s"}?</span><div class="row"><button class="btn danger" data-gdelyes="1">Delete</button><button class="btn ghost" data-gdelno="1">Keep</button></div>`:`<button class="lnk danger" data-gdel="1">Delete group</button>`):""}`;return}
  const x=S.tasks.find(t=>t.id===id);if(!x){closePop();return}
  if(kind==="status")p.innerHTML=STATUSES.map(([k,n,c])=>`<button class="opt ${x.status===k?"cur":""}" style="${cv(c)}" data-set="status" data-v="${k}">${n}</button>`).join("");
  else if(kind==="priority")p.innerHTML=PRIS.map(([k,n,c])=>`<button class="opt ${x.priority===k?"cur":""}" style="${cv(c)}" data-set="priority" data-v="${k}">${n}</button>`).join("")+`<button class="opt" style="--c:#848A9C" data-set="priority" data-v="">None</button>`;
  else if(kind==="due")p.innerHTML=`<label for="popDue">Due date</label><input type="date" id="popDue" value="${esc(x.due||"")}"><div class="row"><button class="lnk" data-duepick="${todayStr()}">Today</button><button class="lnk" data-duepick="${addDays(todayStr(),1)}">Tomorrow</button><button class="lnk" data-duepick="${addDays(todayStr(),7)}">Next week</button>${x.due?`<button class="lnk danger" data-duepick="">Clear</button>`:""}</div>`;
  else if(kind==="timeline")p.innerHTML=`<label for="popStart">Start</label><input type="date" id="popStart" value="${esc(x.start||"")}"><label for="popEnd">End</label><input type="date" id="popEnd" value="${esc(x.end||"")}">${x.start||x.end?`<button class="lnk danger" data-tlclear="1">Clear timeline</button>`:""}`;
  else if(kind==="owner"){const os=allOwners();p.innerHTML=`<form id="ownerForm"><input type="text" id="popOwner" placeholder="Type a name, press Enter" maxlength="40" aria-label="Owner name"></form>
    ${os.map(o=>`<button class="person" data-owner="${esc(o)}">${avatar(o)}<span>${esc(o)}</span></button>`).join("")}${x.owner?`<button class="lnk danger" data-owner="">Remove owner</button>`:""}`}
}

    <label for="f-owner">Owner</label><input id="f-owner" list="ownersList" value="${esc(x.owner||"")}" maxlength="40"><datalist id="ownersList">${allOwners().map(o=>`<option value="${esc(o)}">`).join("")}</datalist>
    <label for="f-due">Due date</label><input type="date" id="f-due" value="${esc(x.due||"")}">
    <label>Timeline</label><div class="two"><input type="date" id="f-start" value="${esc(x.start||"")}" aria-label="Start"><input type="date" id="f-end" value="${esc(x.end||"")}" aria-label="End"></div>
    <label for="f-proj">Project</label><select id="f-proj">${S.projects.map(p=>`<option value="${p.id}" ${x.projectId===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select>
    <label for="f-group">Group</label><select id="f-group">${gs.map(g=>`<option value="${esc(g.id)}" ${taskGroup(x)===g.id?"selected":""}>${esc(g.name)}</option>`).join("")}</select>
  </div>
  <h6>Checklist ${cl.length?`· ${cl.filter(c=>c.d).length}/${cl.length}`:""}</h6>
  <div class="cl">${cl.map((c,i)=>`<div class="cli ${c.d?"done":""}"><input type="checkbox" data-ci="${i}" ${c.d?"checked":""} aria-label="Toggle step"><span>${esc(c.t)}</span><button class="x" data-cx="${i}" aria-label="Remove step">×</button></div>`).join("")}</div>
  <form class="cladd" id="clAdd"><input id="f-cl" placeholder="Add a step" maxlength="160" aria-label="Add checklist step"><button class="btn" type="submit">Add</button></form>
  <h6>Notes</h6><textarea id="f-notes" placeholder="Links, context, next steps…">${esc(x.notes||"")}</textarea>
  <div class="confirm">${delConfirm?`<span>Delete this task for good?</span><button class="btn danger" id="dDelYes">Delete</button><button class="btn ghost" id="dDelNo">Keep</button>`:`<button class="btn ghost danger" id="dDel">Delete task</button>`}</div>`;
  if(active&&$(active))$(active).focus();
}
function openDrawer(id){closePop();S.openId=id;delConfirm=false;$("drawer").hidden=false;$("scrim").hidden=false;renderDrawer();setTimeout(()=>{const t=$("f-title");if(t&&!t.value)t.focus()},30)}
function closeDrawer(){const x=S.openId&&S.tasks.find(t=>t.id===S.openId),ti=$("f-title"),no=$("f-notes");
  if(x&&ti){clearTimeout(tmr.title);clearTimeout(tmr.notes);const tv=ti.value.trim(),nv=no?no.value:"";
    if(!tv&&!nv&&!(x.checklist||[]).length&&!x.owner&&!x.due)safe(del("tasks",x.id));
    else{const p={};if(tv!==(x.title||""))p.title=tv;if(nv!==(x.notes||""))p.notes=nv;if(Object.keys(p).length)setTask(x.id,p)}}
  $("drawer").innerHTML="";S.openId=null;$("drawer").hidden=true;$("scrim").hidden=true;render()}
function debounced(k,fn){clearTimeout(tmr[k]);tmr[k]=setTimeout(fn,500)}

/* actions */
async function createTask(title,o={}){
  let pid=o.projectId||(projById(S.sel)?S.sel:null);
  if(!pid){const ps=S.projects.slice().sort((a,b)=>(a.created||0)-(b.created||0));pid=ps[0]&&ps[0].id}
  if(!pid){toast("Add a project first");return null}
  const t={id:uid("t"),title,projectId:pid,group:o.group||groupsOf(projById(pid))[0].id,status:o.status||"todo",priority:"",due:S.sel==="today"?todayStr():"",owner:"",start:"",end:"",notes:"",checklist:[],created:Date.now()};
  await safe(put("tasks",t));return t.id}
function saveGroups(pid,gs){return safe(patch("projects",pid,{groups:gs}))}
function toast(m){const e=$("toast");e.textContent=m;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}

document.addEventListener("mousedown",e=>{if(!$("pop").hidden&&!e.target.closest("#pop")&&!e.target.closest("[data-pop]"))closePop()});
window.addEventListener("scroll",e=>{if(!$("pop").hidden&&!(e.target.closest&&e.target.closest("#pop")))closePop()},true);
window.addEventListener("resize",closePop);

document.addEventListener("click",async e=>{
  const T=e.target;
  if(T.closest("#renameBtn")){const i=$("ptitle");if(i){i.focus();i.select()}return}
  const sel=T.closest("[data-sel]");if(sel){S.sel=sel.dataset.sel;S.selected.clear();try{localStorage.setItem("wb_sel",S.sel)}catch(_){}$("projSettings").hidden=true;$("side").classList.add("collapsed");closePop();render();return}
  const pb=T.closest("[data-pop]");if(pb){if(popState&&popState.kind===pb.dataset.pop&&popState.id===pb.dataset.id){closePop();return}openPop(pb.dataset.pop,pb.dataset.id,pb);return}
  if(popState){const x=S.tasks.find(t=>t.id===popState.id);
    const so=T.closest("[data-set]");if(so&&x){setTask(x.id,{[so.dataset.set]:so.dataset.v});closePop();render();return}
    const dp=T.closest("[data-duepick]");if(dp&&x){setTask(x.id,{due:dp.dataset.duepick});closePop();render();return}
    if(T.closest("[data-tlclear]")&&x){setTask(x.id,{start:"",end:""});closePop();render();return}
    const ow=T.closest("[data-owner]");if(ow&&x){setTask(x.id,{owner:ow.dataset.owner});closePop();render();return}
    const gc=T.closest("[data-gcolor]");if(gc){const pr=projById(S.sel);saveGroups(pr.id,groupsOf(pr).map(g=>g.id===popState.id?{...g,color:gc.dataset.gcolor}:{...g}));render();drawPop();return}
    if(T.closest("[data-gdel]")){popState.confirm=true;drawPop();return}
    if(T.closest("[data-gdelno]")){popState.confirm=false;drawPop();return}
    if(T.closest("[data-gdelyes]")){const pr=projById(S.sel),gid=popState.id,ids=S.tasks.filter(x=>x.projectId===pr.id&&taskGroup(x)===gid).map(x=>x.id);closePop();
      await saveGroups(pr.id,groupsOf(pr).filter(g=>g.id!==gid).map(g=>({...g})));for(const id of ids)await safe(del("tasks",id));toast("Group deleted");render();return}
  }
  const cb=T.closest("[data-collapse]");if(cb){const k=cb.dataset.collapse;S.collapsed.has(k)?S.collapsed.delete(k):S.collapsed.add(k);saveCollapsed();render();return}
  const srt=T.closest("th[data-sort]");if(srt){const k=srt.dataset.sort;if(S.sortKey===k){if(S.sortDir>0)S.sortDir=-1;else{S.sortKey=null;S.sortDir=1}}else{S.sortKey=k;S.sortDir=1}render();return}
  const op=T.closest("[data-open]");if(op){openDrawer(op.dataset.open);return}
  const cd=T.closest("[data-card]");if(cd){openDrawer(cd.dataset.card);return}
  if(T.id==="addGroup"){const pr=projById(S.sel);const gs=groupsOf(pr).map(g=>({...g}));const used=new Set(gs.map(g=>g.color));const c=GCOLORS.find(c=>!used.has(c))||GCOLORS[gs.length%GCOLORS.length];const ng={id:uid("g"),name:"New group",color:c};
    await saveGroups(pr.id,[...gs,ng]);render();const inp=document.querySelector(`[data-gname="${ng.id}"]`);if(inp){inp.focus();inp.select()}return}
  const bs=T.closest("[data-bulkst]");if(bs){for(const id of S.selected)await setTask(id,{status:bs.dataset.bulkst});S.selected.clear();render();return}
  if(T.id==="bulkDel"){S.bulkDel=true;renderBulk();return}
  if(T.id==="bulkDelNo"){S.bulkDel=false;renderBulk();return}
  if(T.id==="bulkDelYes"){const ids=[...S.selected];S.selected.clear();S.bulkDel=false;for(const id of ids)await safe(del("tasks",id));toast(`${ids.length} deleted`);render();return}
  if(T.id==="bulkClear"){S.selected.clear();S.bulkDel=false;render();return}
  const x=S.openId&&S.tasks.find(t=>t.id===S.openId);
  if(x){const cx=T.closest("[data-cx]");if(cx){setTask(x.id,{checklist:(x.checklist||[]).filter((_,i)=>i!==+cx.dataset.cx)});renderDrawer();return}
    if(T.id==="dDel"){delConfirm=true;renderDrawer();return}
    if(T.id==="dDelNo"){delConfirm=false;renderDrawer();return}
    if(T.id==="dDelYes"){const id=x.id;$("drawer").innerHTML="";closeDrawer();safe(del("tasks",id));toast("Task deleted");return}}
  if(T.id==="dClose"||T.id==="scrim"){closeDrawer();return}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(popState){closePop();return}if(S.openId){closeDrawer();return}}
  if(e.target.id==="ptitle"){if(e.key==="Enter")e.target.blur();if(e.key==="Escape"){const pr=projById(S.sel);if(pr)e.target.value=pr.name;e.target.blur()}}
  if(e.target.classList&&e.target.classList.contains("cellin")){if(e.key==="Enter"){e.preventDefault();e.target.blur()}
    if(e.key==="Escape"){const x=S.tasks.find(t=>t.id===e.target.dataset.name);if(x)e.target.value=x.title||"";const pr=projById(e.target.dataset.projname);if(pr)e.target.value=pr.name;e.target.blur()}}
});
document.addEventListener("focusout",e=>{if(e.target.classList&&e.target.classList.contains("cellin")&&S.pending)setTimeout(()=>{if(!(document.activeElement&&document.activeElement.classList.contains("cellin")))render()},0)});
document.addEventListener("input",e=>{const x=S.openId&&S.tasks.find(t=>t.id===S.openId);
  if(x&&e.target.id==="f-title"){const v=e.target.value;debounced("title",()=>setTask(x.id,{title:v}))}
  if(x&&e.target.id==="f-notes"){const v=e.target.value;debounced("notes",()=>setTask(x.id,{notes:v}))}
  if(e.target.id==="q")render();
  if(e.target.dataset&&e.target.dataset.gname)e.target.size=Math.max(6,e.target.value.length+1);
});
document.addEventListener("change",e=>{const T=e.target;
  if(T.dataset.projname){const pr=projById(T.dataset.projname),v=T.value.trim();if(pr&&v&&v!==pr.name){if(mode==="db")pr.name=v;safe(patch("projects",pr.id,{name:v}));setTimeout(render,0)}else if(pr&&!v)T.value=pr.name;return}
  if(T.id==="ptitle"){const pr=projById(S.sel),v=T.value.trim();if(pr&&v&&v!==pr.name){if(mode==="db")pr.name=v;safe(patch("projects",pr.id,{name:v}));render()}else if(pr&&!v)T.value=pr.name;return}
  if(T.dataset.name){const v=T.value.trim(),x=S.tasks.find(t=>t.id===T.dataset.name);if(x&&v!==(x.title||""))setTask(x.id,{title:v});return}
  if(T.dataset.gname){const pr=projById(S.sel);const v=T.value.trim()||"Untitled group";saveGroups(pr.id,groupsOf(pr).map(g=>g.id===T.dataset.gname?{...g,name:v}:{...g}));return}
  if(T.dataset.pick){T.checked?S.selected.add(T.dataset.pick):S.selected.delete(T.dataset.pick);S.bulkDel=false;render();return}
  if(T.dataset.pickall){const s=sections().find(s=>s.key===T.dataset.pickall);if(s)s.tasks.forEach(x=>T.checked?S.selected.add(x.id):S.selected.delete(x.id));S.bulkDel=false;render();return}
  if(popState){const x=S.tasks.find(t=>t.id===popState.id);
    if(x&&T.id==="popDue"){setTask(x.id,{due:T.value});closePop();render();return}
    if(x&&(T.id==="popStart"||T.id==="popEnd")){const p={};p[T.id==="popStart"?"start":"end"]=T.value;
      const s=T.id==="popStart"?T.value:x.start,en=T.id==="popEnd"?T.value:x.end;
      if(T.id==="popStart"&&T.value&&(!en||en<T.value))p.end=T.value;if(T.id==="popEnd"&&T.value&&(!s||s>T.value))p.start=T.value;
      setTask(x.id,p);render();drawPop();return}}
  const x=S.openId&&S.tasks.find(t=>t.id===S.openId);
  if(x){const m={"f-status":"status","f-pri":"priority","f-due":"due","f-owner":"owner","f-start":"start","f-end":"end","f-group":"group"};
    if(m[T.id]){setTask(x.id,{[m[T.id]]:T.id==="f-owner"?T.value.trim():T.value});render();return}
    if(T.id==="f-proj"){setTask(x.id,{projectId:T.value,group:groupsOf(projById(T.value))[0].id});render();return}
    if(T.dataset.ci!==undefined){const cl=(x.checklist||[]).map(c=>({...c}));cl[+T.dataset.ci].d=T.checked;setTask(x.id,{checklist:cl});renderDrawer();return}}
  if(["fPri","fDue","hideDone"].includes(T.id))render();
});
document.addEventListener("submit",async e=>{e.preventDefault();const f=e.target;
  if(f.classList.contains("addf")){const i=f.querySelector("input"),v=i.value.trim();if(!v)return;i.value="";await createTask(v,{projectId:f.dataset.p,group:f.dataset.g});return}
  if(f.classList.contains("quick")){const i=f.querySelector("input"),v=i.value.trim();if(!v)return;i.value="";await createTask(v,{status:f.dataset.status});return}
  if(f.id==="ownerForm"&&popState){const v=$("popOwner").value.trim();if(v)setTask(popState.id,{owner:v});closePop();render();return}
  if(f.id==="addProj"){const v=$("newProjName").value.trim();if(!v)return;$("newProjName").value="";const p={id:uid("p"),name:v,color:GCOLORS[S.projects.length%GCOLORS.length],created:Date.now(),groups:DEFAULT_GROUPS.map(g=>({...g}))};await safe(put("projects",p));S.sel=p.id;render();return}
  if(f.id==="clAdd"){const x=S.tasks.find(t=>t.id===S.openId),v=$("f-cl").value.trim();if(!x||!v)return;$("f-cl").value="";await setTask(x.id,{checklist:[...(x.checklist||[]),{t:v,d:false}]});renderDrawer();$("f-cl")&&$("f-cl").focus();return}
  if(f.id==="projForm"){const p=projById(S.sel);if(!p)return;safe(patch("projects",p.id,{name:$("pName").value.trim()||p.name,color:$("pColor").dataset.v||p.color}));$("projSettings").hidden=true;return}
});
/* drag */
let dragId=null;
document.addEventListener("dragstart",e=>{const c=e.target.closest&&e.target.closest(".card");if(!c)return;dragId=c.dataset.card;c.classList.add("dragging");try{e.dataTransfer.setData("text/plain",dragId);e.dataTransfer.effectAllowed="move"}catch(_){}});
document.addEventListener("dragend",()=>{document.querySelectorAll(".dragging,.over").forEach(el=>el.classList.remove("dragging","over"));dragId=null});
document.addEventListener("dragover",e=>{const col=e.target.closest&&e.target.closest(".col");if(!col||!dragId)return;e.preventDefault();document.querySelectorAll(".col.over").forEach(c=>c!==col&&c.classList.remove("over"));col.classList.add("over")});
document.addEventListener("drop",e=>{const col=e.target.closest&&e.target.closest(".col");if(!col||!dragId)return;e.preventDefault();col.classList.remove("over");const x=S.tasks.find(t=>t.id===dragId);if(x&&x.status!==col.dataset.status){setTask(x.id,{status:col.dataset.status});render()}});

$("vTable").onclick=()=>{S.view="table";try{localStorage.setItem("wb_view","table")}catch(_){}render()};
$("vBoard").onclick=()=>{S.view="board";S.selected.clear();try{localStorage.setItem("wb_view","board")}catch(_){}render()};
$("newTask").onclick=async()=>{const id=await createTask("");if(id)openDrawer(id)};
$("menuBtn").onclick=()=>$("side").classList.toggle("collapsed");
let projDelConfirm=false;
function renderProjSettings(){const p=projById(S.sel);if(!p)return;const n=S.tasks.filter(x=>x.projectId===p.id).length;
  $("projSettings").innerHTML=`<form id="projForm" class="tools" style="border:1px solid var(--line);border-radius:10px;padding:12px">
    <input id="pName" value="${esc(p.name)}" maxlength="60" aria-label="Project name" style="border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 9px">
    <span id="pColor" data-v="${esc(p.color)}" class="sw">${GCOLORS.map(c=>`<button type="button" class="${c===p.color?"cur":""}" data-pcolor="${c}" style="--c:${c}" aria-label="Color"></button>`).join("")}</span>
    <button class="btn pri" type="submit">Save</button><span style="flex:1"></span>
    ${projDelConfirm?`<span style="font-size:13px">Delete project and its ${n} task${n===1?"":"s"}?</span><button type="button" class="btn danger" id="pDelYes">Delete</button><button type="button" class="btn ghost" id="pDelNo">Keep</button>`:`<button type="button" class="btn ghost danger" id="pDel">Delete project</button>`}</form>`}
$("projMenu").onclick=()=>{const ps=$("projSettings");projDelConfirm=false;ps.hidden=!ps.hidden;if(!ps.hidden)renderProjSettings()};
$("projSettings").addEventListener("click",async e=>{const c=e.target.closest("[data-pcolor]");
  if(c){$("pColor").dataset.v=c.dataset.pcolor;$("pColor").querySelectorAll("button").forEach(b=>b.classList.toggle("cur",b===c));return}
  if(e.target.id==="pDel"){const nm=$("pName").value;projDelConfirm=true;renderProjSettings();$("pName").value=nm;return}
  if(e.target.id==="pDelNo"){projDelConfirm=false;renderProjSettings();return}
  if(e.target.id==="pDelYes"){const p=projById(S.sel);if(!p)return;const ids=S.tasks.filter(x=>x.projectId===p.id).map(x=>x.id);$("projSettings").hidden=true;S.sel="all";for(const id of ids)await safe(del("tasks",id));await safe(del("projects",p.id));toast("Project deleted");render()}});

boot();
})();
</script>
</body>
</html>
