<style>
/* Crossway. Layout: premium consumer. Pill role bar, a big headline, then a grid of large match cards. Detail opens as a full sheet. Candidate side is a host style profile: sticky identity card on the left, airy sections on the right */
:root{
  --bg:#FFFFFF;--surface:#F7F7F7;--ink:#222222;--ink2:#484848;--muted:#717171;--faint:#B0B0B0;--line:#EBEBEB;
  --btn:#222222;--btn-ink:#FFFFFF;--accent:#3B5BDB;--good:#0B8A6F;--good-soft:#E7F6F1;--wait:#B26B00;--wait-soft:#FFF4E0;
  --b:#3B5BDB;--o:#F2643D;--t:#12A38A;
  --f:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sh:0 6px 20px rgba(0,0,0,.08);--sh2:0 2px 6px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111214;--surface:#1B1C20;--ink:#F2F2F3;--ink2:#CFCFD4;--muted:#9A9BA3;--faint:#5C5D66;--line:#2A2B31;
  --btn:#F2F2F3;--btn-ink:#111214;--accent:#7B93F2;--good:#3CC9A8;--good-soft:#13302A;--wait:#F0AE4A;--wait-soft:#33281A;
  --sh:0 8px 28px rgba(0,0,0,.45);--sh2:0 2px 8px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111214;--surface:#1B1C20;--ink:#F2F2F3;--ink2:#CFCFD4;--muted:#9A9BA3;--faint:#5C5D66;--line:#2A2B31;
  --btn:#F2F2F3;--btn-ink:#111214;--accent:#7B93F2;--good:#3CC9A8;--good-soft:#13302A;--wait:#F0AE4A;--wait-soft:#33281A;
  --sh:0 8px 28px rgba(0,0,0,.45);--sh2:0 2px 8px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:8px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{max-width:1280px;margin:0 auto;padding-block:14px;padding-inline:24px;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:19px;letter-spacing:-.035em}
.bars{display:inline-flex;flex-direction:column;gap:3px}
.bars i{display:block;height:4.5px;border-radius:3px}
.prod{display:flex;gap:4px}
.prod a,.prod span{padding:8px 14px;border-radius:99px;font-weight:500;font-size:14px;text-decoration:none;color:var(--muted)}
.prod a:hover{color:var(--ink);background:var(--surface)}
.prod span{color:var(--ink)}
.sp{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:99px;padding:4px;box-shadow:var(--sh2)}
.seg button{padding:7px 16px;border-radius:99px;font-weight:500;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--btn);color:var(--btn-ink)}

/* buttons + bits */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 22px;font-weight:600;font-size:14px;white-space:nowrap;transition:transform .1s,background .15s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn.dark{background:var(--btn);color:var(--btn-ink)}
.btn.dark:hover{opacity:.88}
.btn.brand{background:linear-gradient(90deg,var(--b),#5B6FE6);color:#fff}
.btn.brand:hover{opacity:.92}
.btn.line{border:1px solid var(--ink);color:var(--ink)}
.btn.line:hover{background:var(--surface)}
.btn.ghost{color:var(--ink);text-decoration:underline;text-underline-offset:3px;padding:12px 10px}
.btn:disabled{opacity:.35;cursor:default;transform:none}
.ulink{font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.ulink:hover{color:var(--muted)}
.xbtn{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;color:var(--ink)}
.xbtn:hover{background:var(--surface)}
.pillx{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.s-invited{background:var(--wait-soft);color:var(--wait)}
.s-accepted,.s-interviewing,.s-offer,.s-hired{background:var(--good-soft);color:var(--good)}
.s-declined{background:var(--surface);color:var(--muted)}
.tagl{display:inline-flex;align-items:center;padding:7px 14px;border-radius:99px;border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--ink2);white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tagl.hit{border-color:var(--ink);color:var(--ink)}
.tagl.pick{cursor:pointer;transition:border-color .15s,background .15s}
.tagl.pick:hover{border-color:var(--ink)}
.tagl.on{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.tagl.on2{background:var(--good-soft);color:var(--good);border-color:transparent}
.ava{border-radius:50%;display:grid;place-items:center;font-weight:600;color:#2A2440;letter-spacing:-.02em;flex:none}
.sw{display:inline-flex;align-items:center;gap:12px;cursor:pointer;user-select:none;font-size:14px}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw .tr{width:44px;height:26px;border-radius:99px;background:var(--faint);position:relative;transition:.2s;flex:none}
.sw .tr::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.sw input:checked+.tr{background:var(--ink)}
.sw input:checked+.tr::after{left:21px}
.sw input:focus-visible+.tr{outline:2px solid var(--ink);outline-offset:3px}

/* recruiter */
.page{max-width:1280px;margin:0 auto;padding-block:20px 80px;padding-inline:24px}
.rolebar{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 18px;scrollbar-width:none}
.rolebar::-webkit-scrollbar{display:none}
.rp{flex:none;text-align:left;padding:10px 18px;border-radius:16px;border:1px solid var(--line);display:flex;flex-direction:column;transition:border-color .15s,box-shadow .15s}
.rp:hover{border-color:var(--faint)}
.rp b{font-weight:600;font-size:14px}
.rp span{font-size:12.5px;color:var(--muted)}
.rp.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.rp.add{border-style:dashed;justify-content:center;flex-direction:row;align-items:center;gap:8px;font-weight:600}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;padding:22px 0 8px}
.hero h1{font-size:38px;font-weight:600;letter-spacing:-.035em;line-height:1.12;text-wrap:balance;max-width:20ch}
.hero .sub{margin-top:10px;color:var(--muted);font-size:15px;display:flex;flex-wrap:wrap;gap:4px 0}
.hero .sub span+span::before{content:"·";margin:0 10px}
.mini{display:flex;border-radius:99px;background:var(--surface);padding:4px}
.mini button{padding:8px 18px;border-radius:99px;font-weight:500;font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center}
.mini button.on{background:var(--bg);color:var(--ink);box-shadow:var(--sh2)}
.mini .n{font-size:12px;color:var(--muted)}
.needs{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-size:13.5px;color:var(--ink2)}
.needs b{font-weight:600;color:var(--ink)}
.blind{display:flex;align-items:center;gap:10px;margin:22px 0 4px;padding:14px 18px;border-radius:16px;background:var(--surface);font-size:13.5px;color:var(--ink2)}
.blind svg{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:36px 24px;margin-top:28px}
.mc{text-align:left;display:flex;flex-direction:column;gap:12px;cursor:pointer}
.mc .cv{position:relative;aspect-ratio:5/4;max-width:100%;border-radius:20px;display:grid;place-items:center;overflow:hidden;transition:transform .25s ease,box-shadow .25s}
.mc:hover .cv{transform:translateY(-3px);box-shadow:var(--sh)}
.mc .cv .ini{font-size:64px;font-weight:600;letter-spacing:-.05em;color:rgba(30,25,60,.82)}
.mc .cv .score{position:absolute;top:14px;left:14px;background:#fff;color:#222;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.12);font-variant-numeric:tabular-nums}
.mc .cv .score small{font-weight:500;color:#717171;margin-left:3px}
.mc .cv .rk{position:absolute;top:14px;right:16px;font-size:13px;font-weight:600;color:rgba(30,25,60,.55)}
.mc .cv .pillx{position:absolute;bottom:14px;left:14px}
.mc .cv .s-invited{background:#FFF4E0;color:#9A5C00}
.mc .cv .s-accepted,.mc .cv .s-interviewing,.mc .cv .s-offer,.mc .cv .s-hired{background:#E7F6F1;color:#08745D}
.mc .t1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.mc .t1 b{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc .t1 span{font-size:13px;color:var(--good);font-weight:600;white-space:nowrap}
.mc .t1 span.meh{color:var(--wait)}
.mc p{color:var(--muted);font-size:14px;line-height:1.45}
.mc .t3{font-size:14px;color:var(--ink2)}
.mc.new .cv{animation:glow 1.2s ease}
@keyframes glow{0%{box-shadow:0 0 0 6px var(--good-soft)}100%{box-shadow:none}}
.pipe{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:20px;overflow-x:auto;padding:28px 2px 8px}
.pc{display:flex;flex-direction:column;gap:12px}
.pch{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:15px;padding-bottom:4px}
.pch span{color:var(--muted);font-weight:500;font-size:13px}
.kc{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:18px;background:var(--bg);box-shadow:var(--sh);cursor:pointer;text-align:left}
.kc .kt{display:flex;gap:12px;align-items:center}
.kc b{font-weight:600;font-size:14px;display:block}
.kc .m{font-size:12.5px;color:var(--muted)}
.kc .ulink{font-size:13px;align-self:flex-start}
.kempty{border:1.5px dashed var(--line);border-radius:18px;padding:22px;text-align:center;color:var(--faint);font-size:13px}
.sync{display:flex;align-items:center;gap:12px;margin-top:28px;color:var(--muted);font-size:13.5px}
.empty{grid-column:1/-1;padding:60px 20px;text-align:center;color:var(--muted)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:50;padding:24px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.sheet{background:var(--bg);border-radius:24px;width:min(860px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:rise .3s ease;overflow:hidden}
.sheet.sm{width:min(560px,100%)}
.shh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.shh h2{font-size:16px;font-weight:600}
.shb{overflow:auto;padding:28px 32px;display:flex;flex-direction:column;gap:28px}
.shf{padding:16px 24px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;justify-content:flex-end}
.shf .note{margin-right:auto;color:var(--muted);font-size:13px}
.dtop{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.dtop h2{font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1.15}
.dtop p{color:var(--muted);font-size:15px;margin-top:4px}
.dcols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px}
.dsec{display:flex;flex-direction:column;gap:14px}
.dsec+.dsec{padding-top:28px;border-top:1px solid var(--line)}
.dsec h3{font-size:19px;font-weight:600;letter-spacing:-.02em}
.scorecard{position:sticky;top:0;border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--sh);align-self:start}
.scorecard .big{font-size:44px;font-weight:600;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.scorecard .big small{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:6px}
.bk{display:flex;flex-direction:column;gap:10px}
.bk div{display:grid;grid-template-columns:96px 1fr 40px;gap:12px;align-items:center;font-size:13px;color:var(--ink2)}
.bk div span:last-child{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:4px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px}
.whys{list-style:none;padding:0;display:flex;flex-direction:column;gap:14px}
.whys li{display:flex;gap:14px;align-items:flex-start;font-size:15px;color:var(--ink2)}
.whys li svg{margin-top:2px;color:var(--ink)}
.whys li.meh svg{color:var(--wait)}
.facts{display:flex;flex-direction:column;gap:16px}
.fact{display:flex;gap:16px;align-items:flex-start}
.fact svg{width:24px;height:24px;margin-top:2px}
.fact b{display:block;font-weight:600;font-size:15px}
.fact span{color:var(--muted);font-size:14px}
.xp{display:flex;flex-direction:column;gap:18px}
.xpi{display:flex;gap:16px;align-items:center}
.logo{width:48px;height:48px;border-radius:12px;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--ink2);flex:none}
.xpi b{display:block;font-weight:600;font-size:15px}
.xpi span{color:var(--muted);font-size:14px}
.f{display:flex;flex-direction:column;gap:8px;min-width:0}
.f.full{grid-column:1/-1}
.f label,.lbl{font-size:14px;font-weight:600}
.hint{font-size:13px;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--faint);background:var(--bg);border-radius:12px;padding:13px 14px;min-width:0;width:100%;font-size:15px;transition:border-color .15s,box-shadow .15s}
.f textarea{resize:vertical;min-height:110px;line-height:1.6}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.time{border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;transition:border-color .15s}
.time:hover{border-color:var(--ink)}
.time b{font-weight:600;font-size:14px}
.time span{color:var(--muted);font-size:13px}
.time.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.xrow{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.xrow .grow{flex:1;min-width:0}

/* candidate */
.cpage{max-width:1120px;margin:0 auto;padding-block:40px 80px;padding-inline:24px}
.hello h1{font-size:38px;font-weight:600;letter-spacing:-.035em;line-height:1.12}
.hello p{color:var(--muted);font-size:16px;margin-top:8px}
.invite{margin-top:28px;border-radius:28px;padding:32px;background:linear-gradient(135deg,#EEF1FF 0%,#F4EEFF 45%,#E8F7F2 100%);color:#222;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;position:relative;overflow:hidden}
.invite::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:#F2643D;opacity:.10;filter:blur(20px)}
.invite .from{display:flex;gap:14px;align-items:center}
.invite .logo{background:#fff;color:#222;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.invite h2{font-size:26px;font-weight:600;letter-spacing:-.03em;line-height:1.2;margin-top:18px;text-wrap:balance}
.invite .meta{color:#5A5A66;font-size:14px;margin-top:6px}
.invite blockquote{margin:18px 0 0;font-size:15px;line-height:1.6;color:#3A3A44}
.invite .times .time{background:rgba(255,255,255,.7);border-color:rgba(0,0,0,.08);color:#222}
.invite .times .time span{color:#6A6A74}
.invite .times .time.on{background:#fff;border-color:#222;box-shadow:0 0 0 1px #222}
.invite .times{grid-template-columns:1fr}
.invite .acts{display:flex;gap:12px;margin-top:16px;align-items:center}
.invite .acts .dark{background:#222;color:#fff}
.invite .acts .ghost{color:#222}
.invite .lbl{color:#222}
.invite.done{grid-template-columns:1fr;padding:24px 28px}
.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:64px;margin-top:44px;align-items:start}
.idcard{position:sticky;top:96px;border-radius:24px;box-shadow:var(--sh);padding:28px;display:flex;flex-direction:column;gap:20px;border:1px solid var(--line)}
.idtop{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.idtop h2{font-size:26px;font-weight:600;letter-spacing:-.03em;margin-top:10px}
.idtop p{color:var(--muted);font-size:14px}
.idstats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.idstats div{padding:14px 4px;text-align:center}
.idstats div+div{border-left:1px solid var(--line)}
.idstats b{display:block;font-size:20px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.idstats span{font-size:12px;color:var(--muted)}
.strength{display:flex;flex-direction:column;gap:8px;font-size:13px}
.strength .row1{display:flex;justify-content:space-between}
.strength .bar{height:6px}
.strength .bar i{background:linear-gradient(90deg,var(--b),var(--t))}
.idacts{display:flex;flex-direction:column;gap:10px}
.pv{border-radius:16px;padding:14px 16px;background:var(--wait-soft);color:var(--wait);font-size:13.5px;font-weight:500}
.sections{display:flex;flex-direction:column}
.sect{padding:36px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:18px}
.sect:first-child{padding-top:0}
.sect:last-child{border-bottom:0}
.secth{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.secth h2{font-size:24px;font-weight:600;letter-spacing:-.03em}
.about{font-size:16px;line-height:1.7;color:var(--ink2);max-width:62ch}
.lfgrid{display:grid;grid-template-columns:1fr 1fr;gap:22px 28px}
.sample{display:flex;gap:16px;align-items:center;padding:18px;border-radius:18px;border:1px solid var(--line)}
.sample .logo{background:var(--good-soft);color:var(--good)}
.sample b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stand{display:flex;flex-direction:column}

.arexp{border-left:3px solid var(--accent);padding:4px 0 4px 14px}
.arexp b{font-size:13px;color:var(--muted);font-weight:600}.arexp p{font-size:15px;line-height:1.6;margin-top:2px}
.artr{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:16px;background:var(--surface)}
.artr.none{flex-direction:row;align-items:center;gap:8px;font-size:13px;color:var(--muted)}.artr.none svg.i{width:16px;height:16px}
.artr.warn{background:var(--wait-soft)}
.artr p{font-size:13px;color:var(--wait);font-weight:500}
.artrc{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink2)}
.artrc b{color:var(--ink);font-weight:700}
.artrc .good b{color:var(--good)}.artrc .bad b{color:#D6334D}
.artrc .aic{display:inline-flex;align-items:center;gap:4px;color:#7A4DD8;font-weight:600}.artrc .aic svg.i{width:14px;height:14px}
.artr .btn svg.i{width:14px;height:14px;fill:currentColor;stroke:none}
.arpaste{font-size:11.5px;font-weight:600;color:var(--wait);background:var(--wait-soft);padding:3px 9px;border-radius:99px;white-space:nowrap}
.rpw{display:flex;flex-direction:column;gap:14px}
.rph{display:flex;flex-direction:column;gap:2px}.rph b{font-size:18px}.rph span{font-size:12.5px;color:var(--muted)}
.rpbox{position:relative;background:#15161A;border:1px solid #23252B;border-radius:16px;overflow:hidden}
#rpCode{margin:0;padding:18px;height:min(54vh,460px);overflow:auto;color:#E8E9EE;font:13px/1.7 ui-monospace,"SF Mono",Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
#rpCode mark{background:#34407A;color:#fff;border-radius:3px}
#rpCode mark.ps{background:#8A4B12;box-shadow:0 0 0 2px #F0AE4A}
.rpflash{position:absolute;top:12px;right:12px;padding:6px 12px;border-radius:99px;background:#F0AE4A;color:#1B1C20;font-size:12.5px;font-weight:700;opacity:0;pointer-events:none}
.rpflash.on{animation:rpf 1.6s ease}
@keyframes rpf{0%{opacity:0;transform:translateY(-6px)}12%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
.rpctl{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rpbtn{width:42px;height:42px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.rpbtn svg.i{width:18px;height:18px;fill:currentColor;stroke:currentColor}
.rptrack{position:relative;flex:1;min-width:160px}
.rptrack input{width:100%;accent-color:var(--accent)}
.rpmarks{position:absolute;left:8px;right:8px;top:-4px;height:6px;pointer-events:none}
.rpmarks i{position:absolute;top:0;width:3px;height:8px;border-radius:2px;background:#F0AE4A;transform:translateX(-1px)}
.rptime{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.rpsp button{padding:5px 11px}
/* calmer stats and difficulty */
.rec2{display:flex;flex-direction:column;border-top:1px solid var(--line);margin-top:4px}
.rec2 div{display:flex;justify-content:space-between;align-items:baseline;padding:11px 2px;border-bottom:1px solid var(--line)}
.rec2 span{font-size:13.5px;color:var(--muted)}
.rec2 b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
html body .ard-easy,html body .ard-medium,html body .ard-hard{color:var(--ink2);background:transparent}
.ardf{display:inline-flex;align-items:center;border:1px solid var(--line);font-weight:500;letter-spacing:.01em}
.ardf::before{content:"";width:11px;height:10px;margin-right:6px;flex:none;background:
  linear-gradient(var(--b1),var(--b1)) 0 100%/3px 4px no-repeat,linear-gradient(var(--b2),var(--b2)) 4px 100%/3px 7px no-repeat,linear-gradient(var(--b3),var(--b3)) 8px 100%/3px 10px no-repeat}
.ard-easy{--b1:var(--accent);--b2:var(--line);--b3:var(--line)}
.ard-medium{--b1:var(--accent);--b2:var(--accent);--b3:var(--line)}
.ard-hard{--b1:var(--accent);--b2:var(--accent);--b3:var(--accent)}
.ard-ch{--b1:var(--accent);--b2:var(--accent);--b3:var(--accent)}
html body .arbar{color:var(--ink)}
.arbar .l{font-weight:500;color:var(--ink2)}
.arbar .t i{background:var(--accent)!important}
.arbar.ard-easy .t i{opacity:.45}.arbar.ard-medium .t i{opacity:.72}
html body .arxbar .ard-easy{background:color-mix(in srgb,var(--accent) 40%,transparent)}
html body .arxbar .ard-medium{background:color-mix(in srgb,var(--accent) 70%,transparent)}
html body .arxbar .ard-hard{background:var(--accent)}
.arxleg .ard-easy em{background:color-mix(in srgb,var(--accent) 40%,transparent)}
.arxleg .ard-medium em{background:color-mix(in srgb,var(--accent) 70%,transparent)}
.arxleg .ard-hard em{background:var(--accent)}
.arxleg>div{color:var(--muted)}
/* ===== Arena home v3 ===== */
.ax{max-width:1180px}
.axh{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin:8px 0 26px}

.axstats{display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:12px 20px;border:1px solid var(--line);border-radius:20px;background:var(--bg)}
.axstats>div{display:flex;flex-direction:column;line-height:1.2}
.axstats b{font-size:20px;font-weight:700;letter-spacing:-.02em}.axstats b small{font-size:13px;color:var(--muted);font-weight:500}
.axstats span{font-size:12px;color:var(--muted)}
.axs1{flex-direction:row!important;align-items:center;gap:12px}
.axmini{width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;position:relative}

.axlv{flex-direction:column!important;gap:3px;padding-left:18px;border-left:1px solid var(--line)}
.axlv span{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2)!important;background:none!important}

.axlv .ard-easy i{opacity:.4}.axlv .ard-medium i{opacity:.7}
.axf{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:22px}
.axft{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:16px;border:1px solid var(--line);border-radius:18px;background:var(--bg);text-align:left;transition:border-color .15s,box-shadow .15s,transform .15s}
.axft:hover{box-shadow:var(--sh2);transform:translateY(-1px)}
.axft.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.axfi{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--surface);margin-bottom:8px}
.axfi svg.i{width:19px;height:19px}
.axft.on .axfi{background:rgba(255,255,255,.12)}

.axfn{font-size:12px;color:var(--muted)}.axft.on .axfn{color:inherit;opacity:.65}
.axfb{width:100%;height:4px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:8px}
.axfb i{display:block;height:100%;background:var(--accent);border-radius:9px}
.axft.on .axfb{background:rgba(255,255,255,.18)}.axft.on .axfb i{background:#fff}
.axpick{position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;justify-content:space-between;gap:24px;width:100%;text-align:left;padding:30px 32px;border-radius:24px;background:#17171B;color:#fff;margin-bottom:26px;transition:transform .2s,box-shadow .2s}

.axglow{position:absolute;z-index:-1;inset:auto -10% -60% 40%;height:160%;background:radial-gradient(closest-side,rgba(76,107,245,.55),transparent),radial-gradient(closest-side at 80% 30%,rgba(242,100,61,.35),transparent);filter:blur(10px)}
.axpl{max-width:720px}

.axpick p{font-size:15px;color:#C4C5CE;margin-top:8px;line-height:1.55}
.axpm{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.axpm span{font-size:12.5px;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.1);color:#E8E9EE}
.axgo{flex:none;display:inline-flex;align-items:center;gap:8px;background:#fff;color:#17171B;font-weight:600;padding:13px 22px;border-radius:999px;font-size:15px}
.axgo svg.i{width:15px;height:15px;fill:currentColor;stroke:none}
.axbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.axtypes,.axlvl{display:flex;gap:6px;flex-wrap:wrap}
.axtypes button,.axlvl button{font-size:13.5px;padding:8px 15px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);background:var(--bg);transition:background .15s}
.axtypes button:hover,.axlvl button:hover{background:var(--surface)}
.axtypes button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.axlvl{padding:4px;border-radius:999px;background:var(--surface);gap:2px}
.axlvl button{border:0;background:none;padding:6px 13px}
.axlvl button.on{background:var(--bg);color:var(--ink);font-weight:600;box-shadow:var(--sh2)}
.axgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.axc{display:flex;flex-direction:column;gap:8px;text-align:left;padding:20px;border:1px solid var(--line);border-radius:20px;background:var(--bg);transition:box-shadow .2s,transform .2s,border-color .2s;min-height:200px}
.axc:hover{box-shadow:var(--sh);transform:translateY(-2px);border-color:transparent}
.axct{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.axic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent)}
.axic svg.i{width:19px;height:19px}
.axic.ai{background:color-mix(in srgb,#7A4DD8 12%,transparent);color:#7A4DD8}
.axc b{font-size:16.5px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.axc p{font-size:13.5px;color:var(--muted);line-height:1.5;flex:1}
.axcf{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:4px}
.axdot{width:3px;height:3px;border-radius:50%;background:var(--faint)}
.axai{display:inline-flex;align-items:center;gap:4px;color:#7A4DD8;font-weight:600}.axai svg.i{width:13px;height:13px}
.axst{margin-left:auto;display:flex;gap:8px}
.axst em{font-style:normal;display:inline-flex;align-items:center;gap:4px;font-weight:600}
.axst svg.i{width:14px;height:14px;stroke-width:2.2}
.axst .ok{color:var(--good)}.axst .tm{color:var(--accent)}.axst .go{color:var(--wait)}
.axc.done{background:linear-gradient(180deg,color-mix(in srgb,var(--good) 5%,var(--bg)),var(--bg) 40%)}
.axnote{font-size:12.5px;color:var(--muted);margin-top:22px}
@media (max-width:1100px){.axf{grid-template-columns:repeat(3,1fr)}.axgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.axh h1{font-size:34px}.axstats{width:100%;gap:16px;padding:12px 14px}.axlv{display:none!important}
 .axf{display:flex;overflow-x:auto;margin-inline:-16px;padding:0 16px 4px;scrollbar-width:none}.axft{flex:0 0 142px}
 .axpick{flex-direction:column;align-items:flex-start;padding:24px}.axpick h2{font-size:22px}
 .axgrid{grid-template-columns:1fr}.axtypes{flex-wrap:nowrap;overflow-x:auto;margin-inline:-16px;padding:0 16px;scrollbar-width:none}.axtypes button{flex:none}}
.axs1>div:last-child{display:flex;flex-direction:column;line-height:1.2}
.ardf.ard-easy,.ardf.ard-medium,.ardf.ard-hard{color:var(--ink2)!important;background:transparent!important}
/* Arena v4: ticket queue, daily look */
.aq .aqhd h1{font-size:40px;font-weight:700;letter-spacing:-.035em}
.aqtop{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;margin:8px 0 16px}
.aqday{position:relative;overflow:hidden;isolation:isolate;border-radius:28px;background:linear-gradient(135deg,#17171B 0%,#1E2238 60%,#262C52 100%);color:#fff;padding:32px 36px;display:flex;flex-direction:column;min-height:340px}
.aqglow{position:absolute;z-index:-1;right:-90px;top:-80px;width:400px;height:400px;border-radius:50%;background:radial-gradient(closest-side,rgba(76,107,245,.55),transparent);animation:aqg 9s ease-in-out infinite alternate}
@keyframes aqg{to{transform:translate(-40px,30px) scale(1.1)}}
.aqk{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#9DB0FF}
.aqday h1{font-size:40px;font-weight:700;letter-spacing:-.035em;line-height:1.08;margin-top:12px;max-width:640px;color:#fff}
.aqday p{color:#C4C5CE;font-size:15.5px;line-height:1.55;margin-top:12px;max-width:580px}
.aqchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.aqchips span{font-size:12.5px;color:#D8D9E0;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);padding:5px 11px;border-radius:999px}
.aqchips code{font:600 11.5px ui-monospace,Menlo,monospace;color:#fff}
.aqfoot{margin-top:auto;padding-top:24px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.aqcd{display:flex;gap:8px}.aqcd div{background:rgba(255,255,255,.08);border-radius:14px;padding:9px 13px;text-align:center;min-width:62px}

.aqstart{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#17171B;font-weight:600;font-size:15.5px;padding:14px 26px;border-radius:999px;transition:transform .15s,box-shadow .15s}
.aqstart:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(76,107,245,.35)}.aqstart svg{width:16px;height:16px}
.aqme{border:1px solid var(--line);border-radius:24px;padding:24px;background:var(--bg);display:flex;flex-direction:column}
.aqme h3{font-size:17px;font-weight:700;color:var(--ink)}.aqme>small{font-size:12.5px;color:var(--muted);margin-top:2px}
.aqring{display:flex;align-items:center;gap:14px;margin-top:20px}
.axmini.big{width:64px;height:64px}.axmini.big::before{inset:7px}.axmini.big span{font-size:13px}
.aqring b{font-size:26px;font-weight:700;letter-spacing:-.02em;color:var(--ink);display:block}.aqring b small{font-size:14px;color:var(--muted);font-weight:500}.aqring span{font-size:13px;color:var(--muted)}
.aqnums{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.aqnums div{background:var(--surface);border-radius:14px;padding:12px 14px}.aqnums b{font-size:20px;font-weight:700;color:var(--ink);display:block}.aqnums span{font-size:12px;color:var(--muted)}
.aqlv{margin-top:auto;padding-top:18px;display:flex;flex-direction:column;gap:9px}

.aqlv i{height:6px;border-radius:9px;background:var(--surface);overflow:hidden;display:block}.aqlv em{display:block;height:100%;background:var(--ink);border-radius:9px}
.aqlv b{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.aqweek{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-bottom:40px}
.aqd{border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;background:var(--bg)}
.aqd span{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.aqd b{font-size:22px;font-weight:700;color:var(--ink)}.aqd em{font-style:normal;font-size:12px;font-weight:600;display:flex;align-items:center;gap:4px;color:var(--faint)}

.aqd.dn{background:color-mix(in srgb,var(--good) 8%,var(--bg));border-color:color-mix(in srgb,var(--good) 25%,var(--bg))}.aqd.dn em{color:var(--good)}
.aqd.td{border:2px solid var(--ink)}.aqd.td em{color:var(--accent)}
.aqqh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.aqqh h2{font-size:28px;font-weight:700;letter-spacing:-.03em;color:var(--ink)}.aqqh p{font-size:14px;color:var(--muted);margin-top:4px}
.aqfields{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--surface);flex-wrap:wrap}

.aqbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.aqq{display:grid;grid-template-columns:400px minmax(0,1fr);border:1px solid var(--line);border-radius:24px;overflow:hidden;background:var(--bg);min-height:520px}

.aqmeta div{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:11px 14px}.aqmeta span{font-size:11.5px;color:var(--muted);display:block}.aqmeta b{font-size:14.5px;color:var(--ink)}
.aqcta{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.aqgo{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);padding:13px 24px;border-radius:999px;font-weight:600;font-size:15px;transition:transform .15s}.aqgo:hover{transform:translateY(-1px)}.aqgo svg{width:15px;height:15px}

  {const a=toUSD(c.pay,c.cur),b=toUSD(j.pay[1],j.cur);if(c.pay&&(c.cur||"USD")===(j.cur||"USD")?c.pay>j.pay[1]:(a!=null&&b!=null&&c.pay&&a>b*1.02))fails.push("Pay above band")}

    {t:`${yrs(c.yrs)} of experience, role asks for ${a} to ${b}`,ok:exIn},

}

  /* spread opportunity: people already holding 3+ open invites elsewhere slide a few spots down, so more strong people get seen */
  const adj=r=>r.s-(invOf(j.id,r.c.id)?0:demandPenalty(r.c));
  const pass=all.filter(r=>!r.fails.length&&(r.c.open||invOf(j.id,r.c.id))).sort((x,y)=>adj(y)-adj(x)||y.s-x.s||x.c.code.localeCompare(y.c.code));
  const live=pass.filter(r=>!passed.has(r.c.id)&&(invOf(j.id,r.c.id)||{}).status!=="declined");
  return{all,pass,top:live.slice(0,10)};
}

    <div class="f"><label for="eY">Years of experience</label><input id="eY" type="number" min="0" max="45" data-d="yrs" value="${calcYears(D.exp)??D.yrs}" ${calcYears(D.exp)!=null?"disabled":""}>${calcYears(D.exp)!=null?`<span class="hint">Worked out from your experience dates.</span>`:""}</div>
    <div class="f full"><label for="eH">Headline</label><input id="eH" data-d="headline" maxlength="90" value="${esc(D.headline)}" placeholder="Product analyst moving into PM"></div>
    <div class="f full"><label for="eA">About</label><textarea id="eA" data-d="about" maxlength="600" placeholder="What you do best, in two or three sentences">${esc(D.about||"")}</textarea><span class="hint">Leave your name out of this so matching stays blind.</span></div></div>
    ${photoBlock()}`;
  if(k==="prefs")return `<div class="f"><span class="lbl">Roles you want</span>${chipBox("titles",D.titles,"roleList","Type a role, like Data Analyst")}<span class="hint" id="roleHint">${D.roles.length?`Matched to: ${D.roles.map(r=>TRACK[r]).join(", ")}. Your first role sets your field and tile color.`:"Pick at least one role."}</span></div>
    <div class="f"><span class="lbl">Cities or countries</span>${chipBox("locs",D.locs,"placeList","Type a city or country")}<span class="hint">Add cities or whole countries. A country matches every city in it.</span></div>
    <div class="f"><label for="eP">Minimum pay (in thousands, per year)</label><div class="payrow"><select id="eCur" data-d="cur" data-curfor="eP">${curOpts(D.cur)}</select><input id="eP" type="number" min="0" step="5" data-d="pay" value="${D.pay||""}" data-payprev="ePv" data-cur="eCur"></div><span class="hint" id="ePv">${D.pay?money(D.pay,D.cur)+" a year":""}</span></div>
    <label class="sw"><input type="checkbox" data-d="remote" ${D.remote?"checked":""}><span class="tr"></span>Open to remote roles</label>
    <label class="sw"><input type="checkbox" data-d="sponsor" ${D.sponsor?"checked":""}><span class="tr"></span>I need visa sponsorship</label>`;
  if(k==="skills")return `<div class="f"><label for="eS">Search</label><input id="eS" placeholder="Try SQL or Figma" autocomplete="off"></div>
    <span class="hint" id="skN">${D.skills.length} selected. Your first skill shows on your tile.</span><div class="tags" id="skGrid">${skGrid("")}</div>`;
  if(k==="links")return linksEditor();
  if(k==="projects")return projEditor();
  if(k==="exp")return expEditor();
  if(k==="edu")return eduEditor();
  return `<div class="f"><label for="eW">Link to a case study, project or portfolio</label><input id="eW" data-d="sample" maxlength="200" value="${esc(D.sample)}" placeholder="yoursite.com/case-study"><span class="hint">Companies see that you have one. The link itself unlocks after you accept.</span></div>`;
}
const skGrid=q=>{const sel=D.skills.filter(s=>!ALLSK.includes(s));return [...ALLSK,...sel].filter(s=>s.toLowerCase().includes(q.toLowerCase())).map(s=>`<button class="tagl pick ${D.skills.includes(s)?"on":""}" data-act="dtog" data-f="skills" data-v="${esc(s)}">${esc(s)}</button>`).join("")+(q.trim()&&!ALLSK.concat(D.skills).some(s=>s.toLowerCase()===q.trim().toLowerCase())?`<button class="tagl pick" data-act="skadd" data-v="${esc(q.trim())}">+ Add "${esc(q.trim())}"</button>`:"")};

/* ---------- render + events ---------- */
function render(){
  renderTop();
  if(S.loading&&S.user)return;
  if(!S.user)renderLanding();else if(!S.role)renderChoose();else if(S.role==="company"){if(S.ctab==="challenges")renderCoChallenges();else{renderCo();if(S.sheet&&S.mode==="view")renderSheet()}}else renderS();
}
async function act(fn,okMsg){try{const r=await fn();if(okMsg)toast(okMsg);return r}catch(err){toast(friendly(err));throw err}}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(S.menu){S.menu=false;renderTop()}else if($("#modalRoot").innerHTML&&!(S.role==="company"&&!(S.co&&S.co.name)))closeSheet()}
  if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.act==="open"){S.sheet=e.target.dataset.id;S.mode="view";renderSheet()}
});
document.addEventListener("click",async e=>{
  if(S.menu&&!e.target.closest(".acct")){S.menu=false;renderTop()}
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act;
  if(a==="mclose"){if(el.classList.contains("scrim")&&e.target!==el)return;if(S.role==="company"&&!(S.co&&S.co.name))return;closeSheet();return}
  if(a==="menu"){S.menu=!S.menu;renderTop();return}
  if(a==="auth"){authSheet(el.dataset.r,el.dataset.v);return}
  if(a==="google"){google();return}
  if(a==="signout"){S.menu=false;stopPoll();if(PREVIEW){S.user=null;S.role=null;render();return}await API.signOut();return}
  if(a==="demoswap"){const r=S.role==="company"?"seeker":"company";DEMO.demoRole=r;S.user=null;S.role=null;S.preview=false;await onSession({user:{id:r==="company"?"co":"me",email:r==="company"?"hiring@fieldnote.co":"jordan@example.com"}},r);return}
  if(a==="pick"){el.disabled=true;try{await API.register(el.dataset.r);S.role=null;const u=S.user;S.user=null;await onSession({user:u})}catch(err){toast(friendly(err));el.disabled=false}return}
  if(a==="coname"){S.menu=false;renderTop();coSheet(false);return}
  if(a==="cosave"){const n=$("#coN").value.trim(),w=$("#coW").value.trim();if(!n){toast("Add your company name.");return}
    let L=S.coLogoDraft!=null?S.coLogoDraft:((S.co&&S.co.logo_url)||"");if(isAutoLogo(L))L=hostOf(w)?FAV(hostOf(w)):"";
    await act(()=>API.saveCompany(n,w,L));S.co={...S.co,name:n,website:w,logo_url:L};S.logos=S.logos||{};if(L)S.logos[n]=L;else delete S.logos[n];S.coLogoDraft=null;closeSheet();render();if(!S.jobs.length)newJob();return}
  if(a==="job"){S.job=el.dataset.id;S.tab="top";render();return}
  if(a==="tab"){S.tab=el.dataset.t;render();return}
  if(a==="toggleJob"){const j=job();await act(()=>API.setJobOpen(j.id,!j.open),j.open?"Role closed. It's hidden from members.":"Role reopened.");j.open=!j.open;render();return}
  if(a==="open"){S.sheet=el.dataset.id;S.mode="view";renderSheet();return}
  if(a==="invite"){S.sheet=el.dataset.id;S.mode="invite";SLOTS=mkSlots().concat(SLOTS.filter(s=>s.startsWith("Custom")));pickSlots=SLOTS.slice(0,2);renderSheet();return}
  if(a==="back"){S.mode="view";renderSheet();return}
  if(a==="slot"){const s=SLOTS[+el.dataset.i];if(!pickSlots.includes(s)&&pickSlots.length>=6){toast("You can offer up to 6 times.");return}pickSlots=pickSlots.includes(s)?pickSlots.filter(x=>x!==s):[...pickSlots,s];$("#slotPick").innerHTML=slotBtns();return}
  if(a==="addtime"){const v=$("#customT").value;if(!v){toast("Pick a date and time first.");return}const d=new Date(v);if(isNaN(d)||d<new Date()){toast("Pick a time in the future.");return}
    const s=d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})+" · "+d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})+(tz?" "+tz:"");
    if(!SLOTS.includes(s))SLOTS.push(s);if(!pickSlots.includes(s)&&pickSlots.length<6)pickSlots.push(s);$("#slotPick").innerHTML=slotBtns();$("#customT").value="";return}
  if(a==="send"){
    if(!pickSlots.length){toast("Pick at least one time.");return}
    const j=job(),id=el.dataset.id,c=cand(id);el.disabled=true;
    try{await act(()=>API.invite(j.id,id,$("#invMsg").value.trim(),pickSlots.slice()));S.mode="view";closeSheet();await refresh();toast(`Invite sent to ${dname(c)}. You'll see their answer here.`)}catch(_){el.disabled=false}
    return}
  if(a==="pass"){const j=job(),id=el.dataset.id;await act(()=>API.pass(j.id,id));S.passes.push({job_id:j.id,seeker_id:id});closeSheet();const nx=ranked(j).top[9];S.fresh=nx&&nx.c.id;render();toast("Passed. The next best match moved in.");return}
  if(a==="adv"){e.stopPropagation();el.disabled=true;try{const st=await act(()=>API.advance(el.dataset.id));const x=S.inv.find(i=>i.id===el.dataset.id);if(x)x.status=st;render();if(st==="hired")toast("Hired. Congrats!")}catch(_){el.disabled=false}return}
  if(a==="new"){newJob();return}
  if(a==="sk"){const v=el.dataset.v;
    if(draft.must.includes(v)){draft.must=draft.must.filter(x=>x!==v);draft.nice.push(v)}else if(draft.nice.includes(v))draft.nice=draft.nice.filter(x=>x!==v);else draft.must.push(v);
    $("#skPick").innerHTML=skBtns();return}
  if(a==="postjob"){const v=id=>$("#"+id).value.trim();
    if(!v("nT")){toast("Add a role title.");$("#nT").focus();return}
    if(!draft.must.length){toast("Pick at least one must have skill.");return}
    const mode=v("nMode"),p0=+v("nP0"),p1=+v("nP1"),e0=+v("nE0"),e1=+v("nE1");
    if(!p0||!p1||p1<p0||e1<e0){toast("Check the pay and experience ranges. Each 'to' needs to be at least its 'from'.");return}
    const d={title:v("nT"),city:mode==="Remote"?"Remote":v("nCity"),mode,track:v("nTr"),must:draft.must.slice(),nice:draft.nice.slice(),exp:[e0,e1],pay:[p0,p1],sponsor:$("#nSp").checked,cur:$("#nCur")?$("#nCur").value:"USD"};
    el.disabled=true;
    try{const nj=await act(()=>API.createJob(d));S.jobs.unshift(nj);S.job=nj.id;S.tab="top";closeSheet();render();window.scrollTo(0,0);const n=ranked(nj).top.length;toast(n?`Posted. Here ${n===1?"is your best match":"are your best "+n}.`:"Posted. We'll show matches as members join.")}catch(_){el.disabled=false}
    return}
  if(a==="preview"){S.preview=!S.preview;renderS();window.scrollTo(0,0);return}
  if(a==="edit"){S.menu=false;renderTop();editSheet(el.dataset.s);return}
  if(a==="dtog"){const f=el.dataset.f,v=el.dataset.v,arr=D[f],i=arr.indexOf(v);i>=0?arr.splice(i,1):arr.push(v);el.classList.toggle("on");if(f==="skills")$("#skN").textContent=D.skills.length+" selected. Your first skill shows on your tile.";return}
  if(a==="skadd"){const v=el.dataset.v.slice(0,40);if(!D.skills.includes(v))D.skills.push(v);$("#eS").value="";$("#skGrid").innerHTML=skGrid("");$("#skN").textContent=D.skills.length+" selected. Your first skill shows on your tile.";return}
  if(a==="xdel"){D.exp.splice(+el.dataset.i,1);$("#edBody").innerHTML=edBody("exp");return}
  if(a==="xadd"){const t=$("#xT").value.trim(),co=$("#xC").value.trim(),y=Math.max(1,+$("#xY").value||1);if(!t||!co){toast("Add a title and company.");return}D.exp.unshift({t,co,y});$("#edBody").innerHTML=edBody("exp");return}
  if(a==="dsave"){if(!commitPending())return;if($("#lkIn")&&$("#lkIn").value.trim())addLink();if($("#pjT")&&$("#pjT").value.trim()){$("[data-act=pjsave]").click();if($("#pjT").value.trim())return}D.sample=((D.projects||[]).find(x=>x.u)||{}).u||"";["titles","locs"].forEach(f=>{const i=$("#in_"+f);if(i&&i.value.trim()){addChip(f,i.value);i.value=""}});if(D.titles)syncRoles();
    D.yrs=Math.max(0,Math.min(45,+D.yrs||0));D.pay=Math.max(0,+D.pay||0);
    el.disabled=true;try{await act(()=>API.saveSeeker(D));S.me=D;closeSheet();renderS();renderTop();toast("Saved. Companies see your updated profile.");loadSocial().then(renderS).catch(()=>{})}catch(_){el.disabled=false}return}
  if(a==="cslot"){const x=S.myInv.find(i=>i.id===el.dataset.id);x.pick=+el.dataset.i;renderS();return}
  if(a==="accept"){const x=S.myInv.find(i=>i.id===el.dataset.id),slot=x.slots[x.pick];el.disabled=true;
    try{await act(()=>API.respond(x.id,true,slot));x.status="accepted";x.slot=slot;renderS();toast(`You're meeting ${x.company} on ${slot}.`)}catch(_){el.disabled=false}return}
  if(a==="decline"){const x=S.myInv.find(i=>i.id===el.dataset.id);el.disabled=true;
    try{await act(()=>API.respond(x.id,false,""));x.status="declined";renderS();toast(`Declined. ${x.company} won't see your name.`)}catch(_){el.disabled=false}return}
});
document.addEventListener("submit",e=>{e.preventDefault();if(["fSignin","fSignup","fForgot","fReset"].includes(e.target.id))doAuth(e.target)});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="eS"){$("#skGrid").innerHTML=skGrid(t.value);return}
  const f=t.dataset&&t.dataset.d;if(f&&D)D[f]=t.type==="checkbox"?t.checked:t.type==="number"?(+t.value||0):t.value;
});
document.addEventListener("change",async e=>{
  if(e.target.id==="openSw"){const v=e.target.checked;const nd={...S.me,open:v};try{await act(()=>API.saveSeeker(nd));S.me=nd;renderS();toast(v?"You're visible to companies again.":"Paused. Companies won't see you until you turn this back on.")}catch(_){e.target.checked=!v}}
  const f=e.target.dataset&&e.target.dataset.d;if(f&&D&&e.target.type==="checkbox")D[f]=e.target.checked;
});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.role&&!$("#modalRoot").innerHTML)refresh(true)});

async function boot(){
  renderTop();
  if(PREVIEW){S.loading=false;if(window.PATHS_AUTO){DEMO.demoRole=window.PATHS_AUTO;onSession({user:{id:window.PATHS_AUTO==="company"?"co":"me",email:window.PATHS_AUTO==="company"?"hiring@fieldnote.co":"jordan@example.com"}},window.PATHS_AUTO)}else renderLanding();return}
  const cfg=window.WORKBOARD_CONFIG||{};
  if(!window.supabase||!cfg.supabaseUrl){$("#main").innerHTML=`<div class="state"><h2>Almost ready</h2><p>Add your Supabase URL and anon key to config.js, then reload.</p></div>`;return}
  sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
  sb.auth.onAuthStateChange((ev,sess)=>{if(ev==="PASSWORD_RECOVERY"){S.recover=true;authSheet(takeIntent()||"seeker","reset");return}setTimeout(()=>onSession(sess),0)});
  const{data}=await sb.auth.getSession();onSession(data.session);
}

const DRILLS={"product": [{"id": 1001, "prompt": "Instagram started as a check-in app with a different name. What was it called?", "options": ["Picplz", "Gowalla", "Burbn", "Hipstamatic"], "answer": 2, "explain": "Kevin Systrom and Mike Krieger stripped Burbn down to photos, filters and likes, then relaunched it as Instagram in October 2010.", "source": "Instagram, 2010"}, {"id": 1002, "prompt": "Slack was built inside a company that was originally making what?", "options": ["A photo sharing app", "An online game", "An email client", "A payments tool"], "answer": 1, "explain": "Tiny Speck was building a game called Glitch. When the game failed, the team turned its internal chat tool into Slack.", "source": "Tiny Speck, 2013"}, {"id": 1003, "prompt": "YouTube's founders first pitched it as what?", "options": ["A TV listings guide", "A video dating site", "A home movie archive", "A video ad network"], "answer": 1, "explain": "The early slogan was \"Tune In, Hook Up.\" Nobody uploaded dating videos, so they opened it up to any video.", "source": "YouTube, 2005"}, {"id": 1004, "prompt": "When the first iPhone launched in 2007, what was missing?", "options": ["A touchscreen", "Email", "A web browser", "An App Store for third party apps"], "answer": 3, "explain": "Apple pushed web apps at first. The App Store arrived in July 2008 with about 500 apps.", "source": "Apple, 2008"}, {"id": 1005, "prompt": "Slack found that teams who sent a certain number of messages almost never churned. What was the number?", "options": ["10,000", "200", "2,000", "500"], "answer": 2, "explain": "Stewart Butterfield said teams that had exchanged 2,000 messages had really tried Slack, and about 93% of them kept using it.", "source": "Slack, Stewart Butterfield"}, {"id": 1006, "prompt": "What does Amazon write before building a new product?", "options": ["A press release and FAQ", "A detailed Gantt chart", "A pitch deck", "A pricing sheet"], "answer": 0, "explain": "Amazon's Working Backwards process starts with a mock press release and FAQ, written as if the product had already launched.", "source": "Amazon, Working Backwards"}, {"id": 1007, "prompt": "In 2017 Twitter changed its character limit for most languages. From 140 to what?", "options": ["200", "240", "500", "280"], "answer": 3, "explain": "Twitter doubled the limit to 280 in November 2017 after tests showed people rarely hit the new cap.", "source": "Twitter, 2017"}, {"id": 1008, "prompt": "Quibi raised about $1.75 billion. How long after launch did it announce it was shutting down?", "options": ["About 18 months", "About 3 weeks", "About 2 years", "About 6 months"], "answer": 3, "explain": "Quibi launched in April 2020 and announced its shutdown in October 2020. Short videos made only for phones didn't stick.", "source": "Quibi, 2020"}, {"id": 1009, "prompt": "Amazon's Fire Phone flopped. Roughly how big was the write down Amazon took in 2014?", "options": ["$170 million", "$700 million", "$1.7 billion", "$17 million"], "answer": 0, "explain": "Amazon wrote down about $170 million, mostly unsold phone inventory.", "source": "Amazon, Q3 2014"}, {"id": 1010, "prompt": "In 2011 Netflix tried to spin its DVD business into a separate service, then reversed within weeks. What was it called?", "options": ["Qwikster", "Netflix Classic", "DVDFlix", "Redbox"], "answer": 0, "explain": "Qwikster lasted about a month. Together with a price hike, the move cost Netflix around 800,000 subscribers that quarter.", "source": "Netflix, 2011"}, {"id": 1011, "prompt": "What price did Google charge for the Glass Explorer Edition in 2013?", "options": ["$299", "$3,000", "$1,500", "$799"], "answer": 2, "explain": "The $1,500 price, privacy worries and no clear use case kept Glass a niche product.", "source": "Google, 2013"}, {"id": 1012, "prompt": "Instagram Stories launched in 2016 with a format openly borrowed from which app?", "options": ["Snapchat", "Periscope", "Vine", "Tumblr"], "answer": 0, "explain": "Kevin Systrom said Snapchat deserved credit for the format. Within a year Instagram Stories had more daily users than Snapchat.", "source": "Instagram, 2016"}, {"id": 1013, "prompt": "The Sean Ellis test asks users how they'd feel if they could no longer use your product. What share saying \"very disappointed\" signals product market fit?", "options": ["25%", "10%", "40%", "75%"], "answer": 2, "explain": "Ellis found products crossing 40% \"very disappointed\" usually grew well. Superhuman used this test to steer its roadmap.", "source": "Sean Ellis; Superhuman"}, {"id": 1014, "prompt": "When Steve Jobs returned to Apple in 1997, how many core products did he cut the lineup down to?", "options": ["4", "1", "8", "12"], "answer": 0, "explain": "He drew a 2 by 2 grid of consumer and pro, desktop and portable, and kept one great product in each box.", "source": "Apple, 1997"}, {"id": 1015, "prompt": "Gmail launched with 1 GB of free storage on a date that made people think it was a joke. Which date?", "options": ["October 31, 2005", "January 1, 2004", "April 1, 2004", "July 4, 2003"], "answer": 2, "explain": "Launching on April Fools' Day with 1 GB, far more than rivals offered, made many people assume it was a prank.", "source": "Google, 2004"}, {"id": 1016, "prompt": "The \"milkshake\" story, about the job customers hire a product to do, comes from which thinker?", "options": ["Clayton Christensen", "Marty Cagan", "Steve Blank", "Peter Drucker"], "answer": 0, "explain": "Christensen's team found people bought morning milkshakes to make a long, boring commute more bearable. That became Jobs to be Done.", "source": "Clayton Christensen"}, {"id": 1017, "prompt": "What do the letters in the RICE prioritization score stand for?", "options": ["Reach, Insight, Cost, Execution", "Revenue, Impact, Cost, Effort", "Risk, Impact, Confidence, Engagement", "Reach, Impact, Confidence, Effort"], "answer": 3, "explain": "Intercom created RICE so teams could compare ideas with one number: reach times impact times confidence, divided by effort.", "source": "Intercom"}, {"id": 1018, "prompt": "In the Kano model, what are features users expect and only notice when they're missing?", "options": ["Performance features", "Indifferent features", "Delighters", "Basic (must be) features"], "answer": 3, "explain": "Basic features don't make anyone happy, but leaving them out makes people angry. Think of a hotel room without hot water.", "source": "Noriaki Kano, 1984"}, {"id": 1019, "prompt": "Dropbox's 2008 demo video sent its beta waitlist from about 5,000 people to roughly how many overnight?", "options": ["15,000", "75,000", "750,000", "7,500"], "answer": 1, "explain": "Drew Houston posted a short demo filled with inside jokes for the Digg crowd, and the waitlist jumped to about 75,000.", "source": "Dropbox, 2008"}, {"id": 1020, "prompt": "Google once tested how many shades of blue for its links?", "options": ["12", "41", "100", "4"], "answer": 1, "explain": "Marissa Mayer's team tested 41 shades. The winning blue was later credited with around $200 million a year in extra ad revenue.", "source": "Google"}, {"id": 1021, "prompt": "How much did The New York Times pay for Wordle in 2022?", "options": ["About $100 million", "Nothing, it was a gift", "About $50,000", "An amount in the low seven figures"], "answer": 3, "explain": "Josh Wardle built Wordle for his partner. The Times bought it for an undisclosed sum in the low seven figures.", "source": "The New York Times, 2022"}, {"id": 1022, "prompt": "Nvidia was founded in 1993 in what kind of place?", "options": ["A garage", "A Starbucks", "A booth at a Denny's", "A college dorm"], "answer": 2, "explain": "Jensen Huang and his cofounders planned the company in a booth at a Denny's in San Jose. Huang had worked at Denny's as a teenager.", "source": "Nvidia, 1993"}, {"id": 1023, "prompt": "Facebook launched News Feed in 2006 and users protested. What happened next?", "options": ["It moved into a separate app", "Facebook removed it within a week", "It became opt in only", "Feed stayed, Facebook added privacy controls, and usage grew"], "answer": 3, "explain": "Zuckerberg apologized for how it was rolled out and added privacy settings, but kept Feed. Engagement went up.", "source": "Facebook, 2006"}, {"id": 1024, "prompt": "Microsoft's Office assistant Clippy was switched off by default in which release?", "options": ["Office XP", "Office 365", "Office 95", "Office 2013"], "answer": 0, "explain": "Office XP in 2001 turned Clippy off by default, and Microsoft even made fun of him in the ads. He was removed entirely in Office 2007.", "source": "Microsoft, 2001"}, {"id": 1025, "prompt": "Spotify's Discover Weekly playlist first launched in which year?", "options": ["2009", "2019", "2012", "2015"], "answer": 3, "explain": "Discover Weekly launched in July 2015 and passed a billion streams within its first 10 weeks.", "source": "Spotify, 2015"}], "growth": [{"id": 2001, "prompt": "Hotmail grew to millions of users largely because of what?", "options": ["Paying users to sign up", "TV ads", "A partnership with AOL", "A signup line added to the bottom of every email"], "answer": 3, "explain": "Every email ended with \"PS: I love you. Get your free email at Hotmail.\" Each message became an ad.", "source": "Hotmail, 1996"}, {"id": 2002, "prompt": "Dropbox's referral program rewarded whom?", "options": ["Only the new user", "Only the person who invited", "Neither, it was a contest", "Both the person who invited and the friend who joined"], "answer": 3, "explain": "A double sided reward gave both people extra free storage, so asking a friend felt like a favor, not a sales pitch.", "source": "Dropbox, 2008"}, {"id": 2003, "prompt": "Drew Houston said referrals raised Dropbox's signups by about how much, for good?", "options": ["6%", "16%", "60%", "600%"], "answer": 2, "explain": "Referrals drove a lasting 60% lift in signups, which is why the referral program became central to Dropbox's growth.", "source": "Dropbox, 2010"}, {"id": 2004, "prompt": "In its early days PayPal paid people cash to sign up and refer friends. Roughly what did the bonus start at?", "options": ["$20", "$200", "$1", "50 cents"], "answer": 0, "explain": "PayPal started around $20 and lowered it to $10 and then $5 as growth took off. It was expensive, but it worked.", "source": "PayPal, 1999 to 2000"}, {"id": 2005, "prompt": "Airbnb found early hosts and guests with which growth hack?", "options": ["Letting hosts cross post listings to Craigslist", "Partnering with Marriott", "Buying Super Bowl ads", "Paying influencers on Instagram"], "answer": 0, "explain": "Airbnb built an integration so hosts could repost their listings on Craigslist, tapping into its huge audience.", "source": "Airbnb, around 2010"}, {"id": 2006, "prompt": "To keep the company alive in 2008, Airbnb's founders sold what?", "options": ["Concert tickets", "Election themed cereal boxes", "Custom t shirts", "Their own furniture"], "answer": 1, "explain": "They sold Obama O's and Cap'n McCain's cereal and raised about $30,000.", "source": "Airbnb, 2008"}, {"id": 2007, "prompt": "Dollar Shave Club's 2012 launch video went viral. Roughly what did it cost to make?", "options": ["$450", "$45,000", "$4,500", "$450,000"], "answer": 2, "explain": "The low budget video brought in about 12,000 orders in the first two days.", "source": "Dollar Shave Club, 2012"}, {"id": 2008, "prompt": "Unilever bought Dollar Shave Club in 2016 for about how much?", "options": ["$100 million", "$300 million", "$1 billion", "$10 billion"], "answer": 2, "explain": "About $1 billion in cash, just four years after the viral video.", "source": "Unilever, 2016"}, {"id": 2009, "prompt": "Facebook's growth team found new users stuck around once they reached what?", "options": ["1 post a day for a week", "7 friends in 10 days", "100 friends in a month", "3 photos in the first hour"], "answer": 1, "explain": "Chamath Palihapitiya's team rebuilt onboarding around getting new users to 7 friends in 10 days.", "source": "Facebook growth team"}, {"id": 2010, "prompt": "Obama's 2008 campaign A/B tested its signup page. About how much did the best version raise signups?", "options": ["40%", "4%", "400%", "140%"], "answer": 0, "explain": "A family photo and a \"Learn More\" button lifted signups by about 40.6%, worth an estimated $60 million in donations.", "source": "Obama campaign, 2008"}, {"id": 2011, "prompt": "Who coined the term \"growth hacker\" in 2010?", "options": ["Sean Ellis", "Andrew Chen", "Paul Graham", "Seth Godin"], "answer": 0, "explain": "Sean Ellis used it for people whose every decision is judged by its effect on growth.", "source": "Sean Ellis, 2010"}, {"id": 2012, "prompt": "Which of these is NOT one of Dave McClure's AARRR \"pirate metrics\"?", "options": ["Referral", "Awareness", "Activation", "Retention"], "answer": 1, "explain": "AARRR stands for Acquisition, Activation, Retention, Referral and Revenue.", "source": "Dave McClure, 2007"}, {"id": 2013, "prompt": "New Coke launched in 1985. How long until the original formula came back as Coca-Cola Classic?", "options": ["9 months", "2 years", "79 days", "7 days"], "answer": 2, "explain": "Taste tests favored New Coke, but fans revolted over losing the original. It returned after 79 days.", "source": "Coca-Cola, 1985"}, {"id": 2014, "prompt": "The \"Share a Coke\" campaign, which printed first names on bottles, started in which country?", "options": ["United States", "Japan", "Australia", "United Kingdom"], "answer": 2, "explain": "It launched in Australia in 2011 and was later rolled out in more than 70 countries.", "source": "Coca-Cola, 2011"}, {"id": 2015, "prompt": "How long is Zappos' famous return window?", "options": ["14 days", "365 days", "90 days", "30 days"], "answer": 1, "explain": "Free shipping both ways and a year to return made buying shoes online feel risk free.", "source": "Zappos"}, {"id": 2016, "prompt": "How did Gmail spread when it launched in 2004?", "options": ["Invite only, with a few invites per user", "Paid search ads", "Free gifts for signing up", "Bundled with Windows"], "answer": 0, "explain": "The scarcity made Gmail invites a status symbol, and some sold on eBay.", "source": "Google, 2004"}, {"id": 2017, "prompt": "Robinhood built a huge waitlist before launch. Roughly how many people joined it?", "options": ["About 10 million", "About 10,000", "About 100,000", "About 1 million"], "answer": 3, "explain": "People could move up the line by referring friends, which made the waitlist itself a growth engine.", "source": "Robinhood, 2014 to 2015"}, {"id": 2018, "prompt": "About how many people signed up for Instagram on its first day?", "options": ["250,000", "2.5 million", "250", "25,000"], "answer": 3, "explain": "Instagram got about 25,000 signups in its first 24 hours and hit 1 million in about two months.", "source": "Instagram, 2010"}, {"id": 2019, "prompt": "Tinder's early growth started in what setting?", "options": ["High schools", "College campuses, beginning with USC", "Corporate offices", "Gyms"], "answer": 1, "explain": "The team signed up whole sororities and fraternities at USC so new users found plenty of people right away.", "source": "Tinder, 2012"}, {"id": 2020, "prompt": "What LTV to CAC ratio is a common rule of thumb for healthy unit economics?", "options": ["1 to 3", "1 to 1", "At least 3 to 1", "At least 20 to 1"], "answer": 2, "explain": "Around 3 to 1 means each customer earns about three times what it cost to get them. Much higher can mean you're underinvesting in growth.", "source": "SaaS benchmark"}, {"id": 2021, "prompt": "In viral growth, what does a K factor above 1 mean?", "options": ["Each user brings in more than one new user on average", "Churn is below 1% a month", "Paid ads are profitable", "Growth has stopped"], "answer": 0, "explain": "With K above 1, the user base grows on its own without paid marketing.", "source": "Viral loops"}, {"id": 2022, "prompt": "When did the original Pepsi Challenge blind taste tests begin?", "options": ["1975", "1955", "1995", "2005"], "answer": 0, "explain": "In blind tests more people picked Pepsi, so Pepsi made the results the center of its ads.", "source": "PepsiCo, 1975"}, {"id": 2023, "prompt": "Old Spice's \"The Man Your Man Could Smell Like\" campaign launched in which year?", "options": ["2010", "2003", "1998", "2016"], "answer": 0, "explain": "The ad and its follow up personalized response videos turned an old fashioned brand into a viral hit.", "source": "Old Spice, 2010"}, {"id": 2024, "prompt": "How did LinkedIn first grow its network?", "options": ["By letting users import email contacts to invite", "Through a Super Bowl ad", "By paying recruiters", "By buying Facebook ads"], "answer": 0, "explain": "Importing address books and suggesting connections helped every new user pull in more users.", "source": "LinkedIn, 2003 to 2004"}, {"id": 2025, "prompt": "What made Wordle spread so fast in late 2021?", "options": ["Email reminders", "An app store feature", "A shareable grid of colored squares that hid the answer", "Paid influencers"], "answer": 2, "explain": "The emoji grid let people brag without spoiling the puzzle, and everyone played the same word each day.", "source": "Wordle, 2021"}], "ops": [{"id": 3001, "prompt": "In February 2008 Starbucks closed about 7,100 US stores for a few hours. Why?", "options": ["A software outage", "To retrain baristas on making espresso", "A labor strike", "A coffee shortage"], "answer": 1, "explain": "Howard Schultz shut stores for about three hours so baristas could relearn how to pull a good espresso shot.", "source": "Starbucks, 2008"}, {"id": 3002, "prompt": "In the 1982 Tylenol crisis, roughly how many bottles did Johnson & Johnson recall?", "options": ["310 million", "300,000", "3 million", "31 million"], "answer": 3, "explain": "Recalling about 31 million bottles cost roughly $100 million, and is still a classic case of putting safety first.", "source": "Johnson & Johnson, 1982"}, {"id": 3003, "prompt": "At Toyota, what lets any worker stop the production line when they spot a problem?", "options": ["The poka yoke switch", "The andon cord", "The kanban board", "The kaizen bell"], "answer": 1, "explain": "Pulling the andon cord stops the line so problems are fixed at the source instead of passed down the line.", "source": "Toyota Production System"}, {"id": 3004, "prompt": "Southwest Airlines flies only one type of plane. Which one?", "options": ["Airbus A320", "Boeing 777", "Boeing 737", "Embraer E190"], "answer": 2, "explain": "One type means simpler training, maintenance and spare parts, which helps keep costs low.", "source": "Southwest Airlines"}, {"id": 3005, "prompt": "Southwest became famous in the early 1970s for turning a plane around at the gate in how long?", "options": ["45 minutes", "25 minutes", "10 minutes", "90 minutes"], "answer": 2, "explain": "Short of cash, Southwest had to sell a plane and keep its schedule with three. The 10 minute turn made that possible.", "source": "Southwest Airlines, 1972"}, {"id": 3006, "prompt": "Roughly how fast can Zara take a new design from the studio to stores?", "options": ["About a year", "About 2 to 3 weeks", "About 2 days", "About 6 months"], "answer": 1, "explain": "Making much of its clothing close to home in Spain lets Zara react to trends in weeks instead of seasons.", "source": "Inditex"}, {"id": 3007, "prompt": "What has Costco charged for its hot dog and soda combo since 1985?", "options": ["$4.99", "$1.50", "$0.99", "$2.50"], "answer": 1, "explain": "Costco has kept the price frozen for decades as a loss leader that builds loyalty.", "source": "Costco"}, {"id": 3008, "prompt": "Amazon Prime launched in 2005 at what annual price?", "options": ["$119", "$99", "$49", "$79"], "answer": 3, "explain": "Prime started at $79 a year for unlimited two day shipping.", "source": "Amazon, 2005"}, {"id": 3009, "prompt": "What was the name of the McDonald brothers' 1948 assembly line kitchen?", "options": ["Lean Kitchen", "Six Sigma", "Just in Time", "The Speedee Service System"], "answer": 3, "explain": "They cut the menu to a few items and ran the kitchen like a factory line, so food came out in seconds.", "source": "McDonald's, 1948"}, {"id": 3010, "prompt": "In 2000 Blockbuster reportedly passed on buying Netflix for how much?", "options": ["$5 billion", "$5 million", "$50 million", "$500 million"], "answer": 2, "explain": "Reed Hastings offered to sell Netflix for about $50 million. Blockbuster declined and filed for bankruptcy in 2010.", "source": "Netflix, 2000"}, {"id": 3011, "prompt": "A Kodak engineer built the first digital camera in which year?", "options": ["1975", "1995", "1965", "1985"], "answer": 0, "explain": "Steve Sasson's prototype took 23 seconds to record an image. Kodak held back on digital to protect its film business.", "source": "Kodak, 1975"}, {"id": 3012, "prompt": "Six Sigma quality methods were developed at which company?", "options": ["General Electric", "Ford", "Toyota", "Motorola"], "answer": 3, "explain": "Engineer Bill Smith introduced it at Motorola in 1986. GE made it famous in the 1990s.", "source": "Motorola, 1986"}, {"id": 3013, "prompt": "In 1973 FedEx founder Fred Smith reportedly kept the company afloat by doing what?", "options": ["Winning about $27,000 at blackjack in Las Vegas", "Taking out a credit card loan", "Selling his house", "Getting a government contract"], "answer": 0, "explain": "With fuel money running out, Smith flew to Las Vegas and won enough to make payroll for another week.", "source": "FedEx, 1973"}, {"id": 3014, "prompt": "When Lehman Brothers filed for bankruptcy in 2008, about how large were its assets?", "options": ["$64 billion", "$6.4 trillion", "$6 billion", "$639 billion"], "answer": 3, "explain": "It is still the largest bankruptcy filing in US history.", "source": "Lehman Brothers, 2008"}, {"id": 3015, "prompt": "WeWork pulled its IPO in 2019. About how high had its private valuation been?", "options": ["$470 billion", "$470 million", "$47 billion", "$4.7 billion"], "answer": 2, "explain": "Investors balked once its losses and governance issues were public, and the valuation collapsed.", "source": "WeWork, 2019"}, {"id": 3016, "prompt": "Using the rule of 72, about how many years does it take money to double at 8% a year?", "options": ["72 years", "6 years", "9 years", "12 years"], "answer": 2, "explain": "Divide 72 by the growth rate: 72 divided by 8 is 9.", "source": "Rule of 72"}, {"id": 3017, "prompt": "In which year did Netflix stop its DVD by mail service?", "options": ["2013", "2023", "2020", "2017"], "answer": 1, "explain": "Netflix shipped its last red envelopes in September 2023, about 25 years after it started.", "source": "Netflix, 2023"}, {"id": 3018, "prompt": "Walmart pioneered moving goods straight from inbound trucks to outbound trucks with almost no storage. What is that called?", "options": ["Drop shipping", "Kanban", "Just in case", "Cross docking"], "answer": 3, "explain": "Cross docking cuts warehouse time and inventory costs, a big part of Walmart's low prices.", "source": "Walmart"}, {"id": 3019, "prompt": "What is Jeff Bezos's \"two pizza\" rule?", "options": ["Teams should be small enough to feed with two pizzas", "Never hold more than two meetings a day", "Ship two features per sprint", "Always test two versions of every page"], "answer": 0, "explain": "Small teams communicate faster and own their work end to end.", "source": "Amazon"}, {"id": 3020, "prompt": "The 80/20 rule is named after which economist?", "options": ["Adam Smith", "John Maynard Keynes", "Milton Friedman", "Vilfredo Pareto"], "answer": 3, "explain": "Pareto noticed about 80% of Italy's land was owned by about 20% of the people. The pattern shows up everywhere.", "source": "Pareto principle"}, {"id": 3021, "prompt": "What kind of business was Berkshire Hathaway before Warren Buffett turned it into a holding company?", "options": ["A bank", "A textile maker", "A railroad", "An insurance company"], "answer": 1, "explain": "Buffett later called buying a struggling textile mill one of his biggest mistakes, then used it to buy better businesses.", "source": "Berkshire Hathaway"}, {"id": 3022, "prompt": "After Enron collapsed in 2001, which accounting firm went down with it?", "options": ["Deloitte", "Ernst & Young", "KPMG", "Arthur Andersen"], "answer": 3, "explain": "Arthur Andersen was convicted of obstruction for shredding Enron documents and lost its clients. The Supreme Court later overturned the conviction, but by then the firm was gone.", "source": "Enron, 2001 to 2002"}, {"id": 3023, "prompt": "In March 2021 the Ever Given container ship blocked the Suez Canal for about how long?", "options": ["6 months", "6 days", "6 weeks", "6 hours"], "answer": 1, "explain": "Hundreds of ships waited, and the blockage held up an estimated $9 billion of trade a day.", "source": "Suez Canal, 2021"}, {"id": 3024, "prompt": "Elizabeth Holmes, founder of Theranos, was found guilty of fraud in which year?", "options": ["2016", "2019", "2022", "2024"], "answer": 2, "explain": "A jury convicted her in January 2022 on four counts of defrauding investors.", "source": "Theranos trial, 2022"}, {"id": 3025, "prompt": "The Boeing 737 MAX was grounded worldwide in which year after two crashes?", "options": ["2021", "2017", "2015", "2019"], "answer": 3, "explain": "Regulators grounded it in March 2019. It returned to service in the US in late 2020 after software and training changes.", "source": "Boeing, 2019"}], "data": [{"id": 4001, "prompt": "In World War II, Abraham Wald told the military to add armor where returning planes had NO bullet holes. Why?", "options": ["Planes hit in those spots never made it back", "Pilots asked for it", "Bullets bounce off the wings", "Those areas were lighter"], "answer": 0, "explain": "This is survivorship bias. The data only came from planes that survived, so the missing holes showed where hits were fatal.", "source": "Abraham Wald, 1943"}, {"id": 4002, "prompt": "UC Berkeley's 1973 admissions looked biased against women overall, but not within most departments. What is this called?", "options": ["The base rate fallacy", "Regression to the mean", "Selection bias", "Simpson's paradox"], "answer": 3, "explain": "Women applied more often to very competitive departments. Adding the departments together reversed the pattern.", "source": "UC Berkeley, 1973"}, {"id": 4003, "prompt": "What does Anscombe's quartet show?", "options": ["Datasets with nearly identical summary stats can look completely different when plotted", "Averages beat medians", "Correlation proves causation", "Four data points are enough for a trend"], "answer": 0, "explain": "Francis Anscombe made four datasets with the same means, variances and correlation to show why you should always plot your data.", "source": "Francis Anscombe, 1973"}, {"id": 4004, "prompt": "To win the $1 million Netflix Prize, how much did a team have to improve on Netflix's own recommendation algorithm?", "options": ["10%", "25%", "1%", "50%"], "answer": 0, "explain": "BellKor's Pragmatic Chaos crossed 10% in 2009. Netflix never fully used the winning model because it was too complex to run.", "source": "Netflix Prize, 2009"}, {"id": 4005, "prompt": "Moneyball's Oakland A's found an undervalued stat that predicted winning. Which one?", "options": ["Runs batted in", "Stolen bases", "Batting average", "On base percentage"], "answer": 3, "explain": "Getting on base, including by walking, mattered more than the market valued it, so the A's bought it cheaply.", "source": "Oakland A's, 2002"}, {"id": 4006, "prompt": "Which retailer was reported in 2012 to predict pregnancies from shopping data?", "options": ["Walmart", "Costco", "Amazon", "Target"], "answer": 3, "explain": "Target's model spotted patterns like unscented lotion and supplements. It became a classic case on data and privacy.", "source": "The New York Times, 2012"}, {"id": 4007, "prompt": "What famously went wrong with Google Flu Trends in the 2012 to 2013 flu season?", "options": ["It leaked patient data", "It badly overestimated flu cases", "It missed the flu season entirely", "It only worked in Europe"], "answer": 1, "explain": "It predicted about double the doctor visits the CDC actually saw. Search behavior shifted and the model overfit.", "source": "Nature, 2013"}, {"id": 4008, "prompt": "In a right skewed distribution like household income, how do the mean and median usually compare?", "options": ["The mean is higher than the median", "The median is higher than the mean", "They're equal", "There's no pattern"], "answer": 0, "explain": "A few very high values pull the mean up, which is why median income is usually the fairer number.", "source": "Statistics basics"}, {"id": 4009, "prompt": "In SQL, which clause filters groups after GROUP BY?", "options": ["HAVING", "LIMIT", "WHERE", "ORDER BY"], "answer": 0, "explain": "WHERE filters rows before grouping. HAVING filters the grouped results, like HAVING COUNT(*) > 5.", "source": "SQL"}, {"id": 4010, "prompt": "What does a LEFT JOIN return?", "options": ["All rows from the right table", "Only rows that match in both tables", "All rows from the left table, plus matches from the right", "Every possible pair of rows"], "answer": 2, "explain": "Rows with no match on the right still show up, with NULLs in the right side columns.", "source": "SQL"}, {"id": 4011, "prompt": "What does a p value of 0.03 mean?", "options": ["If there were no real effect, results this extreme would show up about 3% of the time", "There's a 3% chance the hypothesis is true", "97% of users preferred the change", "The effect is 3% large"], "answer": 0, "explain": "A p value measures how surprising the data is under \"no effect.\" It does not tell you the probability that you're right.", "source": "Statistics basics"}, {"id": 4012, "prompt": "Ice cream sales and drownings rise together. What's the best explanation?", "options": ["It's a data error", "Hot weather drives both", "Ice cream causes drowning", "Drowning boosts ice cream sales"], "answer": 1, "explain": "A confounding variable, summer heat, moves both. It's the classic reminder that correlation isn't causation.", "source": "Statistics basics"}, {"id": 4013, "prompt": "In an A/B test, what happens if you keep checking and stop as soon as it looks significant?", "options": ["You get many more false positives", "Nothing changes", "You get more accurate results", "You need fewer users"], "answer": 0, "explain": "Peeking gives random noise many chances to look like a win. Fix the sample size in advance or use sequential testing.", "source": "Experimentation"}, {"id": 4014, "prompt": "Under Benford's law, how often does the leading digit 1 show up in many real world datasets?", "options": ["About 50% of the time", "About 30% of the time", "About 5% of the time", "About 11% of the time"], "answer": 1, "explain": "Smaller leading digits are more common. Auditors use this to flag made up numbers.", "source": "Benford's law"}, {"id": 4015, "prompt": "What did Florence Nightingale's 1858 rose chart show?", "options": ["Death rates were falling", "Battle wounds were the top cause of death", "Hospitals were overstaffed", "Most soldiers died from preventable disease, not battle wounds"], "answer": 3, "explain": "Her chart helped convince the British government to invest in sanitation.", "source": "Florence Nightingale, 1858"}, {"id": 4016, "prompt": "In 1854 John Snow mapped cholera deaths in London. What did the map point to?", "options": ["A contaminated water pump on Broad Street", "A hospital", "Bad air from the river", "A local market"], "answer": 0, "explain": "Deaths clustered around one pump. Once its handle was removed, cases dropped, an early win for data driven public health.", "source": "John Snow, 1854"}, {"id": 4017, "prompt": "The Literary Digest
