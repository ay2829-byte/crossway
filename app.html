rder point in units?","a":1560,"tol":0.01,"unit":""},{"t":"num","q":"If delivery time jumps to 14 days, the new reorder point?","a":2160,"tol":0.01,"unit":""},{"t":"choice","q":"Best way to avoid stockouts while the supplier is slow?","opts":["Raise the reorder point and add a backup supplier","Order once a year","Lower safety stock"],"a":0}],"skills":["Supply chain","Operations"],"mins":15,"work":true,"tag":"Retail","id":1331},{"track":"ops","kind":"case","diff":"Medium","topic":"Strategy","title":"Pricing Power","prompt":"Your product has 30% gross margin. A competitor cuts price 10%. If you match, volume holds. If you don't, you lose 20% of volume.","parts":[{"t":"num","q":"Gross profit change if you match, as a percent?","a":-33.3333,"tol":0.01,"unit":"%"},{"t":"num","q":"Gross profit change if you hold price, as a percent?","a":-20,"tol":0.01,"unit":"%"},{"t":"choice","q":"On gross profit alone, what do you do?","opts":["Hold price and accept the volume loss","Match the cut"],"a":0}],"skills":["Strategy","Pricing"],"mins":15,"work":true,"tag":"Retail","id":1332},{"track":"ops","kind":"case","diff":"Medium","topic":"Revenue operations","title":"Net Revenue Retention","prompt":"You start the year with $10M in annual recurring revenue from existing customers. Expansions add $1.8M, downgrades remove $0.5M and churn removes $0.9M.","parts":[{"t":"num","q":"Net revenue retention, as a percent?","a":104.0,"tol":0.01,"unit":"%"},{"t":"num","q":"Gross revenue retention, as a percent?","a":86.0,"tol":0.01,"unit":"%"}],"skills":["Revenue operations","Metrics"],"mins":10,"work":true,"tag":"SaaS","id":1333},{"track":"ops","kind":"case","diff":"Hard","topic":"Finance","title":"Working Capital","prompt":"Revenue is $36M a year, cost of goods is $24M. Customers pay in 45 days, inventory sits 60 days, and you pay suppliers in 30 days. Use a 360 day year.","parts":[{"t":"num","q":"Cash conversion cycle in days?","a":75,"tol":0.01,"unit":""},{"t":"num","q":"Cash tied up in receivables?","a":4500000.0,"tol":0.01,"unit":"$"},{"t":"num","q":"Cash tied up in inventory?","a":4000000.0,"tol":0.01,"unit":"$"},{"t":"choice","q":"Fastest way to free cash?","opts":["Collect from customers faster","Pay suppliers sooner","Buy more inventory"],"a":0}],"skills":["Accounting","FP&A"],"mins":20,"work":true,"tag":"Finance","id":1334},{"track":"ops","kind":"case","diff":"Medium","topic":"Project management","title":"Critical Path","prompt":"Tasks: A design 5 days. B build 10 days after A. C content 6 days after A. D test 4 days after B. E launch 1 day after C and D.","parts":[{"t":"num","q":"Shortest time to launch, in days?","a":20,"tol":0.01,"unit":""},{"t":"choice","q":"Which task can slip without moving launch?","opts":["C, content","B, build","D, test"],"a":0},{"t":"num","q":"How many days can C slip?","a":8,"tol":0.01,"unit":""}],"skills":["Project management","Operations"],"mins":15,"work":true,"tag":"Operations","id":1335},{"track":"data","kind":"case","diff":"Hard","topic":"Statistics","title":"Simpson's Paradox","prompt":"Model A saw 100 easy cases (80 right) and 100 hard cases (20 right). Model B saw 90 easy cases (81 right) and 300 hard cases (75 right).","parts":[{"t":"num","q":"Model A overall accuracy, as a percent?","a":50.0,"tol":0.01,"unit":"%"},{"t":"num","q":"Model B overall accuracy, as a percent?","a":40.0,"tol":0.01,"unit":"%"},{"t":"choice","q":"Which model is better on both easy and hard cases?","opts":["A","B"],"a":1},{"t":"choice","q":"Why does B look worse overall?","opts":["It saw far more hard cases","It's broken","Rounding"],"a":0}],"skills":["Statistics"],"mins":20,"work":true,"tag":"Analytics","id":1336},{"track":"data","kind":"case","diff":"Medium","topic":"Statistics","title":"Mean or Median","prompt":"Order values this week: $20, $22, $25, $25, $28, $30, $31, $35, $40, $1,200.","parts":[{"t":"num","q":"Mean order value?","a":145.6,"tol":0.01,"unit":"$"},{"t":"num","q":"Median order value?","a":29,"tol":0.01,"unit":"$"},{"t":"choice","q":"Which do you report as the typical order?","opts":["Median, one huge order skews the mean","Mean, it uses all the data"],"a":0}],"skills":["Statistics","Dashboards"],"mins":10,"work":true,"tag":"Analytics","id":1337},{"track":"data","kind":"case","diff":"Hard","topic":"Forecasting","title":"Seasonal Forecast","prompt":"Last December you did 52,000 orders. Every other month last year averaged 31,000. This year is running 18% above last year.","parts":[{"t":"num","q":"Forecast for this December?","a":61360.0,"tol":0.01,"unit":""},{"t":"num","q":"December's seasonal index vs a normal month, to 2 decimals?","a":1.6774,"tol":0.02,"unit":""}],"skills":["Forecasting"],"mins":15,"work":true,"tag":"Retail","id":1338},{"track":"data","kind":"case","diff":"Medium","topic":"Experimentation","title":"Peeking at a Test","prompt":"A teammate checks an A/B test every day and stops it the first day p < 0.05. Over 20 checks, assume each check has a 5% false alarm chance if there's no real effect, treated as independent.","parts":[{"t":"num","q":"Chance of at least one false alarm over 20 checks, as a percent?","a":64.1514,"tol":0.02,"unit":"%"},{"t":"choice","q":"What should the team do instead?","opts":["Fix the sample size up front or use a sequential test","Check twice a day","Use a smaller sample"],"a":0}],"skills":["Experimentation","Statistics"],"mins":15,"work":true,"tag":"Analytics","id":1339},{"track":"data","kind":"case","diff":"Medium","topic":"Dashboards","title":"The Wrong Average","prompt":"Region A: 1,000 users, average spend $50. Region B: 9,000 users, average spend $20. A dashboard shows the average of the two averages.","parts":[{"t":"num","q":"What does the dashboard show?","a":35,"tol":0.01,"unit":"$"},{"t":"num","q":"True average spend per user?","a":23.0,"tol":0.01,"unit":"$"}],"skills":["Dashboards","SQL"],"mins":10,"work":true,"tag":"Analytics","id":1340},{"track":"product","kind":"case","diff":"Medium","topic":"Design","title":"Signup Form Fix","prompt":"A signup form asks 9 questions and 38% of starters finish. Removing optional questions in a test raised finishes to 55% with 4 questions.","parts":[{"t":"num","q":"Relative lift in finishes, as a percent?","a":44.7368,"tol":0.01,"unit":"%"},{"t":"choice","q":"Where do the removed questions go?","opts":["Ask later, when the answer helps the user","Delete them forever","Put them on a second page during signup"],"a":0}],"skills":["Interaction design","User research"],"mins":10,"work":true,"tag":"SaaS","id":1341},{"track":"product","kind":"case","diff":"Hard","topic":"Design","title":"Usability Test Readout","prompt":"You ran 8 usability sessions. 6 people couldn't find Export, 2 found it after 2 minutes. 5 people said the dashboard felt crowded.","parts":[{"t":"num","q":"Share who couldn't find Export, as a percent?","a":75,"tol":0.01,"unit":"%"},{"t":"choice","q":"What's the strongest finding to act on first?","opts":["Export is hard to find","People dislike blue","The logo is small"],"a":0},{"t":"choice","q":"Best fix to test?","opts":["Put Export where people looked for it and retest with 5 users","Add a tutorial video","Wait for more complaints"],"a":0}],"skills":["User research","Interaction design"],"mins":15,"work":true,"tag":"SaaS","id":1342},{"id":1401,"track":"product","kind":"case","diff":"Easy","topic":"Metrics","title":"Define Activation","prompt":"8,000 people signed up in March. 2,400 finished setup within 7 days. 1,800 of those also invited a teammate.","parts":[{"t":"num","q":"What share of signups activated (finished setup in 7 days), in %?","a":30,"tol":0.01,"unit":"%"},{"t":"num","q":"What share of activated users invited a teammate, in %?","a":75,"tol":0.01,"unit":"%"},{"t":"num","q":"What share of all signups invited a teammate, in %? (one decimal)","a":22.5,"tol":0.05,"unit":"%"}],"skills":["Metrics","Product analytics"],"mins":10,"work":true,"tag":"SaaS","how":"2,400 ÷ 8,000 = 30%. 1,800 ÷ 2,400 = 75%. 1,800 ÷ 8,000 = 22.5%."},{"id":1402,"track":"product","kind":"case","diff":"Medium","topic":"Retention","title":"Push a Feature to More Users","prompt":"You have 50,000 daily users. 6,000 of them use Collections each day. Day 30 retention is 40% for Collections users and 25% for everyone else. The team wants to show Collections to everyone and get usage to 30% of daily users.","parts":[{"t":"num","q":"What % of daily users use Collections today?","a":12,"tol":0.01,"unit":"%"},{"t":"num","q":"Blended day 30 retention today, in %? (one decimal)","a":26.8,"tol":0.05,"unit":"%"},{"t":"num","q":"Blended day 30 retention if 30% use it and both rates hold, in %? (one decimal)","a":29.5,"tol":0.05,"unit":"%"},{"t":"choice","q":"What's the biggest risk in this forecast?","opts":["Engaged people may pick Collections because they were already engaged, so forcing it may not lift retention","The math in the forecast is wrong","Retention can't be measured at day 30"],"a":0}],"skills":["Product analytics","Retention"],"mins":15,"work":true,"tag":"Consumer","how":"Today: 0.12 × 40 + 0.88 × 25 = 26.8%. Plan: 0.3 × 40 + 0.7 × 25 = 29.5%. The gap assumes the feature causes retention, which a correlation can't prove."},{"id":1403,"track":"product","kind":"case","diff":"Easy","topic":"Metrics","title":"Weekly Stickiness","prompt":"Your app has 120,000 weekly active users and 300,000 monthly active users.","parts":[{"t":"num","q":"WAU ÷ MAU, in %?","a":40,"tol":0.01,"unit":"%"},{"t":"num","q":"If MAU grows 20% and WAU stays flat, what is WAU ÷ MAU, in %? (one decimal)","a":33.3,"tol":0.05,"unit":"%"},{"t":"choice","q":"What does that change most likely mean?","opts":["New users are trying the app but not coming back weekly","The app got stickier","Weekly users are leaving"],"a":0}],"skills":["Metrics"],"mins":10,"work":true,"tag":"Consumer","how":"120k ÷ 300k = 40%. MAU becomes 360k, so 120k ÷ 360k = 33.3%."},{"id":1404,"track":"product","kind":"case","diff":"Medium","topic":"Prioritization","title":"Size a Feature Before Building It","prompt":"400,000 monthly users. 15% use Export. In a survey, 40% of Export users said they'd use Scheduled Exports. It will live on the Pro plan at $10 a month, and you expect 10% of interested users to upgrade.","parts":[{"t":"num","q":"How many users are interested in Scheduled Exports?","a":24000,"tol":0.01,"unit":""},{"t":"num","q":"How many upgrade to Pro?","a":2400,"tol":0.01,"unit":""},{"t":"num","q":"New annual revenue, in $?","a":288000,"tol":0.01,"unit":"$"}],"skills":["Prioritization","Monetization"],"mins":15,"work":true,"tag":"SaaS","how":"400,000 × 15% × 40% = 24,000 interested. 10% upgrade = 2,400. 2,400 × $10 × 12 = $288,000."},{"id":1405,"track":"product","kind":"case","diff":"Hard","topic":"Roadmapping","title":"Cost of Delay","prompt":"One team, two features. Feature A earns $50k a month once live and takes 2 months to build. Feature B earns $30k a month and takes 1 month. Revenue starts the month after a feature ships. Look at the first 6 months only.","parts":[{"t":"num","q":"Revenue in 6 months if you build A first, then B, in $ thousands?","a":290,"tol":0.01,"unit":"$k"},{"t":"num","q":"Revenue in 6 months if you build B first, then A, in $ thousands?","a":300,"tol":0.01,"unit":"$k"},{"t":"choice","q":"Which goes first?","opts":["B, it earns more per month of build time","A, it earns more per month once live","It doesn't matter"],"a":0}],"skills":["Roadmapping","Prioritization"],"mins":20,"work":true,"tag":"SaaS","how":"A then B: A earns months 3 to 6 (4 × 50 = 200), B earns months 4 to 6 (3 × 30 = 90), total 290. B then A: B earns months 2 to 6 (150), A earns months 4 to 6 (150), total 300. Value per build month: A 25, B 30."},{"id":1406,"track":"product","kind":"case","diff":"Easy","topic":"User research","title":"Compute NPS","prompt":"500 people answered your survey. 230 scored you 9 or 10. 170 scored 7 or 8. 100 scored 0 to 6.","parts":[{"t":"num","q":"What is your NPS?","a":26,"tol":0.01,"unit":""},{"t":"num","q":"If 50 detractors become passives, what is the new NPS?","a":36,"tol":0.01,"unit":""}],"skills":["User research","Metrics"],"mins":10,"work":true,"tag":"Consumer","how":"Promoters 46% minus detractors 20% = 26. Then detractors are 50 of 500 = 10%, so 46 minus 10 = 36."},{"id":1407,"track":"product","kind":"case","diff":"Medium","topic":"Experiments","title":"Clicks Up, Sales Down","prompt":"A new recommendation widget lifts clicks per session from 3.0 to 3.6. Checkout conversion drops from 4.0% to 3.8%. You get 200,000 sessions a week and the average order is $60.","parts":[{"t":"num","q":"Relative lift in clicks per session, in %?","a":20,"tol":0.01,"unit":"%"},{"t":"num","q":"Weekly revenue change, in $? (use a minus sign for a loss)","a":-24000,"tol":0.01,"unit":"$"},{"t":"choice","q":"Do you ship it?","opts":["No. Conversion is the guardrail and it costs revenue","Yes. Clicks went up 20%","Yes. A 0.2 point drop is noise by definition"],"a":0}],"skills":["A/B testing","Metrics"],"mins":15,"work":true,"tag":"E-commerce","how":"0.6 ÷ 3.0 = 20%. 200,000 × (3.8% − 4.0%) × $60 = −$24,000 a week."},{"id":1408,"track":"product","kind":"case","diff":"Hard","topic":"Experiments","title":"The Lift That Faded","prompt":"A new homepage test shows weekly lifts in engagement of 12%, 6%, 2% and 1% over four weeks.","parts":[{"t":"num","q":"Average lift across the four weeks, in %?","a":5.25,"tol":0.01,"unit":"%"},{"t":"choice","q":"What's most likely going on?","opts":["A novelty effect. People clicked because it was new","The test is broken","Users hate the new design"],"a":0},{"t":"choice","q":"Which lift should go into the annual forecast?","opts":["About 1%, where it settled","12%, the first week","5.25%, the average"],"a":0}],"skills":["A/B testing","Statistics"],"mins":20,"work":true,"tag":"Consumer","how":"(12 + 6 + 2 + 1) ÷ 4 = 5.25%. The decay points to novelty, so forecast with the steady state."},{"id":1409,"track":"product","kind":"case","diff":"Easy","topic":"Metrics","title":"Ticket Rate After a Help Center","prompt":"Last month 40,000 active users filed 2,000 support tickets. This month, after launching a help center, 50,000 active users filed 1,500 tickets.","parts":[{"t":"num","q":"Tickets per 1,000 users last month?","a":50,"tol":0.01,"unit":""},{"t":"num","q":"Tickets per 1,000 users this month?","a":30,"tol":0.01,"unit":""},{"t":"num","q":"Drop in the ticket rate, in %?","a":40,"tol":0.01,"unit":"%"}],"skills":["Metrics","Support"],"mins":10,"work":true,"tag":"SaaS","how":"2,000 ÷ 40 = 50 per 1,000. 1,500 ÷ 50 = 30 per 1,000. (50 − 30) ÷ 50 = 40%."},{"id":1410,"track":"product","kind":"case","diff":"Medium","topic":"Prioritization","title":"Payback on Engineering Time","prompt":"A self serve billing page takes 3 engineers 6 weeks. An engineer week costs $4,000 fully loaded. It should remove 600 support tickets a month, and each ticket costs $8 to handle. Your rule: projects must pay back within 12 months.","parts":[{"t":"num","q":"Cost of the project, in $?","a":72000,"tol":0.01,"unit":"$"},{"t":"num","q":"Monthly savings, in $?","a":4800,"tol":0.01,"unit":"$"},{"t":"num","q":"Payback period, in months?","a":15,"tol":0.01,"unit":"months"},{"t":"choice","q":"Does it pass your rule?","opts":["No","Yes"],"a":0}],"skills":["Prioritization","Financial modeling"],"mins":15,"work":true,"tag":"SaaS","how":"3 × 6 × $4,000 = $72,000. 600 × $8 = $4,800 a month. 72,000 ÷ 4,800 = 15 months."},{"id":1411,"track":"product","kind":"case","diff":"Hard","topic":"Marketplace","title":"Marketplace Liquidity","prompt":"Hosts posted 1,000 new listings this week. 650 got at least one booking. Booked listings averaged 2.4 bookings at $80 each, and you take 15%.","parts":[{"t":"num","q":"Listing liquidity, in %?","a":65,"tol":0.01,"unit":"%"},{"t":"num","q":"Total bookings?","a":1560,"tol":0.01,"unit":""},{"t":"num","q":"Your revenue from these bookings, in $?","a":18720,"tol":0.01,"unit":"$"}],"skills":["Metrics","Marketplaces"],"mins":20,"work":true,"tag":"Marketplace","how":"650 ÷ 1,000 = 65%. 650 × 2.4 = 1,560 bookings. 1,560 × $80 × 15% = $18,720."},{"id":1412,"track":"product","kind":"case","diff":"Medium","topic":"Funnels","title":"Zero Result Searches","prompt":"100,000 searches a week. 30% return zero results. When there are results, 45% of searches lead to a click, and 20% of clicks lead to a purchase.","parts":[{"t":"num","q":"Purchases from search per week?","a":6300,"tol":0.01,"unit":""},{"t":"num","q":"Purchases if zero result searches fall to 10%?","a":8100,"tol":0.01,"unit":""},{"t":"num","q":"Extra purchases per week?","a":1800,"tol":0.01,"unit":""}],"skills":["Funnels","Product analytics"],"mins":15,"work":true,"tag":"E-commerce","how":"100,000 × 70% × 45% × 20% = 6,300. With 90% having results: 8,100. Difference 1,800."},{"id":1413,"track":"product","kind":"case","diff":"Medium","topic":"Pricing","title":"Add a Top Tier","prompt":"10,000 paying customers: 70% on Basic at $10 and 30% on Pro at $25. You add Premium at $60. The mix shifts to 55% Basic, 38% Pro and 7% Premium.","parts":[{"t":"num","q":"Average revenue per customer before, in $?","a":14.5,"tol":0.01,"unit":"$"},{"t":"num","q":"Average revenue per customer after, in $?","a":19.2,"tol":0.01,"unit":"$"},{"t":"num","q":"Change in average revenue, in %? (one decimal)","a":32.4,"tol":0.05,"unit":"%"}],"skills":["Pricing","Monetization"],"mins":15,"work":true,"tag":"SaaS","how":"Before: 7 + 7.5 = $14.50. After: 5.5 + 9.5 + 4.2 = $19.20. 19.2 ÷ 14.5 = +32.4%. Premium also makes Pro look cheaper."},{"id":1414,"track":"product","kind":"case","diff":"Medium","topic":"Monetization","title":"Monthly or Annual","prompt":"Monthly plan: $20. Annual plan: $192 paid upfront. Monthly customers churn 5% a month. 70% of annual customers renew each year.","parts":[{"t":"num","q":"Discount on the annual plan vs 12 monthly payments, in %?","a":20,"tol":0.01,"unit":"%"},{"t":"num","q":"Expected lifetime revenue of a monthly customer, in $?","a":400,"tol":0.01,"unit":"$"},{"t":"num","q":"Expected lifetime revenue of an annual customer, in $?","a":640,"tol":0.01,"unit":"$"},{"t":"choice","q":"What should the pricing page push?","opts":["Annual","Monthly"],"a":0}],"skills":["Monetization","Pricing"],"mins":15,"work":true,"tag":"Subscription","how":"$192 vs $240 is 20% off. Monthly: $20 ÷ 5% = $400. Annual: $192 ÷ 30% churn = $640."},{"id":1415,"track":"product","kind":"case","diff":"Easy","topic":"User research","title":"Read a Survey Carefully","prompt":"You emailed a survey to 12,000 users and 4% answered. 35% of the people who answered asked for dark mode.","parts":[{"t":"num","q":"How many people answered?","a":480,"tol":0.01,"unit":""},{"t":"num","q":"How many asked for dark mode?","a":168,"tol":0.01,"unit":""},{"t":"choice","q":"Why be careful saying \"35% of users want dark mode\"?","opts":["People who answer surveys aren't a random sample of users","480 answers is too few to compute a percentage","Dark mode requests can't be counted"],"a":0}],"skills":["User research"],"mins":10,"work":true,"tag":"Consumer","how":"12,000 × 4% = 480. 480 × 35% = 168. Survey takers are self selected."},{"id":1416,"track":"product","kind":"case","diff":"Medium","topic":"Onboarding","title":"Time to First Value","prompt":"Users who build their first report within a day keep using the product at 60% after 3 months. Everyone else keeps at 30%. Today 25% build a report on day one. A new onboarding flow should raise that to 40%.","parts":[{"t":"num","q":"Blended 3 month retention today, in %? (one decimal)","a":37.5,"tol":0.05,"unit":"%"},{"t":"num","q":"Blended retention with the new flow, in %?","a":42,"tol":0.01,"unit":"%"},{"t":"num","q":"Gain, in percentage points? (one decimal)","a":4.5,"tol":0.05,"unit":"pts"}],"skills":["Onboarding","Retention"],"mins":15,"work":true,"tag":"SaaS","how":"Today: 0.25 × 60 + 0.75 × 30 = 37.5%. New: 0.4 × 60 + 0.6 × 30 = 42%. Gain 4.5 points."},{"id":1417,"track":"product","kind":"case","diff":"Easy","topic":"Launches","title":"Staged Rollout","prompt":"You have 2,000,000 users. A new feature is on for 5% of them. 0.4% of exposed users hit an error each day. Your on call team can handle 2,000 errors a day.","parts":[{"t":"num","q":"Users with the feature on?","a":100000,"tol":0.01,"unit":""},{"t":"num","q":"Errors per day right now?","a":400,"tol":0.01,"unit":""},{"t":"num","q":"Errors per day at 100% rollout, same rate?","a":8000,"tol":0.01,"unit":""},{"t":"choice","q":"What do you do?","opts":["Fix the error rate before rolling out further","Roll out to everyone now","Roll back and cancel the feature"],"a":0}],"skills":["Launches","Metrics"],"mins":10,"work":true,"tag":"Consumer","how":"5% of 2M = 100,000. × 0.4% = 400 a day. At 100%: 8,000 a day, 4× what on call can handle."},{"id":1418,"track":"product","kind":"case","diff":"Hard","topic":"Monetization","title":"Tighten the Free Plan","prompt":"500,000 free users, 2% pay $12 a month. Proposal: lower the free plan limits. You expect conversion to rise to 3%, but free signups to drop 20%.","parts":[{"t":"num","q":"MRR today, in $?","a":120000,"tol":0.01,"unit":"$"},{"t":"num","q":"MRR under the proposal, in $?","a":144000,"tol":0.01,"unit":"$"},{"t":"num","q":"Change in MRR, in $?","a":24000,"tol":0.01,"unit":"$"},{"t":"choice","q":"What's the biggest risk the numbers leave out?","opts":["Fewer free users means fewer referrals and less word of mouth later","Paid users will downgrade","MRR can't be forecast"],"a":0}],"skills":["Monetization","Pricing"],"mins":20,"work":true,"tag":"SaaS","how":"Today 10,000 payers × $12 = $120,000. New: 400,000 × 3% = 12,000 × $12 = $144,000. +$24,000."},{"id":1419,"track":"product","kind":"case","diff":"Medium","topic":"Metrics","title":"Build a Metric Tree","prompt":"Revenue = visitors × conversion rate × average order. Today: 1,000,000 visitors, 2.5% conversion, $80 average order. Next quarter you expect visitors +10%, conversion down 0.2 points, and average order +5%.","parts":[{"t":"num","q":"Revenue today, in $?","a":2000000,"tol":0.01,"unit":"$"},{"t":"num","q":"Revenue next quarter, in $?","a":2125200,"tol":0.01,"unit":"$"},{"t":"num","q":"Change, in %? (one decimal)","a":6.3,"tol":0.05,"unit":"%"}],"skills":["Metrics","Product analytics"],"mins":15,"work":true,"tag":"E-commerce","how":"1M × 2.5% × $80 = $2,000,000. 1.1M × 2.3% × $84 = $2,125,200. That's +6.3%."},{"id":1420,"track":"product","kind":"case","diff":"Easy","topic":"Retention","title":"Why People Leave","prompt":"You have 8,000 customers. 400 cancelled last month: 140 over price, 100 for a missing feature, 90 went to a competitor and 70 for other reasons.","parts":[{"t":"num","q":"Share who left over price, in %?","a":35,"tol":0.01,"unit":"%"},{"t":"num","q":"Monthly churn rate, in %?","a":5,"tol":0.01,"unit":"%"},{"t":"num","q":"Churn rate if you saved half the price churners, in %? (two decimals)","a":4.125,"tol":0.01,"unit":"%"}],"skills":["Retention","User research"],"mins":10,"work":true,"tag":"SaaS","how":"140 ÷ 400 = 35%. 400 ÷ 8,000 = 5%. Saving 70 leaves 330 ÷ 8,000 = 4.125%."},{"id":1421,"track":"product","kind":"case","diff":"Hard","topic":"Pricing","title":"Retire the Old Plan","prompt":"3,000 customers are on a legacy plan at $29 a month. You want to move them to the current plan at $39. You expect 15% of them to cancel when you do.","parts":[{"t":"num","q":"MRR from these customers today, in $?","a":87000,"tol":0.01,"unit":"$"},{"t":"num","q":"MRR after the move, in $?","a":99450,"tol":0.01,"unit":"$"},{"t":"num","q":"Change in MRR, in $?","a":12450,"tol":0.01,"unit":"$"},{"t":"num","q":"At what churn rate does the move break even, in %? (one decimal)","a":25.6,"tol":0.05,"unit":"%"}],"skills":["Pricing","Monetization"],"mins":20,"work":true,"tag":"SaaS","how":"Today $87,000. After: 2,550 × $39 = $99,450, so +$12,450. Break even when (1 − c) × 39 = 29, c = 25.6%."},{"id":1422,"track":"growth","kind":"case","diff":"Easy","topic":"Paid acquisition","title":"Is ROAS Enough?","prompt":"You spent $20,000 on ads and they drove $70,000 in sales. Your gross margin is 40%.","parts":[{"t":"num","q":"ROAS?","a":3.5,"tol":0.01,"unit":"x"},{"t":"num","q":"Gross profit from those sales, in $?","a":28000,"tol":0.01,"unit":"$"},{"t":"num","q":"Profit after ad spend, in $?","a":8000,"tol":0.01,"unit":"$"}],"skills":["Paid acquisition","Metrics"],"mins":10,"work":true,"tag":"E-commerce","how":"70,000 ÷ 20,000 = 3.5x. 40% of $70k = $28,000. Minus $20k = $8,000. ROAS alone hides margin."},{"id":1423,"track":"growth","kind":"case","diff":"Medium","topic":"Paid acquisition","title":"From CPM to CPA","prompt":"Your ads cost $12 per 1,000 impressions. 1.5% of impressions get a click. 4% of clicks become customers.","parts":[{"t":"num","q":"Cost per click, in $?","a":0.8,"tol":0.01,"unit":"$"},{"t":"num","q":"Cost per customer, in $?","a":20,"tol":0.01,"unit":"$"},{"t":"num","q":"Customers from a $30,000 budget?","a":1500,"tol":0.01,"unit":""}],"skills":["Paid acquisition"],"mins":15,"work":true,"tag":"Consumer","how":"1,000 impressions give 15 clicks, so $12 ÷ 15 = $0.80. $0.80 ÷ 4% = $20. $30,000 ÷ $20 = 1,500."},{"id":1424,"track":"growth","kind":"case","diff":"Medium","topic":"Paid acquisition","title":"Break Even CAC","prompt":"Average order is $70 at a 50% gross margin. Customers place 1.6 orders in their first year. Your current cost to acquire a customer is $45.","parts":[{"t":"num","q":"First year gross profit per customer, in $?","a":56,"tol":0.01,"unit":"$"},{"t":"num","q":"Highest CAC that breaks even in year one, in $?","a":56,"tol":0.01,"unit":"$"},{"t":"num","q":"First year profit per customer at today's CAC, in $?","a":11,"tol":0.01,"unit":"$"}],"skills":["Paid acquisition","Unit economics"],"mins":15,"work":true,"tag":"E-commerce","how":"$70 × 50% × 1.6 = $56. Break even CAC is $56. At $45 you make $11 per customer."},{"id":1425,"track":"growth","kind":"case","diff":"Hard","topic":"Attribution","title":"What Ads Really Drove","prompt":"You ran a geo holdout. Regions with ads got 10,000 conversions. Matched regions without ads got 8,500. The ad platform reported 4,000 conversions. You spent $60,000.","parts":[{"t":"num","q":"Incremental conversions from ads?","a":1500,"tol":0.01,"unit":""},{"t":"num","q":"Incremental share of what the platform reported, in %?","a":37.5,"tol":0.05,"unit":"%"},{"t":"num","q":"CPA reported by the platform, in $?","a":15,"tol":0.01,"unit":"$"},{"t":"num","q":"True incremental CPA, in $?","a":40,"tol":0.01,"unit":"$"}],"skills":["Attribution","Experiments"],"mins":20,"work":true,"tag":"Consumer","how":"10,000 − 8,500 = 1,500. 1,500 ÷ 4,000 = 37.5%. $60k ÷ 4,000 = $15 vs $60k ÷ 1,500 = $40."},{"id":1426,"track":"growth","kind":"case","diff":"Medium","topic":"Referral","title":"Price a Referral Program","prompt":"20,000 customers. 10% refer someone. Each referrer brings 1.5 signups on average and 40% of those become customers. Both the referrer and the new customer get $20 for each new customer.","parts":[{"t":"num","q":"New customers from referrals?","a":1200,"tol":0.01,"unit":""},{"t":"num","q":"Total reward cost, in $?","a":48000,"tol":0.01,"unit":"$"},{"t":"num","q":"Cost per new customer, in $?","a":40,"tol":0.01,"unit":"$"}],"skills":["Referral","Unit economics"],"mins":15,"work":true,"tag":"Consumer","how":"20,000 × 10% × 1.5 × 40% = 1,200. Each costs $20 + $20 = $40, total $48,000."},{"id":1427,"track":"growth","kind":"case","diff":"Hard","topic":"Virality","title":"The Viral Ceiling","prompt":"Each new user sends 4 invites and 20% are accepted. You seed the product with 1,000 users and nobody else joins on their own.","parts":[{"t":"num","q":"Viral coefficient k?","a":0.8,"tol":0.01,"unit":""},{"t":"num","q":"Total users once invites run out?","a":5000,"tol":0.01,"unit":""},{"t":"num","q":"k if acceptance rises to 25%?","a":1,"tol":0.01,"unit":""},{"t":"choice","q":"What happens at that k?","opts":["Each cohort replaces itself, so growth no longer dies out on its own","Growth stops","You lose users every cycle"],"a":0}],"skills":["Virality","Product analytics"],"mins":20,"work":true,"tag":"Consumer","how":"k = 4 × 20% = 0.8. Total = 1,000 ÷ (1 − 0.8) = 5,000. At 25%, k = 1."},{"id":1428,"track":"growth","kind":"case","diff":"Easy","topic":"Lifecycle","title":"Email List Decay","prompt":"Your email list has 50,000 people. Each month 2% unsubscribe or bounce, and you add nobody new.","parts":[{"t":"num","q":"List size after 1 month?","a":49000,"tol":0.01,"unit":""},{"t":"num","q":"List size after 12 months? (nearest whole)","a":39236,"tol":1,"unit":""}],"skills":["Lifecycle","Email"],"mins":10,"work":true,"tag":"Consumer","how":"50,000 × 0.98 = 49,000. 50,000 × 0.98^12 ≈ 39,236."},{"id":1429,"track":"growth","kind":"case","diff":"Easy","topic":"Email","title":"Opens and Clicks","prompt":"You sent an email to 40,000 people. 25% opened it. 3% of all recipients clicked.","parts":[{"t":"num","q":"Opens?","a":10000,"tol":0.01,"unit":""},{"t":"num","q":"Clicks?","a":1200,"tol":0.01,"unit":""},{"t":"num","q":"Click to open rate, in %?","a":12,"tol":0.01,"unit":"%"}],"skills":["Email","Lifecycle"],"mins":10,"work":true,"tag":"Consumer","how":"10,000 opens. 1,200 clicks. 1,200 ÷ 10,000 = 12%."},{"id":1430,"track":"growth","kind":"case","diff":"Medium","topic":"Lifecycle","title":"How Many Pushes","prompt":"100,000 users have push on. At 3 pushes a week, 8% turn push off within a month. At 6 a week, 20% do. Each push gets 2% of recipients to open the app.","parts":[{"t":"num","q":"Weekly sessions from push after a month at 3 a week?","a":5520,"tol":0.01,"unit":""},{"t":"num","q":"Weekly sessions from push after a month at 6 a week?","a":9600,"tol":0.01,"unit":""},{"t":"choice","q":"Before switching to 6, what must you check?","opts":["Whether people who turned off push also stopped using the app","The push font size","Nothing, 6 is clearly better"],"a":0}],"skills":["Lifecycle","Retention"],"mins":15,"work":true,"tag":"Consumer","how":"3/week: 92,000 × 3 × 2% = 5,520. 6/week: 80,000 × 6 × 2% = 9,600. Short term wins can hide long term churn."},{"id":1431,"track":"growth","kind":"case","diff":"Medium","topic":"SEO","title":"Worth Ranking First","prompt":"A keyword gets 40,000 searches a month. Position 3 gets 10% of clicks and position 1 gets 30%. 3% of visitors sign up and each signup is worth $50.","parts":[{"t":"num","q":"Monthly visitors at position 3?","a":4000,"tol":0.01,"unit":""},{"t":"num","q":"Monthly visitors at position 1?","a":12000,"tol":0.01,"unit":""},{"t":"num","q":"Extra monthly value of moving to position 1, in $?","a":12000,"tol":0.01,"unit":"$"}],"skills":["SEO","Content"],"mins":15,"work":true,"tag":"SaaS","how":"4,000 vs 12,000. 8,000 extra × 3% × $50 = $12,000 a month."},{"id":1432,"track":"growth","kind":"case","diff":"Hard","topic":"Content","title":"When Does a Blog Post Pay Off","prompt":"A post costs $1,500 to write. It gets no traffic for its first 3 months, then 2,000 visits a month. 1% of visitors convert at $30 of profit each.","parts":[{"t":"num","q":"Monthly profit once it ranks, in $?","a":600,"tol":0.01,"unit":"$"},{"t":"num","q":"In which month does total profit first cover the cost?","a":6,"tol":0.01,"unit":"month"}],"skills":["Content","SEO"],"mins":20,"work":true,"tag":"SaaS","how":"2,000 × 1% × $30 = $600 a month from month 4. Months 4, 5, 6 bring $1,800, so month 6."},{"id":1433,"track":"growth","kind":"case","diff":"Medium","topic":"Experiments","title":"Landing Page Test","prompt":"Control: 10,000 visitors, 400 signups. Variant: 10,000 visitors, 460 signups. You get 150,000 visitors a month.","parts":[{"t":"num","q":"Variant conversion rate, in %?","a":4.6,"tol":0.05,"unit":"%"},{"t":"num","q":"Relative lift, in %?","a":15,"tol":0.01,"unit":"%"},{"t":"num","q":"Extra signups per month if the lift holds?","a":900,"tol":0.01,"unit":""}],"skills":["A/B testing","Conversion"],"mins":15,"work":true,"tag":"SaaS","how":"460 ÷ 10,000 = 4.6% vs 4.0%. 0.6 ÷ 4 = 15% lift. 150,000 × 0.6 points = 900."},{"id":1434,"track":"growth","kind":"case","diff":"Medium","topic":"Forecasting","title":"September to November","prompt":"Last year: 10,000 signups in September and 15,000 in November. This September you got 12,000.","parts":[{"t":"num","q":"Year over year growth in September, in %?","a":20,"tol":0.01,"unit":"%"},{"t":"num","q":"November forecast if the seasonal pattern repeats?","a":18000,"tol":0.01,"unit":""}],"skills":["Forecasting"],"mins":15,"work":true,"tag":"E-commerce","how":"12,000 ÷ 10,000 = +20%. November was 1.5× September, so 12,000 × 1.5 = 18,000."},{"id":1435,"track":"growth","kind":"case","diff":"Hard","topic":"Retention","title":"LTV From a Retention Curve","prompt":"A $10 a month app. Share of a cohort still paying: month 1 100%, month 2 60%, month 3 50%, and 45% every month after that through month 12. Gross margin is 80%.","parts":[{"t":"num","q":"Revenue per starting user in 12 months, in $?","a":61.5,"tol":0.01,"unit":"$"},{"t":"num","q":"Gross profit per starting user in 12 months, in $?","a":49.2,"tol":0.01,"unit":"$"},{"t":"choice","q":"Your CAC is $55. Do you pay it back within 12 months?","opts":["Yes","No"],"a":1}],"skills":["Retention","Unit economics"],"mins":20,"work":true,"tag":"Subscription","how":"10 × (1 + 0.6 + 0.5 + 9 × 0.45) = $61.50. × 80% = $49.20, less than $55."},{"id":1436,"track":"growth","kind":"case","diff":"Medium","topic":"Budgeting","title":"Split the Budget","prompt":"You have $100,000. Search costs $50 per customer but tops out at 800 customers. Social costs $80 per customer with no cap.","parts":[{"t":"num","q":"Spend on search to reach its cap, in $?","a":40000,"tol":0.01,"unit":"$"},{"t":"num","q":"Total customers if the rest goes to social?","a":1550,"tol":0.01,"unit":""},{"t":"num","q":"Blended cost per customer, in $? (two decimals)","a":64.52,"tol":0.01,"unit":"$"}],"skills":["Budgeting","Paid acquisition"],"mins":15,"work":true,"tag":"SaaS","how":"Search: 800 × $50 = $40,000. Social: $60,000 ÷ $80 = 750. Total 1,550. $100k ÷ 1,550 = $64.52."},{"id":1437,"track":"growth","kind":"case","diff":"Easy","topic":"Sales","title":"Win Rate","prompt":"Last quarter you had 200 qualified opportunities and won 50. Average deal is $12,000.","parts":[{"t":"num","q":"Win rate, in %?","a":25,"tol":0.01,"unit":"%"},{"t":"num","q":"Revenue won, in $?","a":600000,"tol":0.01,"unit":"$"},{"t":"num","q":"Qualified opportunities needed to win $900,000 next quarter?","a":300,"tol":0.01,"unit":""}],"skills":["Sales","Pipeline"],"mins":10,"work":true,"tag":"B2B","how":"50 ÷ 200 = 25%. 50 × $12k = $600k. $900k ÷ $12k = 75 deals ÷ 25% = 300."},{"id":1438,"track":"growth","kind":"case","diff":"Medium","topic":"Sales","title":"How Many SDRs","prompt":"You need 30 closed deals a quarter. 20% of opportunities close. 40% of first meetings become opportunities. Each SDR books 25 first meetings a quarter.","parts":[{"t":"num","q":"Opportunities needed?","a":150,"tol":0.01,"unit":""},{"t":"num","q":"First meetings needed?","a":375,"tol":0.01,"unit":""},{"t":"num","q":"SDRs needed?","a":15,"tol":0.01,"unit":""}],"skills":["Sales","Pipeline"],"mins":15,"work":true,"tag":"B2B","how":"30 ÷ 20% = 150. 150 ÷ 40% = 375. 375 ÷ 25 = 15."},{"id":1439,"track":"growth","kind":"case","diff":"Medium","topic":"Revenue","title":"Seat Expansion","prompt":"400 accounts average 10 seats at $15 a seat per month. This quarter 25% of accounts added 4 seats each.","parts":[{"t":"num","q":"MRR before, in $?","a":60000,"tol":0.01,"unit":"$"},{"t":"num","q":"MRR added, in $?","a":6000,"tol":0.01,"unit":"$"},{"t":"num","q":"MRR growth from expansion, in %?","a":10,"tol":0.01,"unit":"%"}],"skills":["Revenue operations","Metrics"],"mins":15,"work":true,"tag":"B2B","how":"400 × 10 × $15 = $60,000. 100 accounts × 4 × $15 = $6,000. That's +10%."},{"id":1440,"track":"growth","kind":"case","diff":"Hard","topic":"Experiments","title":"Longer Free Trial","prompt":"10,000 people start a 14 day trial and 12% convert. A test with a 30 day trial converts 14%, but each trial costs $3 more in support and servers. A paying customer is worth $300 over their lifetime.","parts":[{"t":"num","q":"Extra paying customers from the 30 day trial, per 10,000 trials?","a":200,"tol":0.01,"unit":""},{"t":"num","q":"Extra cost of the longer trials, in $?","a":30000,"tol":0.01,"unit":"$"},{"t":"num","q":"Net gain from switching, in $?","a":30000,"tol":0.01,"unit":"$"}],"skills":["A/B testing","Unit economics"],"mins":20,"work":true,"tag":"SaaS","how":"14% − 12% = 2 points = 200 customers × $300 = $60,000, minus $30,000 = +$30,000."},{"id":1441,"track":"growth","kind":"case","diff":"Medium","topic":"Partnerships","title":"Affiliate or Paid Ads","prompt":"Affiliates earn 30% of a customer's first year revenue. The plan is $20 a month and the average customer pays for 8 months in year one. Your paid ads CAC is $70.","parts":[{"t":"num","q":"First year revenue per customer, in $?","a":160,"tol":0.01,"unit":"$"},{"t":"num","q":"Affiliate payout per customer, in $?","a":48,"tol":0.01,"unit":"$"},{"t":"num","q":"How much cheaper is an affiliate customer than a paid one, in $?","a":22,"tol":0.01,"unit":"$"}],"skills":["Partnerships","Unit economics"],"mins":15,"work":true,"tag":"SaaS","how":"$20 × 8 = $160. 30% = $48. $70 − $48 = $22."},{"id":1442,"track":"growth","kind":"case","diff":"Easy","topic":"Brand","title":"Price an Influencer Video","prompt":"A creator charges $8,000 for one video. You expect 200,000 views. 1% of viewers click and 5% of clickers buy a $40 product with a 50% margin.","parts":[{"t":"num","q":"Buyers?","a":100,"tol":0.01,"unit":""},{"t":"num","q":"Gross profit from them, in $?","a":2000,"tol":0.01,"unit":"$"},{"t":"num","q":"Net result after the fee, in $?","a":-6000,"tol":0.01,"unit":"$"},{"t":"choice","q":"What would make this worth it?","opts":["Buyers coming back to buy again, or much higher views","Nothing ever","A longer video"],"a":0}],"skills":["Marketing","Unit economics"],"mins":10,"work":true,"tag":"Consumer","how":"200k × 1% × 5% = 100 buyers × $20 = $2,000. Minus $8,000 = −$6,000."},{"id":1443,"track":"growth","kind":"case","diff":"Medium","topic":"Promotions","title":"The Leaked Promo Code","prompt":"A 25% off code meant for newsletter readers ended up on a coupon site. 6,000 orders used it, with an $80 average order. You think 70% of those buyers would have paid full price anyway.","parts":[{"t":"num","q":"Total discount given, in $?","a":120000,"tol":0.01,"unit":"$"},{"t":"num","q":"Discount given to people who'd have paid full price, in $?","a":84000,"tol":0.01,"unit":"$"}],"skills":["Promotions","Pricing"],"mins":15,"work":true,"tag":"E-commerce","how":"6,000 × $80 × 25% = $120,000. 70% of that = $84,000 of pure margin lost."},{"id":1444,"track":"growth","kind":"case","diff":"Medium","topic":"Conversion","title":"Pricing Page Redesign","prompt":"60,000 people visit your pricing page a month. 2% start a trial and 25% of trials pay $40 a month. A redesign lifts trial starts to 2.5%.","parts":[{"t":"num","q":"Paid customers a month today?","a":300,"tol":0.01,"unit":""},{"t":"num","q":"Paid customers a month after?","a":375,"tol":0.01,"unit":""},{"t":"num","q":"Extra MRR added each month, in $?","a":3000,"tol":0.01,"unit":"$"}],"skills":["Conversion","A/B testing"],"mins":15,"work":true,"tag":"SaaS","how":"60k × 2% × 25% = 300. At 2.5%: 375. 75 × $40 = $3,000."},{"id":1445,"track":"growth","kind":"case","diff":"Easy","topic":"Retention","title":"Where the Curve Flattens","prompt":"Of 10,000 installs, the share still active is: day 1 40%, day 7 20%, day 30 15%, day 60 14%, day 90 14%.","parts":[{"t":"num","q":"Users still active at day 90?","a":1400,"tol":0.01,"unit":""},{"t":"num","q":"Share of day 7 users who make it to day 90, in %?","a":70,"tol":0.01,"unit":"%"},{"t":"choice","q":"Where does the curve flatten?","opts":["Around day 60","Day 1","It never does"],"a":0}],"skills":["Retention","Product analytics"],"mins":10,"work":true,"tag":"Consumer","how":"10,000 × 14% = 1,400. 14 ÷ 20 = 70%. It stops falling after day 60."},{"id":1446,"track":"growth","kind":"case","diff":"Medium","topic":"Lifecycle","title":"Win Back Dormant Users","prompt":"30,000 dormant users. A win back campaign costs $0.05 per email. 2% come back, and each is worth $25.","parts":[{"t":"num","q":"Campaign cost, in $?","a":1500,"tol":0.01,"unit":"$"},{"t":"num","q":"Revenue from returning users, in $?","a":15000,"tol":0.01,"unit":"$"},{"t":"num","q":"ROI, in %? ((revenue − cost) ÷ cost)","a":900,"tol":0.01,"unit":"%"}],"skills":["Lifecycle","Email"],"mins":15,"work":true,"tag":"Consumer","how":"$1,500 cost. 600 users × $25 = $15,000. (15,000 − 1,500) ÷ 1,500 = 900%."},{"id":1447,"track":"growth","kind":"case","diff":"Hard","topic":"Analytics","title":"Conversion Fell, Nothing Broke","prompt":"Desktop is 40% of traffic and converts at 5%. Mobile is 60% and converts at 2%. Next month mobile grows to 75% of traffic, and both rates stay the same.","parts":[{"t":"num","q":"Blended conversion now, in %? (one decimal)","a":3.2,"tol":0.05,"unit":"%"},{"t":"num","q":"Blended conversion next month, in %? (two decimals)","a":2.75,"tol":0.01,"unit":"%"},{"t":"choice","q":"What explains the drop?","opts":["The traffic mix moved toward mobile","Mobile conversion broke","Desktop conversion broke"],"a":0}],"skills":["Analytics","Conversion"],"mins":20,"work":true,"tag":"E-commerce","how":"0.4 × 5 + 0.6 × 2 = 3.2%. 0.25 × 5 + 0.75 × 2 = 2.75%. A mix shift, not a bug."},{"id":1448,"track":"growth","kind":"case","diff":"Medium","topic":"Sales","title":"Use the Lead Score","prompt":"1,000 leads. The top 20% by lead score convert at 15%. The rest convert at 3%. Sales can call only 300 leads this month.","parts":[{"t":"num","q":"Conversions if sales calls all 200 top leads plus 100 others?","a":33,"tol":0.01,"unit":""},{"t":"num","q":"Conversions if sales calls 300 leads at random? (one decimal)","a":16.2,"tol":0.05,"unit":""}],"skills":["Sales","Analytics"],"mins":15,"work":true,"tag":"B2B","how":"Scored: 30 + 3 = 33. Random: overall rate is (30 + 24) ÷ 1,000 = 5.4%, × 300 = 16.2."},{"id":1449,"track":"growth","kind":"case","diff":"Medium","topic":"Finance","title":"Cash From Annual Plans","prompt":"You add 100 customers a month at $50 a month. 30% pick annual billing at 15% off, paid upfront.","parts":[{"t":"num","q":"Cash collected in month one from monthly payers, in $?","a":3500,"tol":0.01,"unit":"$"},{"t":"num","q":"Cash collected in month one from annual payers, in $?","a":15300,"tol":0.01,"unit":"$"},{"t":"num","q":"Total cash in month one, in $?","a":18800,"tol":0.01,"unit":"$"}],"skills":["Finance","Pricing"],"mins":15,"work":true,"tag":"SaaS","how":"70 × $50 = $3,500. 30 × $600 × 85% = $15,300. Total $18,800."},{"id":1450,"track":"growth","kind":"case","diff":"Easy","topic":"Sizing","title":"How Much Market Is Left","prompt":"There are 2,000,000 small businesses in your market. You have 8,000 customers.","parts":[{"t":"num","q":"Market share today, in %? (one decimal)","a":0.4,"tol":0.05,"unit":"%"},{"t":"num","q":"Customers needed for 2% share?","a":40000,"tol":0.01,"unit":""},{"t":"num","q":"New customers needed to get there?","a":32000,"tol":0.01,"unit":""}],"skills":["Market sizing"],"mins":10,"work":true,"tag":"B2B","how":"8,000 ÷ 2M = 0.4%. 2% = 40,000. Need 32,000 more."},{"id":1451,"track":"ops","kind":"case","diff":"Easy","topic":"Capacity","title":"Agent Utilization","prompt":"12 support agents each work 8 hours. Today they handled 240 tickets at 18 minutes each.","parts":[{"t":"num","q":"Hours available?","a":96,"tol":0.01,"unit":"hours"},{"t":"num","q":"Hours spent on tickets?","a":72,"tol":0.01,"unit":"hours"},{"t":"num","q":"Utilization, in %?","a":75,"tol":0.01,"unit":"%"}],"skills":["Operations","Capacity planning"],"mins":10,"work":true,"tag":"Operations","how":"12 × 8 = 96. 240 × 18 ÷ 60 = 72. 72 ÷ 96 = 75%."},{"id":1452,"track":"ops","kind":"case","diff":"Medium","topic":"Operations","title":"Missed SLAs","prompt":"You get 1,200 tickets a week. 8% miss the 24 hour response target. Leadership wants that under 3%.","parts":[{"t":"num","q":"Tickets missing the target each week?","a":96,"tol":0.01,"unit":""},{"t":"num","q":"Most misses allowed at 3%?","a":36,"tol":0.01,"unit":""},{"t":"num","q":"Weekly misses you need to eliminate?","a":60,"tol":0.01,"unit":""}],"skills":["Operations","Process design"],"mins":15,"work":true,"tag":"Operations","how":"8% of 1,200 = 96. 3% = 36. Cut 60."},{"id":1453,"track":"ops","kind":"case","diff":"Medium","topic":"Queues","title":"Staff the Phone Line","prompt":"90 calls arrive per hour and each takes 6 minutes. You want agents busy 75% of the time so the queue doesn't explode.","parts":[{"t":"num","q":"Agent hours of work arriving per hour?","a":9,"tol":0.01,"unit":"hours"},{"t":"num","q":"Agents needed?","a":12,"tol":0.01,"unit":""}],"skills":["Capacity planning","Operations"],"mins":15,"work":true,"tag":"Operations","how":"90 × 6 ÷ 60 = 9 hours of work per hour. 9 ÷ 75% = 12 agents."},{"id":1454,"track":"ops","kind":"case","diff":"Medium","topic":"Quality","title":"Rolled Throughput Yield","prompt":"A product goes through three steps with first pass yields of 98%, 95% and 97%. You start 10,000 units.","parts":[{"t":"num","q":"Rolled throughput yield, in %? (one decimal)","a":90.3,"tol":0.05,"unit":"%"},{"t":"num","q":"Units that make it through with no rework? (nearest whole)","a":9031,"tol":1,"unit":""}],"skills":["Quality","Operations"],"mins":15,"work":true,"tag":"Manufacturing","how":"0.98 × 0.95 × 0.97 = 90.3%. 10,000 × 0.90307 ≈ 9,031."},{"id":1455,"track":"ops","kind":"case","diff":"Easy","topic":"Quality","title":"Cost of Defects","prompt":"You make 50,000 units and 2% are defective. 30% of defects reach customers and cost $60 each in returns. The rest are caught and reworked for $12 each.","parts":[{"t":"num","q":"Defective units?","a":1000,"tol":0.01,"unit":""},{"t":"num","q":"Return cost, in $?","a":18000,"tol":0.01,"unit":"$"},{"t":"num","q":"Total defect cost, in $?","a":26400,"tol":0.01,"unit":"$"}],"skills":["Quality","Financial modeling"],"mins":10,"work":true,"tag":"Manufacturing","how":"1,000 defects. 300 × $60 = $18,000. 700 × $12 = $8,400. Total $26,400."},{"id":1456,"track":"ops","kind":"case","diff":"Hard","topic":"Inventory","title":"Safety Stock","prompt":"Daily demand averages 200 units with a standard deviation of 40. Lead time is 9 days. You want a 95% service level (z = 1.65).","parts":[{"t":"num","q":"Safety stock, in units?","a":198,"tol":0.01,"unit":"units"},{"t":"num","q":"Reorder point, in units?","a":1998,"tol":0.01,"unit":"units"}],"skills":["Supply chain","Inventory"],"mins":20,"work":true,"tag":"Retail","how":"1.65 × 40 × √9 = 198. Reorder point = 200 × 9 + 198 = 1,998."},{"id":1457,"track":"ops","kind":"case","diff":"Easy","topic":"Manufacturing","title":"Takt Time","prompt":"A shift has 450 working minutes. Customers need 900 units per shift. Your line finishes a unit every 36 seconds.","parts":[{"t":"num","q":"Takt time, in seconds?","a":30,"tol":0.01,"unit":"seconds"},{"t":"num","q":"Units your line makes per shift?","a":750,"tol":0.01,"unit":""},{"t":"choice","q":"Can the line keep up?","opts":["No","Yes"],"a":0}],"skills":["Operations","Process design"],"mins":10,"work":true,"tag":"Manufacturing","how":"27,000 seconds ÷ 900 = 30 seconds. 27,000 ÷ 36 = 750 units, short of 900."},{"id":1458,"track":"ops","kind":"case","diff":"Medium","topic":"Process","title":"Find the Bottleneck","prompt":"An order goes through four steps. Hourly capacity: Pick 120, Pack 90, Label 150, Load 110.","parts":[{"t":"num","q":"Orders per hour the line can ship?","a":90,"tol":0.01,"unit":""},{"t":"num","q":"Orders per hour if you double Pack capacity?","a":110,"tol":0.01,"unit":""},{"t":"choice","q":"Which step is the bottleneck after that?","opts":["Load","Pick","Label","Pack"],"a":0}],"skills":["Process design","Operations"],"mins":15,"work":true,"tag":"Logistics","how":"The slowest step sets the pace: 90. Pack goes to 180, so Load at 110 becomes the limit."},{"id":1459,"track":"ops","kind":"case","diff":"Medium","topic":"Manufacturing","title":"OEE","prompt":"A machine is available 90% of planned time, runs at 85% of its ideal speed and 98% of output is good.","parts":[{"t":"num","q":"OEE, in %? (one decimal)","a":75,"tol":0.01,"unit":"%"},{"t":"choice","q":"Which lever has the most room to improve?","opts":["Performance (speed)","Quality","Availability"],"a":0}],"skills":["Operations","Quality"],"mins":15,"work":true,"tag":"Manufacturing","how":"0.90 × 0.85 × 0.98 = 75.0%. Speed is the furthest from 100%."},{"id":1460,"track":"ops","kind":"case","diff":"Medium","topic":"Logistics","title":"Denser Delivery Routes","prompt":"Each van costs $480 a day. Today 20 vans make 120 stops each. Better routing would let a van make 150 stops a day. Volume stays the same and you run 22 days a month.","parts":[{"t":"num","q":"Cost per stop today, in $?","a":4,"tol":0.01,"unit":"$"},{"t":"num","q":"Cost per stop with better routing, in $?","a":3.2,"tol":0.01,"unit":"$"},{"t":"num","q":"Vans needed for the same volume?","a":16,"tol":0.01,"unit":""},{"t":"num","q":"Monthly savings, in $?","a":42240,"tol":0.01,"unit":"$"}],"skills":["Operations","Logistics"],"mins":15,"work":true,"tag":"Logistics","how":"$480 ÷ 120 = $4. ÷ 150 = $3.20. 2,400 stops ÷ 150 = 16 vans. 4 fewer × $480 × 22 = $42,240."},{"id":1461,"track":"ops","kind":"case","diff":"Medium","topic":"Planning","title":"Forecast Accuracy","prompt":"Actual demand for four weeks: 100, 120, 80, 100. Your forecast: 90, 130, 100, 100.","parts":[{"t":"num","q":"MAPE, in %? (two decimals)","a":10.83,"tol":0.01,"unit":"%"},{"t":"num","q":"Total forecast bias, in %? (forecast total vs actual total)","a":5,"tol":0.01,"unit":"%"},{"t":"choice","q":"What does the bias mean?","opts":["You forecast too high overall","You forecast too low overall","There's no bias"],"a":0}],"skills":["Forecasting","Operations"],"mins":15,"work":true,"tag":"Retail","how":"Errors: 10%, 8.33%, 25%, 0%. Average 10.83%. 420 vs 400 = +5% over."},{"id":1462,"track":"ops","kind":"case","diff":"Medium","topic":"Finance","title":"Days of Inventory","prompt":"Annual cost of goods sold is $7,300,000. Average inventory is $1,000,000.","parts":[{"t":"num","q":"Inventory turns per year?","a":7.3,"tol":0.01,"unit":""},{"t":"num","q":"Days inventory outstanding?","a":50,"tol":0.01,"unit":"days"}],"skills":["Accounting","Operations"],"mins":15,"work":true,"tag":"Retail","how":"7.3M ÷ 1M = 7.3 turns. 365 ÷ 7.3 = 50 days."},{"id":1463,"track":"ops","kind":"case","diff":"Hard","topic":"Finance","title":"Cash Conversion Cycle","prompt":"Days inventory: 50. Days sales outstanding: 40. Days payable: 30. Annual cost of goods sold is $7,300,000.","parts":[{"t":"num","q":"Cash conversion cycle, in days?","a":60,"tol":0.01,"unit":"days"},{"t":"num","q":"Cycle if you get suppliers to 45 days payable?","a":45,"tol":0.01,"unit":"days"},{"t":"num","q":"Cash freed up by that change, in $?","a":300000,"tol":0.01,"unit":"$"}],"skills":["FP&A","Accounting"],"mins":20,"work":true,"tag":"Retail","how":"50 + 40 − 30 = 60. With 45 payable: 45. $7.3M ÷ 365 = $20,000 a day × 15 days = $300,000."},{"id":1464,"track":"ops","kind":"case","diff":"Easy","topic":"FP&A","title":"Budget Variance","prompt":"Marketing budgeted $250,000 for the quarter and spent $280,000.","parts":[{"t":"num","q":"Variance, in $?","a":30000,"tol":0.01,"unit":"$"},{"t":"num","q":"Variance, in % of budget?","a":12,"tol":0.01,"unit":"%"},{"t":"choice","q":"Is it favorable or unfavorable?","opts":["Unfavorable","Favorable"],"a":0}],"skills":["FP&A"],"mins":10,"work":true,"tag":"Finance","how":"280k − 250k = $30k over. 30 ÷ 250 = 12%."},{"id":1465,"track":"ops","kind":"case","diff":"Medium","topic":"FP&A","title":"Plan the Hiring Budget","prompt":"You'll hire 10 people at $120,000 salary each, all starting April 1. Benefits and taxes add 25%. Your fiscal year is the calendar year.","parts":[{"t":"num","q":"Fully loaded annual cost per hire, in $?","a":150000,"tol":0.01,"unit":"$"},{"t":"num","q":"Cost for all 10 this fiscal year, in $?","a":1125000,"tol":0.01,"unit":"$"}],"skills":["FP&A","Financial modeling"],"mins":15,"work":true,"tag":"Finance","how":"$120k × 1.25 = $150k. April to December is 9 months: 10 × $150k × 9/12 = $1,125,000."},{"id":1466,"track":"ops","kind":"case","diff":"Hard","topic":"Finance","title":"Lease or Buy","prompt":"Buying a machine costs $100,000 today. It lasts 5 years with no resale value. Leasing costs $24,000 a year, paid at the end of each year for 5 years. Your discount rate is 8%.","parts":[{"t":"num","q":"Total lease payments, in $?","a":120000,"tol":0.01,"unit":"$"},{"t":"num","q":"Present value of the lease payments, in $? (nearest dollar)","a":95825,"tol":5,"unit":"$"},{"t":"choice","q":"Which is cheaper in today's dollars?","opts":["Lease","Buy"],"a":0}],"skills":["Valuation","Financial modeling"],"mins":20,"work":true,"tag":"Finance","how":"PV = 24,000 × (1 − 1.08^−5) ÷ 0.08 ≈ $95,825, less than $100,000."},{"id":1467,"track":"ops","kind":"case","diff":"Medium","topic":"Finance","title":"Gross Margin Bridge","prompt":"Revenue is $2,000,000 and cost of goods is $1,200,000. Next year you raise prices 5% (same volume) and cost of goods rises 3%.","parts":[{"t":"num","q":"Gross margin today, in %?","a":40,"tol":0.01,"unit":"%"},{"t":"num","q":"Gross margin next year, in %? (two decimals)","a":41.14,"tol":0.01,"unit":"%"}],"skills":["Accounting","Pricing"],"mins":15,"work":true,"tag":"Finance","how":"Today 800k ÷ 2M = 40%. Next year revenue $2.1M, COGS $1.236M, margin $864k ÷ $2.1M = 41.14%."},{"id":1468,"track":"ops","kind":"case","diff":"Hard","topic":"Finance","title":"Operating Leverage","prompt":"Fixed costs are $600,000 a year. Variable costs are 40% of revenue. Revenue is $1,500,000.","parts":[{"t":"num","q":"Profi   let i=0;while(i<a.length&&i<b.length&&a[i]===b[i])i++;let j=0;while(j<a.length-i&&j<b.length-i&&a[a.length-1-j]===b[b.length-1-j])j++;
  const del=a.length-i-j,ins=b.slice(i,b.length-j),dt=Math.round((Date.now()-t.t0)/100),paste=/paste|drop/i.test(inputType||"");

async function openMsgs(threadId){S.msg.open=true;S.msg.thread=threadId||null;await refreshMsgs();if(!threadId&&window.innerWidth>760&&S.msg.threads[0])await selectThread(S.msg.threads[0].id)}

async function sendMsg(retry){const mi=$("#msgIn");if(!mi&&!retry)return;const body=retry?retry.body:mi.value.trim();const files=retry?(retry.files||[]):attReady("msg");if(!files)return;if(!body&&!files.length)return;const tid=(mi&&mi.dataset.t)||S.msg.thread;if(!tid){toast("Pick a conversation first");return}S.msg.thread=tid;if(mi)mi.value="";
  if(!retry){S.att.msg=[]}const tmp=retry||{id:"tmp"+Date.now(),body,files,mine:true,at:new Date().toISOString()};tmp.pending=true;tmp.failed="";if(!retry)S.msg.list=(S.msg.list||[]).concat(tmp);renderMsgs(true);
  try{const m=await API.send(tid,body,files);if(!m||!m.id)throw new Error("The server didn't confirm the message. Run the latest Crossway SQL in Supabase.");
    S.msg.list=S.msg.list.map(x=>x===tmp?m:x);renderMsgs(true);S.msg.threads=await API.threads().catch(()=>S.msg.threads);renderMsgs(true)}
  catch(err){tmp.pending=false;tmp.failed=friendly(err);renderMsgs(true);toast(tmp.failed)}}

  if(a==="msend"){await sendMsg();return}
  if(a==="mretry"){const m=(S.msg.list||[]).find(x=>x.id===el.dataset.id);if(m)await sendMsg(m);return}
  if(a==="mblock"){const on=el.dataset.on==="1";try{await API.block(el.dataset.u,on);toast(on?"Blocked. They can't message you anymore.":"Unblocked.");await refreshMsgs(true)}catch(err){toast(friendly(err))}return}

  if(a==="msginv"){e.stopPropagation();await startMsg(null,el.dataset.inv);return}
  if(a==="mclose"&&S.msg.open&&!(el.classList.contains("scrim")&&e.target!==el)){S.msg.open=false;S.msg.thread=null;refreshInbox()}
});

  if(/product manag|\bpm\b|product owner|product lead|head of product|\bapm\b|product strateg|product operations|product associate/.test(t))return"product";
  if(/engineer|developer|software|\bswe\b|devops|infrastructure|front ?end|back ?end|full ?stack|mobile|architect/.test(t))return"eng";
  if(/market|growth|\bseo\b|content|brand|communications|lifecycle|community/.test(t))return"growth";
  if(/operations|\bops\b|strategy|finance|financial|consult|program manag|project manag|business analyst|chief of staff|revops|revenue operations|supply|logistics/.test(t))return"ops";
  if(/\banalyst\b/.test(t))return"data";return""}

async function obLinkedIn(){const f=await new Promise(res=>{const i=document.createElement("input");i.type="file";i.accept="application/pdf";i.onchange=()=>res(i.files[0]||null);i.click()});if(!f)return;

    for(let p=1;p<=Math.min(doc.numPages,8);p++){const pg=await doc.getPage(p),tc=await pg.getTextContent(),rows=new Map();tc.items.forEach(it=>{const y=Math.round(it.transform[5]),x=it.transform[4];const k=[...rows.keys()].find(k=>Math.abs(k-y)<3);const key=k!==undefined?k:y;if(!rows.has(key))rows.set(key,[]);rows.get(key).push([x,it.str])});
      [...rows.entries()].sort((a,b)=>b[0]-a[0]).forEach(([,r])=>{const t=r.sort((a,b)=>a[0]-b[0]).map(x=>x[1]).join(" ").replace(/\s+/g," ").trim();if(t&&!/^Page \d+ of \d+$/.test(t))lines.push(t)})}

    S.me=D;S.ob.imp=`Added ${P.exp.length} roles, ${P.edu.length} schools and ${P.skills.length} skills`;obRender()}catch(_){toast("We couldn't read that PDF. You can add your experience in Profile later.")}}
function obParseLinkedIn(L){const H=/^(Contact|Top Skills|Languages|Certifications|Honors-Awards|Publications|Summary|Experience|Education|Patents|Projects|Volunteer Experience)$/;
  const sec=n=>{const i=L.findIndex(l=>l===n);if(i<0)return[];let j=i+1;while(j<L.length&&!H.test(L[j]))j++;return L.slice(i+1,j)};
  const skills=sec("Top Skills").slice(0,8);const out={skills,exp:[],edu:[],headline:"",name:""};
  const DATE=/^(January|February|March|April|May|June|July|August|September|October|November|December) \d{4} - (Present|(January|February|March|April|May|June|July|August|September|October|November|December) \d{4})/;
  const ex=sec("Experience");let lastCo="";for(let i=0;i<ex.length;i++){if(!DATE.test(ex[i]))continue;const title=ex[i-1]||"",prev=ex[i-2]||"";const co=prev&&!DATE.test(prev)&&!/^\(?\d+ (year|month)/.test(prev)&&prev.length<70?prev:lastCo;lastCo=co;
    const m=ex[i].match(/\((?:(\d+) years?)?\s*(?:(\d+) months?)?\)/);const y=m?Math.max(1,Math.round((+m[1]||0)+(+m[2]||0)/12)):1;if(title&&co&&title!==co)out.exp.push({t:title.slice(0,80),co:co.slice(0,80),y})}
  const ed=sec("Education");for(let i=0;i<ed.length;i++){const d=ed[i+1]||"";if(/degree|bachelor|master|mba|phd|b\.?tech|b\.?s|m\.?s|diploma|associate|certificate/i.test(d)){const yr=(d.match(/(\d{4})\s*\)?\s*$/)||[])[1]||"";const [deg,field]=d.replace(/·.*$/,"").split(",").map(x=>(x||"").trim());out.edu.push({school:ed[i].slice(0,90),degree:deg||"",field:field||"",year:yr});i++}}
  const si=L.findIndex(l=>l==="Summary"||l==="Experience");if(si>2){out.headline=(L[si-2]||"").slice(0,120);out.name=(L[si-3]||"").slice(0,60)}return out}

/* ---------- browser back and forward stay inside Crossway ---------- */
(function(){
  const key=()=>({r:S.role||"",st:S.stab||"",ct:S.ctab||"",j:S.job||"",t:S.tab||"",ar:S.ar&&S.ar.open!=null?String(S.ar.open):"",pv:S.preview?1:0,m:$("#modalRoot")&&$("#modalRoot").innerHTML?1:0});
  const same=(a,b)=>a&&b&&["r","st","ct","j","t","ar","pv","m"].every(k=>a[k]===b[k]);
  let restoring=false,skipBack=false;
  function tick(){if(restoring||!S.user)return;const k=key(),cur=history.state&&history.state.jx;
    if(!cur){history.replaceState({jx:k},"");return}
    if(same(k,cur))return;
    // a sheet was closed with its own X: step back over the history entry we made for it
    if(cur.m&&!k.m&&["r","st","ct","j","t","ar","pv"].every(x=>k[x]===cur[x])){skipBack=true;history.back();return}
    history.pushState({jx:k},"")}
  window.addEventListener("popstate",e=>{const k=e.state&&e.state.jx;if(skipBack){skipBack=false;return}if(!k||!S.user)return;
    restoring=true;
    try{if($("#modalRoot").innerHTML&&!k.m)closeSheet();
      const tabChanged=k.st!==(S.stab||"")||k.ct!==(S.ctab||"")||k.j!==(S.job||"")||k.t!==(S.tab||"")||k.ar!==(S.ar&&S.ar.open!=null?String(S.ar.open):"")||(k.pv?true:false)!==!!S.preview;
      if(tabChanged){S.stab=k.st||S.stab;S.ctab=k.ct||S.ctab;if(k.j)S.job=k.j;if(k.t)S.tab=k.t;S.preview=!!k.pv;
        if(S.ar){S.ar.open=k.ar?(/^\d+$/.test(k.ar)?+k.ar:k.ar):null;S.ar.res=null;clearInterval(S.ar.timer)}
        render();window.scrollTo(0,0)}
      if(k.m&&!$("#modalRoot").innerHTML){/* can't rebuild an old sheet, so keep going back */history.back()}}
    finally{setTimeout(()=>{restoring=false;history.replaceState({jx:key()},"")},0)}});
  setInterval(tick,250);
})();

boot();
